# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit-konfiguration for CyclingZone.
# Rolle (#6654, ejer 15/10): BONUS, aldrig et krav. Review-kravet ejes af
# CI-checket `review-gate` (Codex på alle PR'er, + Claude på højrisiko; se
# scripts/review-gate.mjs). Gratis-planen giver ~1 review i timen, så
# auto-review er begrænset til HØJRISIKO-stierne (path_filters herunder, samme
# liste som review-gate-klassifikatoren): PR'er uden højrisiko-filer har intet
# at reviewe og springes over. Label risk:high/security kan ikke OR'es ind i
# CodeRabbit-config'en; review-gaten kræver i stedet Claude-review på dem.
# Princip: ADVISORY. CodeRabbit tilføjes IKKE som required status check.

language: "en-US"
early_access: false

reviews:
  # "chill" = færre nitpicks, fokus på reelle problemer. Matcher anti-slop-smag.
  profile: "chill"
  # Post ALDRIG "request changes" der formelt blokerer — review er rådgivende.
  request_changes_workflow: false
  high_level_summary: true
  # Ingen AI-slop-digt.
  poem: false
  review_status: true
  collapse_walkthrough: false
  # Lad CodeRabbit vente på og indregne CI-resultaterne i sit review.
  changed_files_summary: true

  auto_review:
    enabled: true
    # Matcher eksisterende politik: drafts får ikke auto-review.
    drafts: false
    base_branches:
      - "main"

  # KUN højrisiko-stier (#6654): motor, database/RLS, penge/økonomi,
  # betaling/abonnement, auth/sikkerhed/webhooks, cron, backend-routes/API, workflows. Hold i sync med
  # HIGH_RISK_RULES i scripts/review-gate.mjs (review-gate.test.mjs sammenligner
  # dem for hver fil i repoet). Derefter: skær støj fra (genereret, binært, lockfiles).
  path_filters:
    - "backend/lib/engine/**"
    - "database/**"
    - "supabase/**"
    - ".github/workflows/**"
    - ".github/actions/**"
    - ".gitleaks.toml"
    - "SECURITY.md"
    - "backend/**/*[Ee]conom*"
    - "backend/**/*[Ff]inanc*"
    - "backend/**/*[Ss]alar*"
    - "backend/**/*[Ww]age*"
    - "backend/**/*[Pp]rize*"
    - "backend/**/*[Ss]ponsor*"
    - "backend/**/*[Ll]oan*"
    - "backend/**/*[Pp]ayout*"
    - "backend/**/*[Pp]ric*"
    - "backend/**/*[Pp]ayment*"
    - "backend/**/*[Ww]allet*"
    - "backend/**/*[Bb]udget*"
    - "backend/**/*[Dd]ebt*"
    - "backend/**/*[Aa]uction*"
    - "backend/**/*[Bb]id*"
    - "backend/**/*[Bb]alance*"
    - "backend/**/*[Tt]ransfer*"
    - "backend/**/*[Cc]ontract*"
    - "backend/**/*[Mm]oney*"
    - "backend/**/*[Cc]ash*"
    - "backend/**/*[Rr]evenue*"
    - "backend/**/*[Ii]ncome*"
    - "backend/**/*[Ee]xpense*"
    - "backend/**/*[Tt]ransaction*"
    - "backend/**/*[Ll]edger*"
    - "backend/**/*[Vv]aluation*"
    - "backend/**/*[Bb]illing*"
    - "backend/**/*[Cc]heckout*"
    - "backend/**/*[Ss]ubscription*"
    - "backend/**/*[Ee]ntitlement*"
    - "backend/**/*[Aa]lunta*"
    - "backend/**/*[Rr]efund*"
    - "backend/**/*[Ii]nvoice*"
    - "backend/**/*[Ww]ebhook*"
    - "backend/**/*[Rr]ace*"
    - "backend/**/*[Ss]tage*"
    - "backend/**/*[Ff]inaliz*"
    - "backend/**/*[Ss]imulat*"
    - "backend/**/*[Ee]ngine*"
    - "backend/**/*[Rr]pc*"
    - "backend/**/*[Cc]ron*"
    - "backend/**/*[Ss]cheduler*"
    - "backend/routes/**"
    - "backend/api/**"
    - "backend/server.*"
    - "{backend,frontend/src/lib}/**/*[Aa]uth*"
    - "{backend,frontend/src/lib}/**/*[Tt]oken*"
    - "{backend,frontend/src/lib}/**/*[Ss]ecurity*"
    - "{backend,frontend/src/lib}/**/rls*"
    - "{backend,frontend/src/lib}/**/*[_.-]rls*"
    - "{backend,frontend/src/lib}/**/*Rls*"
    - "{backend,frontend/src/lib}/**/*RLS*"
    - "{backend,frontend/src/lib}/**/*[Gg]rant*"
    - "{backend,frontend/src/lib}/**/*[Pp]ermission*"
    - "{backend,frontend/src/lib}/**/*[Aa]dmin*"
    - "{backend,frontend/src/lib}/**/urlSafety*"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    - "!**/*-snapshots/**"
    - "!**/__snapshots__/**"
    - "!**/test-results/**"
    - "!**/playwright-report/**"
    - "!package-lock.json"
    - "!**/package-lock.json"
    - "!issues.json"
    - "!issues_list.txt"
    - "!issues_summary.txt"

  # Domæne-specifikke review-regler (afspejler repoets hard rules + lærte fælder).
  path_instructions:
    - path: "database/**/*.sql"
      instructions: >-
        Migrations auto-applies i produktion ved merge. Flag ALTID: (1) nye
        player-facing kolonner på riders/rider_derived_abilities uden tilsvarende
        GRANT SELECT (col) TO anon, authenticated i SAMME migration; (2) manglende
        eller for brede RLS-policies; (3) destruktiv DDL (DROP/TRUNCATE/ALTER der
        taber data). Mind om at PR'er med database/*.sql aldrig må auto-merges —
        ejeren merger dem manuelt.
    - path: "backend/**/*.{js,mjs}"
      instructions: >-
        Flag auth/RLS/input-validation-huller og brud på finans-, auktions- og
        ownership-invarianter. Nye endpoints eller nye SELECT-kolonner skal
        verificeres mod den reelle DB-skema og håndtere {data,error} eksplicit
        (throw, ikke tavst `|| []`). Vær opmærksom på PostgREST 1000-rækkers cap i
        ad-hoc scripts (.in() over mange ids trunkeres stille — kræver paginering).
    - path: "frontend/**/*.{js,jsx}"
      instructions: >-
        Player-facing copy er EN-først, DA-sekundær. Flag opfundet indhold og
        em-dashes (—) i copy. Ny/ændret spilmekanik kræver opdatering af
        help.json (en+da) og frontend/src/data/patchNotes.js. Undgå AI-slop-æstetik
        (rounded-2xl, glows, gradient-blobs, emoji-ikoner). Kun .js relative
        imports — extensionless imports består Vite men fejler i Node's ESM-loader
        i CI.
    - path: "frontend/**/*.test.{js,jsx}"
      instructions: >-
        Mocket Playwright/unit-test beviser kun rendering, ikke backend-kontrakten.
        Flag hvis ny adfærd kun er dækket af mocks uden en reel endpoint-/DB-test.
    - path: ".github/workflows/**"
      instructions: >-
        Flag manglende mindste-privilegium på permissions, hemmeligheder logget i
        klartekst, og pinning af actions. Vær opmærksom på recursive @claude/bot-loops.

  tools:
    # CodeRabbit kører repoets egne lint-/sikkerheds-konfigurationer og samler dem
    # i reviewet (.gitleaks.toml, eslint, yamllint findes allerede).
    gitleaks:
      enabled: true
    eslint:
      enabled: true
    yamllint:
      enabled: true
    # Indregn GitHub-checks i reviewet (advisory — blokerer ikke).
    github-checks:
      enabled: true
      timeout_ms: 180000
    # 25+ GitHub workflows — fang workflow-bugs/sikkerhed med lav støj.
    actionlint:
      enabled: true
    # Slå støj fra: grammatik-tjek rammer danske kommentarer/copy med falske
    # positiver, og markdownlint larmer på de mange docs/*.md. (anti-slop)
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

chat:
  # Tillad "@coderabbitai"-spørgsmål i PR-tråde (og at den lærer af din feedback).
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  # Lad CodeRabbit reviewe efter repoets EGNE husregler, ikke kun generiske.
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/GUARDRAILS_CORE.md"
      - "docs/GAME_INVARIANTS.md"
