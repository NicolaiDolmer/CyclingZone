name: Bug report
description: Noget virker ikke som forventet
title: "[bug] "
labels: ["type:bug", "claude:todo"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduktion
      description: Skridt-for-skridt så Claude (eller du) kan reproducere
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Forventet
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Faktisk
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshot / version
      description: Console-fejl, screenshot, app-version (fra patch notes), browser, evt. user-id
  - type: textarea
    id: til_doers
    attributes:
      label: Til dørs (8 krav)
      description: "Færdig betyder at spilleren har det. Status står i til-dørs-kommentaren, som scriptet opdaterer. Markér et krav i en kommentar med `Til dørs: <nr> ok|na <evidens eller begrundelse>` (na kræver en begrundelse). Se docs/GITHUB_WORKFLOW.md."
      value: |
        1. Bygget
        2. Merget
        3. Tændt i prod
        4. Synligt for spilleren
        5. Gammelt væk
        6. Hjælp opdateret
        7. Patch note
        8. Verificeret i prod
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "priority:high (data-tab eller blocker)"
        - "priority:med (irriterende, ingen workaround)"
        - "priority:low (kosmetisk / sjælden)"
      default: 1
    validations:
      required: true
