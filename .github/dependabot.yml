version: 2
updates:
  # Backend dependencies — Express, Supabase, Multer mv.
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    # Major-bumps lever som separate PRs (kræver review)
    ignore:
      # Express 5 har breaking middleware-API — #4565 - review 2026-12-01
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]

  # Frontend dependencies — React, Vite, Tailwind mv.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Tailwind 4 kræver postcss-plugin migration — #134 - review 2026-12-01
      # (#134 er formelt lukket COMPLETED, men frontend/package.json viser stadig
      # tailwindcss ^3.4.14 og migrationen er IKKE udført — se PR-body for #4551.
      # Reference bevidst bevaret indtil ejeren har taget stilling til issuet.)
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # vite- og @vitejs/plugin-react-ignores fjernet 2026-09-01 (#4551): repoet
      # kører allerede vite@8.2.2 og @vitejs/plugin-react@6.0.2 — de major-bumps
      # ignoren blokerede (5→8, samt v6 der krævede Vite 5+) er begge allerede
      # landet. Fremtidige majors (fx vite@9) er nu almindelige ejer-gatede
      # Dependabot-PRs uden for backend-minor-patch/frontend-minor-patch-grupperne.

  # Root scripts — sjældent ændret, men dækkes af Dependabot
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript
    groups:
      root-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — semver er stærk her, grupper alle update-types
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github_actions
    groups:
      gha-all:
        update-types:
          - major
          - minor
          - patch
