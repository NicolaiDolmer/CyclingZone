version: 2
# Dependabot bumper kun DIREKTE afhaengigheder. Transitive pakker i lockfilerne
# holdes opdateret af .github/workflows/lockfile-maintenance.yml (ugentligt,
# samme 7-dages cooldown), og prod-saarbarheder fanges dagligt af
# .github/workflows/prod-dependency-audit.yml (#6066).
updates:
  # Backend dependencies — Express, Supabase, Multer mv.
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    # 7 dages release-cooldown (ejer-beslutning 1/9, #4552) — dæmper supply-chain-
    # risikoen i friske releases, gælder alle update-types (også de ejer-gatede majors).
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    # Ingen ignore-entries: major-bumps lever som separate, ejer-gatede PRs.
    # Express-ignoren er fjernet 2026-09-11 sammen med migrationen til
    # express@5 (#4565) — Dependabot følger nu Express som alt andet.

  # Frontend dependencies — React, Vite, Tailwind mv.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
    # Ingen ignore-entries: frontend kører tailwindcss 4 (den gamle semver-major-
    # ignore er fjernet, #6605). vite- og @vitejs/plugin-react-ignores blev
    # fjernet 2026-09-01 (#4551). Major-bumps lever som separate, ejer-gatede
    # PRs. Luk aldrig en major-PR med @dependabot ignore (GITHUB_WORKFLOW.md).

  # Marketing-site (Next.js) — tilføjet 10/9 efter Dependabot #43-46 (to
  # critical i next, sharp, js-yaml) lå åbne uden patch-PR: mappen manglede i
  # konfigurationen, så Dependabot kun alarmerede og aldrig bumpede (PR #5072
  # lukkede dem manuelt). Samme cooldown/gruppering som frontend.
  - package-ecosystem: npm
    directory: /marketing
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    groups:
      marketing-minor-patch:
        update-types:
          - minor
          - patch
    # Ingen tailwind-ignore her: marketing kører Tailwind 4 efter migrationen i
    # #134 (PR #5084's postcss-fejl er løst med @tailwindcss/postcss).

  # Root scripts — sjældent ændret, men dækkes af Dependabot
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    groups:
      root-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — semver er stærk her, grupper alle update-types
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github_actions
    groups:
      gha-all:
        update-types:
          - major
          - minor
          - patch
