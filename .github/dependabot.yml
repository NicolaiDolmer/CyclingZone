version: 2
updates:
  # Backend dependencies — Express, Supabase, Multer mv.
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    # 7 dages release-cooldown (ejer-beslutning 1/9, #4552) — dæmper supply-chain-
    # risikoen i friske releases, gælder alle update-types (også de ejer-gatede majors).
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    # Ingen ignore-entries: major-bumps lever som separate, ejer-gatede PRs.
    # Express-ignoren er fjernet 2026-09-11 sammen med migrationen til
    # express@5 (#4565) — Dependabot følger nu Express som alt andet.

  # Frontend dependencies — React, Vite, Tailwind mv.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Tailwind 4 kræver postcss-plugin migration — #134 - review 2026-12-01
      # (#134 er formelt lukket COMPLETED, men frontend/package.json viser stadig
      # tailwindcss ^3.4.14 og migrationen er IKKE udført — se PR-body for #4551.
      # Reference bevidst bevaret indtil ejeren har taget stilling til issuet.)
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # vite- og @vitejs/plugin-react-ignores fjernet 2026-09-01 (#4551): repoet
      # kører allerede vite@8.2.2 og @vitejs/plugin-react@6.0.2 — de major-bumps
      # ignoren blokerede (5→8, samt v6 der krævede Vite 5+) er begge allerede
      # landet. Fremtidige majors (fx vite@9) er nu almindelige ejer-gatede
      # Dependabot-PRs uden for backend-minor-patch/frontend-minor-patch-grupperne.

  # Marketing-site (Next.js) — tilføjet 10/9 efter Dependabot #43-46 (to
  # critical i next, sharp, js-yaml) lå åbne uden patch-PR: mappen manglede i
  # konfigurationen, så Dependabot kun alarmerede og aldrig bumpede (PR #5072
  # lukkede dem manuelt). Samme cooldown/gruppering som frontend.
  - package-ecosystem: npm
    directory: /marketing
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    groups:
      marketing-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Tailwind 4 kræver postcss-plugin migration (samme beslutning som
      # frontend); Vercel-buildet fejlede på PR #5084 — #134 - review 2026-12-01
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # Root scripts — sjældent ændret, men dækkes af Dependabot
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    groups:
      root-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — semver er stærk her, grupper alle update-types
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github_actions
    groups:
      gha-all:
        update-types:
          - major
          - minor
          - patch
