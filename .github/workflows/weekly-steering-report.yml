name: Weekly steering report

# Soendagsrapport-rutine (#5328, "Tilgang C" fra
# docs/superpowers/specs/2026-09-17-weekly-steering-session-design.md):
# forbereder mandagens styringssession (docs/WEEKLY_STEERING.md) saa
# blok 1-2 bliver et beslutningsmoede, ikke en data-indsamling.
#
# HVAD DEN GOER (scripts/weekly-steering-report.mjs, syv sektioner):
#   1. Tal (monday-numbers.mjs) · 2. PR-koe (BLOCKED/DIRTY/roede checks) ·
#   3. Triage-kandidater (`triage:new`, delt logik med #5329) ·
#   4. Icebox-kandidater · 5. MASTERPLAN mod GitHub ·
#   6. Loefte-tjek (roadmap_items) · 7. Budget (token-hygiejne).
#
# READ-ONLY over for issues/PR'er (bindende, jf. issuet): begge jobs laeser
# kun via `gh` - INGEN `issue comment`, `issue edit`, `pr comment` osv. Den
# ENESTE skrivning er den nye rapport-fil i docs/audits/, committet direkte
# paa main (chore/docs-aendring, ingen PR - samme klasse som andre
# dokumentations-commits, jf. AGENTS.md-reglen "chore/docs på main") + en
# kort Discord-notifikation (samme moenster som supabase-advisor-sweep.yml).
#
# MINDSTE PRIVILEGIE (CodeRabbit-review, .coderabbit.yaml's regel for
# .github/workflows/**): rapport-generering (job `report`) koerer med KUN
# `contents: read`/`issues: read`/`pull-requests: read` og
# `persist-credentials: false` paa checkout - den koerer `npm ci` og
# scriptets gh/Supabase-kald, som ALDRIG skal have et skrive-token
# tilgaengeligt. Den producerede rapport sendes som et artifact til et
# SEPARAT job (`publish`), som er det ENESTE sted `contents: write` findes,
# og som ikke koerer nogen tredjeparts-afhaengighed (kun git + curl).
#
# Genbruger eksisterende secrets (INGEN nye): SUPABASE_URL/
# SUPABASE_SERVICE_KEY (samme som drift-monitor.yml/db-health.yml) til
# sektion 1+6, DISCORD_WEBHOOK (samme som *-sweep.yml) til notifikationen.
# Mangler Supabase-secrets, skriver rapporten det og springer sektion 1+6
# over i stedet for at fejle (samme graceful-degrade som monday-numbers.mjs).
#
# Tidspunkt: soendag aften CPH. Cron er UTC og drifter 1 time med sommertid -
# 18:00 UTC = 20:00 CEST (sommer, som nu) / 19:00 CET (vinter). Acceptabelt
# for en forberedende rapport ejeren laeser mandag morgen.
#
# Refs #5328 #5329.

on:
  schedule:
    - cron: '0 18 * * 0' # Soendag 18:00 UTC (~20:00 CPH sommertid)
  workflow_dispatch:

concurrency:
  group: weekly-steering-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      out: ${{ steps.report.outputs.out }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install root dependencies (kun @supabase/supabase-js bruges herfra)
        run: npm ci

      - name: Verificér Supabase-secrets (advisory - sektion 1+6 springes over hvis de mangler)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_SERVICE_KEY mangler - Tal (sektion 1) og Loefte-tjek (sektion 6) springes over."
          fi

      - name: Generér styringsrapport
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          DATE_CPH=$(TZ=Europe/Copenhagen date +%F)
          OUT="docs/audits/${DATE_CPH}-styringsrapport.md"
          mkdir -p "$(dirname "$OUT")"
          node scripts/weekly-steering-report.mjs --out "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload rapport som artifact (til publish-jobbet)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: styringsrapport
          path: ${{ steps.report.outputs.out }}
          retention-days: 7

  publish:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # persist-credentials: true - jobbet pusher/opretter PR med GITHUB_TOKEN i samme job (Refs #5441).
          persist-credentials: true

      - name: Download rapport-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: styringsrapport
          path: report-artifact

      - name: Commit rapport på main
        run: |
          set -euo pipefail
          OUT="${{ needs.report.outputs.out }}"
          mkdir -p "$(dirname "$OUT")"
          mv "report-artifact/$(basename "$OUT")" "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "Ingen aendringer at committe (uventet - filen er altid ny)."
            exit 0
          fi
          git commit -m "docs(audits): styringsrapport $(TZ=Europe/Copenhagen date +%F) (soendagsrutine, #5328)"
          git push origin HEAD:main

      - name: Notify Discord (kort besked til ejeren)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK er ikke konfigureret; sprang notifikation over."
            exit 0
          fi
          URL="${{ github.server_url }}/${{ github.repository }}/blob/main/${{ needs.report.outputs.out }}"
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"🗓️ **Styringsrapport klar** til mandagens session (#5328)\n${URL}\"}" \
            "$DISCORD_WEBHOOK"
