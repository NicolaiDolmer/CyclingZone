name: Playwright Smoke

# Kører den FULDE Playwright-suite (alle specs i frontend/tests/e2e,
# chromium-projekterne) — navnet "smoke" er historisk.
#
# Værn mod stille e2e-spec-rot (2026-07-02): da rytterprofil-redesignet (#2000,
# PR #2037) fjernede "Effektprofil"-sektionen, FANGEDE dette job regressionen i
# race-physiology-preview.spec.js — men PR'en blev merget alligevel, fordi
# frontend-smoke ikke er et required check og auto-merge kun venter på required
# checks. Fixet i PR #2114; postmortem:
# .claude/learnings/2026-07-02-e2e-spec-rot-ci-gater-kun-core-smoke.md
#
# Derfor: intet `paths:`-filter på workflow-niveau. Path-filteret ligger i
# `changes`-jobbet, så frontend-smoke ALTID rapporterer en konklusion (skipped
# tæller som grøn for branch protection) og dermed kan gøres til required
# check. Et workflow-niveau paths-filter ville efterlade et required check som
# "Expected" for evigt på docs-/backend-PR'er og blokere merge.

on:
  pull_request:
  workflow_dispatch:
  # Merge queue (4/8): suiten kørte allerede på selve PR'en. I køen sætter
  # changes-jobbet eksplicit frontend=false, så frontend-smoke skipper
  # (skipped = grøn for required checks, præcis som på docs-/backend-PR'er)
  # og kø-batches ikke betaler ~10 min windows-runtime pr. omgang.
  merge_group:
  # #4281: main kan stå rød i dagevis uden at nogen opdager det, fordi
  # `pull_request` kun kører mod DIFF'en — en PR merget med rød smoke (eller en
  # dårlig merge af to grønne PR'er) efterlader ingen efterfølgende kørsel der
  # fanger det. Konkret 26/8: et layout-overløb (#4275) + to røde e2e-tests lå
  # på ren main (verificeret på 20b1debe1) i mindst et døgn, uopdaget, indtil en
  # urelateret session kørte hele suiten af andre grunde.
  #
  # Natlig cron i stedet for en push-trigger pr. merge til main: suiten tager
  # ~18-20 min på windows-latest, og en push-trigger ville betale den pris
  # FOR HVER merge. Nightly fanger et rødt main inden for et døgn — samme
  # afvejning som #4155/#4161 → calendar-invariant-audit.yml.
  #
  # Denne trigger gør IKKE frontend-smoke til et nyt required check, og den
  # ændrer intet ved det eksisterende required check på PR'er: en scheduled
  # kørsel er ikke knyttet til en PR eller et commit-SHA nogen anden PR
  # afventer, den rapporterer kun til et tracking-issue (se nedenfor).
  schedule:
    - cron: '10 4 * * *' # dagligt 04:10 UTC — efter calendar-invariant-audit + clock-drift-test-check (begge 03:50)

permissions:
  contents: read

jobs:
  # Letvægts-path-filter (~10s ubuntu-job) i stedet for workflow-niveau `paths:`
  # — se kommentaren øverst. Matcher det gamle filter: frontend/** + denne fil.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.mg.outputs.frontend || steps.sch.outputs.frontend }}
    steps:
      - name: Merge group skips suite
        if: github.event_name == 'merge_group'
        run: echo "frontend=false" >> "$GITHUB_OUTPUT"
        id: mg
      - name: Nightly schedule always runs full suite
        if: github.event_name == 'schedule'
        run: echo "frontend=true" >> "$GITHUB_OUTPUT"
        id: sch
      - name: Detect frontend changes
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename')
          # Ikke `grep -q`: tidlig exit + pipefail kan SIGPIPE printf og vende
          # svaret til falsk "ingen frontend-ændringer". >/dev/null læser alt.
          if printf '%s\n' "$FILES" | grep -E '^(frontend/|\.github/workflows/playwright-smoke\.yml$)' > /dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-smoke:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write # fejl-kommentar på PR'en (rød suite må ikke være stille)
      issues: write # #4281: tracking-issue ved rødt på den natlige cron
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # #3429: CI kører alle tre projekter igen (desktop-chromium,
      # mobile-chromium, mobile-webkit). Webkit var droppet siden #1342 og var
      # dermed den eneste browser hvis snapshots kunne drive uset — se
      # playwright.config.js for hvorfor #1342's rodårsag ikke findes længere.
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      # #1342: byg frontend FØR Playwright, så webServer-kommandoen i CI kun er
      # `vite preview` (én proces). `npm run build && npm run preview` i én
      # webServer-kommando efterlod en forældreløs preview-proces på
      # windows-runneren som Playwright ikke kunne dræbe → jobbet hang 48 min.
      # VITE_E2E + VITE_-vars bages ind her på build-tid (preview serverer
      # statisk dist og læser dem ikke). Port 4173 = MAIN_PORT (se playwright.ports.js).
      - name: Build frontend (e2e)
        run: npm run build
        env:
          VITE_E2E: "1"
          VITE_API_URL: http://127.0.0.1:4173
          VITE_SUPABASE_URL: https://cycling-zone-e2e.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-key
          VITE_PUBLIC_APP_URL: http://127.0.0.1:4173

      # timeout-minutes: backstop så et fremtidigt teardown-hæng aldrig igen kan
      # æde en 6-timers runner (#1342: et webkit-hæng kørte 48 min før cancel).
      # #3429 lagde mobile-webkit tilbage i suiten (+~5 min lokalt målt: 125
      # tests, 4,6 min), så loftet er hævet fra 15 til 25 min. Det er stadig
      # stramt nok til at et ægte hæng fejler hurtigt frem for at hænge timevis.
      # #3554: guards.test.js fanger KILDEN statisk (en spec der skriver til en
      # committet sti). Den kører her fordi den er sekunder og skal fejle før
      # de 25 minutters suite, ikke efter.
      - name: Run e2e guards (static)
        run: node --test tests/e2e/guards.test.js

      - name: Run Playwright smoke
        # #2960 (1/9): 25 -> 35. Suiten er vokset til ~630 tests og tager 25-27
        # min paa runneren under React 19 - run 33513547245 blev draebt af
        # loftet med 587 bestaaede og NUL fejlede tests. 35 er stadig stramt
        # nok til at et aegte haeng fejler hurtigt (jf. #1342-historikken).
        timeout-minutes: 35
        run: npm run test:e2e

      # #3554 forward-guard: suiten må ALDRIG efterlade et beskidt arbejdstræ.
      # Fem specs skrev direkte til committede PNG'er, så den obligatoriske
      # lokale pre-flight altid efterlod 7-9 ændrede binære filer — enten
      # smuttede de med i en urelateret PR (PNG-diffs er usynlige i review),
      # eller man rullede tilbage med `git checkout --` og ramte ægte,
      # ucommittede skærmbilleder. Guarden ovenfor dækker `page.screenshot`;
      # denne dækker alt andet en fremtidig spec måtte finde på at skrive.
      - name: Verify e2e left the working tree clean
        shell: bash
        working-directory: .
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::e2e-suiten ændrede committede filer. Alt genereret skal skrives til test-results/ (se evidenceShotPath i frontend/tests/e2e/fixtures.js, #3554)."
            exit 1
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Rød suite skal være synlig i PR-samtalen (også på mobil, hvor
      # checks-boksen let overses — #2037 blev merget med rød frontend-smoke).
      # continue-on-error: fork-PR'er har read-only token; kommentaren er
      # best-effort og må aldrig maskere selve test-resultatet.
      - name: Comment on PR on failure
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "❌ **frontend-smoke fejlede** — den fulde Playwright-suite fandt regressioner. [Se run + playwright-report-artifact]($RUN_URL).

          Rød e2e må ikke merges stille (#2000-spec-rot → PR #2114): fix koden eller opdatér spec'en i samme PR. Auto-merge venter nu eksplicit på dette check."

      # #4281: samme mønster som calendar-invariant-audit.yml / clock-drift-test-check.yml
      # — ét samlet issue pr. audit-type, opdateret in-place i stedet for et nyt
      # issue pr. rød nat. Kun scheduled runs opretter/opdaterer issuet; en rød
      # PR-kørsel har allerede PR-kommentaren ovenfor og fejler sit eget required check.
      - name: Open or update tracking issue (nightly schedule only)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[bot] Playwright Smoke rød på main (nightly)';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              '## Playwright Smoke fejlede på en natlig kørsel mod main',
              '',
              'Dette er IKKE en PR-kørsel — den fulde e2e-suite kørte natligt mod main og fandt en rød tilstand ' +
                'som ingen PR-kørsel nødvendigvis vil fange igen (se [#4281](https://github.com/${{ github.repository }}/issues/4281)).',
              '',
              'main kan have stået rød siden den PR der introducerede fejlen blev merget — check playwright-report-artifact-en på run-linket for detaljer.',
              '',
              `Run-link: ${runUrl}`,
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'playwright-smoke-audit',
            });
            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
                labels: ['playwright-smoke-audit', 'priority:high', 'type:bug', 'claude:todo'],
              });
            }
