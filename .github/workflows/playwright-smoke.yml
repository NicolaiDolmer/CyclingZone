name: Playwright Smoke

# Kører den FULDE Playwright-suite (alle specs i frontend/tests/e2e, alle tre
# projekter) - navnet "smoke" er historisk.
#
# FORM (#4647, 2/9): suiten er delt i parallelle laner plus ét samle-job. Før:
# ét windows-job, workers=1, 26-28 min pr. PR.
#
# #5309 (16/9): laneantallet er ikke længere skrevet i denne fil. Det står i
# frontend/tests/e2e/shard-plan.json og udfoldes af `plan`-jobbet, fordi suiten
# vokser eksponentielt ved politik - hver bugfix får sin regressionstest, og
# testantallet gik fra 207 til 335 pr. projekt på 14 dage. En håndskrevet
# matrix med en fast grænse fælder i den situation dom over den tilfældige PR
# der krydser stregen (#5308) i stedet for over væksten.
#
#   plan ─→ e2e-shard (desktop-chromium-1of2) ─┐
#           e2e-shard (mobile-webkit-1of3)     ─┼─→ frontend-smoke  ← required check på main
#           … én lane pr. post i planen        ─┘
#
# Loftet pr. lane er sikkerhedsnettet mod ÉN løbsk test og er bevidst sat ~2,4x
# over faktisk forbrug: de samme 323 tests har målt 514-961 s på GitHubs delte
# runnere, så en grænse der køres tæt på er et møntkast. Vokser suiten forbi
# planen, melder den NATLIGE main-kørsel det (--enforce-plan) - aldrig en PR.
#
# Samle-jobbet SKAL hedde præcis `frontend-smoke`: det er navnet branch
# protection kræver. Matrix-jobs kan aldrig bære et required check-navn -
# GitHub suffikser dem med "(<matrix-værdi>)", og branch protection ville vente
# for evigt på et "frontend-smoke" der aldrig rapporterer (samme fejlklasse som
# scripts/check-required-ci-jobs.mjs sag (c) vogter). Derfor: shards kører
# testene, `frontend-smoke` samler op med `if: always()` og fejler hvis en shard
# fejlede ELLER brugte for lang tid.
#
# Runner: windows-latest, bevidst. De committede toHaveScreenshot-baselines er
# taget på Windows; et skift til ubuntu-latest kræver en re-baseline af ALLE
# snapshots i samme PR og er derfor et selvstændigt skridt (se #4647).
#
# Værn mod stille e2e-spec-rot (2026-07-02): da rytterprofil-redesignet (#2000,
# PR #2037) fjernede "Effektprofil"-sektionen, FANGEDE dette job regressionen i
# race-physiology-preview.spec.js - men PR'en blev merget alligevel, fordi
# frontend-smoke ikke er et required check og auto-merge kun venter på required
# checks. Fixet i PR #2114; postmortem:
# .claude/learnings/2026-07-02-e2e-spec-rot-ci-gater-kun-core-smoke.md
#
# Derfor: intet `paths:`-filter på workflow-niveau. Path-filteret ligger i
# `changes`-jobbet, så frontend-smoke ALTID rapporterer en konklusion og dermed
# kan være required check. Et workflow-niveau paths-filter ville efterlade et
# required check som "Expected" for evigt på docs-/backend-PR'er og blokere
# merge. Samle-jobbet kører derfor `if: always()` og er grønt-med-besked når
# shards'ene er `skipped`.

on:
  pull_request:
  workflow_dispatch:
  # Merge queue (4/8): suiten kørte allerede på selve PR'en. I køen sætter
  # changes-jobbet eksplicit frontend=false, så shards'ene skipper
  # (og frontend-smoke bliver grønt uden at måle noget, præcis som på
  # docs-/backend-PR'er) og kø-batches ikke betaler windows-runtime pr. omgang.
  merge_group:
  # #4281: main kan stå rød i dagevis uden at nogen opdager det, fordi
  # `pull_request` kun kører mod DIFF'en - en PR merget med rød smoke (eller en
  # dårlig merge af to grønne PR'er) efterlader ingen efterfølgende kørsel der
  # fanger det. Konkret 26/8: et layout-overløb (#4275) + to røde e2e-tests lå
  # på ren main (verificeret på 20b1debe1) i mindst et døgn, uopdaget, indtil en
  # urelateret session kørte hele suiten af andre grunde.
  #
  # Natlig cron i stedet for en push-trigger pr. merge til main: nightly fanger
  # et rødt main inden for et døgn - samme afvejning som #4155/#4161 →
  # calendar-invariant-audit.yml.
  #
  # Denne trigger gør IKKE frontend-smoke til et nyt required check, og den
  # ændrer intet ved det eksisterende required check på PR'er: en scheduled
  # kørsel er ikke knyttet til en PR eller et commit-SHA nogen anden PR
  # afventer, den rapporterer kun til et tracking-issue (se nedenfor).
  schedule:
    - cron: '10 4 * * *' # dagligt 04:10 UTC - efter calendar-invariant-audit + clock-drift-test-check (begge 03:50)

permissions:
  contents: read

jobs:
  # Letvægts-path-filter (~10s ubuntu-job) i stedet for workflow-niveau `paths:`
  # - se kommentaren øverst. Matcher det gamle filter: frontend/** + denne fil.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.mg.outputs.frontend || steps.sch.outputs.frontend }}
    steps:
      - name: Merge group skips suite
        if: github.event_name == 'merge_group'
        run: echo "frontend=false" >> "$GITHUB_OUTPUT"
        id: mg
      - name: Nightly schedule always runs full suite
        if: github.event_name == 'schedule'
        run: echo "frontend=true" >> "$GITHUB_OUTPUT"
        id: sch
      - name: Detect frontend changes
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename')
          # Ikke `grep -q`: tidlig exit + pipefail kan SIGPIPE printf og vende
          # svaret til falsk "ingen frontend-ændringer". >/dev/null læser alt.
          if printf '%s\n' "$FILES" | grep -E '^(frontend/|scripts/(check-e2e-shard-budget|extract-e2e-flakes)\.mjs$|\.github/workflows/playwright-smoke\.yml$)' > /dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # #5309: matrixen er DATA, ikke YAML. frontend/tests/e2e/shard-plan.json
  # bestemmer hvor mange laner hvert Playwright-projekt får, og dette job
  # ekspanderer den. Et laneantal ændres dermed med ÉT tal i en datafil, aldrig
  # med en workflow-refaktor — og det samme script der ekspanderer planen er
  # det der dømmer bagefter, så formatet kun er forstået ét sted.
  #
  # Jobbet hænger bevidst IKKE på `changes`: det er ti sekunder på ubuntu og
  # kører parallelt med path-filteret, så det aldrig ligger på kritisk sti.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Kun `matrix` eksponeres: samle-jobbet laeser planen direkte fra filen, saa
    # laner og loft aldrig kan komme fra to kilder. `keys`/`ceiling-minutes`
    # skrives stadig af scriptet og staar i step-loggen til fejlsoegning.
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # Planen VALIDERES her (readPlan kaster ved enhver uklarhed). En plan der
      # ikke kan læses må aldrig degradere til en tom matrix: nul laner = nul
      # tests = et grønt samle-job uden at noget blev kørt.
      - name: Expand shard plan to matrix
        id: plan
        run: node scripts/check-e2e-shard-budget.mjs --plan frontend/tests/e2e/shard-plan.json --emit-github-output >> "$GITHUB_OUTPUT"

  # ÉN lane pr. (projekt, shard). fail-fast: false - en rød mobile-webkit-lane
  # må ikke aflyse de andre, ellers mister samle-jobbet sine målinger og kan
  # ikke sige HVAD der var galt.
  e2e-shard:
    needs: [changes, plan]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    # Uden en `name:` ville GitHub navngive jobbet efter ALLE matrix-værdier
    # ("e2e-shard (chromium, desktop-chromium-1of2, ...)"). Lanens key er den
    # eneste identitet der betyder noget, og den er stabil på tværs af kørsler.
    # Dynamisk navn er ufarligt her: e2e-shard er IKKE et required check —
    # matrix-jobs kan aldrig bære et (se scripts/check-required-ci-jobs.mjs).
    name: e2e-shard (${{ matrix.key }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Kun den browser lanen faktisk bruger installeres: `npx playwright
        # install chromium webkit` hentede før begge på ALLE kørsler.
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # #3429: CI kører alle tre projekter (desktop-chromium, mobile-chromium,
      # mobile-webkit). Webkit var droppet siden #1342 og var dermed den eneste
      # browser hvis snapshots kunne drive uset - se playwright.config.js for
      # hvorfor #1342's rodårsag ikke findes længere.
      - name: Install Playwright browser
        run: npx playwright install ${{ matrix.browser }}

      # #1342: byg frontend FØR Playwright, så webServer-kommandoen i CI kun er
      # den statiske server (én proces). `npm run build && npm run preview` i én
      # webServer-kommando efterlod en forældreløs preview-proces på
      # windows-runneren som Playwright ikke kunne dræbe → jobbet hang 48 min.
      # VITE_E2E + VITE_-vars bages ind her på build-tid (serveren serverer
      # statisk dist og læser dem ikke). Port 4173 = MAIN_PORT (playwright.ports.js).
      - name: Build frontend (e2e)
        run: npm run build
        env:
          VITE_E2E: "1"
          VITE_API_URL: http://127.0.0.1:4173
          VITE_SUPABASE_URL: https://cycling-zone-e2e.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-key
          VITE_PUBLIC_APP_URL: http://127.0.0.1:4173

      # #3554: guards.test.js fanger KILDEN statisk (en spec der skriver til en
      # committet sti). Den kører her fordi den er sekunder og skal fejle før
      # suiten, ikke efter.
      - name: Run e2e guards (static)
        run: node --test tests/e2e/guards.test.js

      # Selve lanen. `--grep-invert @flaky` er karantæne-mekanismen: en test
      # der tagges `@flaky` køres stadig (steppet nedenfor), men kan ikke gøre
      # dette blokerende step rødt. Karantæne-listen bor dermed synligt i
      # spec-filerne, ikke i en sidekanal. `--shard` deler projektets testliste
      # EFTER grep-filteret, så lanerne er lige store.
      #
      # Tiden måles omkring PRÆCIS denne kommando (ikke hele jobbet): det er
      # suitens egen tid, uafhængig af npm ci/browser-download, og det er den
      # scripts/check-e2e-shard-budget.mjs holder op mod loftet pr. lane.
      # `group` bærer projektet videre, så samle-jobbet kan lægge lanerne sammen
      # og regne ud om planen har laner nok (#5309).
      # timeout-minutes: backstop mod et teardown-hæng (#1342 kørte 48 min før
      # cancel). 20 er rigeligt over loftets 10 og stadig stramt.
      - name: Run Playwright shard
        id: shard
        shell: bash
        timeout-minutes: 20
        env:
          PW_PROJECT: ${{ matrix.project }}
          PW_SHARD: ${{ matrix.shard }}
          PW_KEY: ${{ matrix.key }}
        run: |
          start=$(date +%s)
          set +e
          npm run test:e2e -- --project="$PW_PROJECT" --shard="$PW_SHARD" --grep-invert @flaky
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          mkdir -p ../e2e-shard-metrics
          printf '{"project":"%s","group":"%s","seconds":%s,"exitCode":%s}\n' "$PW_KEY" "$PW_PROJECT" "$elapsed" "$status" > "../e2e-shard-metrics/$PW_KEY.json"
          echo "lane $PW_KEY: ${elapsed}s, exit $status"
          exit $status

      # Flake-sporing: en test der fejlede første forsøg og bestod ved retry er
      # grøn i dag og dermed usynlig (#4292: 1 rød test af 560, en NY hver gang).
      # json-rapporten markerer netop den klasse som "flaky"; her høstes den til
      # en artifact. Kører før karantæne-steppet nedenfor, som overskriver
      # rapporten.
      # Filnavnet bærer LANEN (unikt pr. job), men rapporten mærkes med
      # PROJEKTET, så --merge lægger et projekts laner sammen til én linje.
      - name: Collect flake report
        if: always()
        shell: bash
        working-directory: .
        env:
          PW_PROJECT: ${{ matrix.project }}
          PW_KEY: ${{ matrix.key }}
        run: node scripts/extract-e2e-flakes.mjs --report frontend/playwright-report/results.json --project "$PW_PROJECT" --out "e2e-shard-metrics/flakes-$PW_KEY.json"

      # Karantæne-kørslen: `@flaky`-tagede tests KØRER, men blokerer ikke.
      # `--pass-with-no-tests` fordi listen normalt er tom - og den skal være tom
      # for at #4647 kan lukkes. continue-on-error gør resultatet synligt i
      # step-listen uden at farve jobbet.
      #
      # #5309: karantænen er IKKE shardet - den kører kun på projektets første
      # lane. Ellers ville de samme @flaky-tests køre én gang pr. lane, og
      # webkit ville betale for dem tre gange uden at dække mere.
      - name: Run quarantined @flaky tests (non-blocking)
        if: success() && startsWith(matrix.shard, '1/')
        continue-on-error: true
        shell: bash
        timeout-minutes: 10
        env:
          PW_PROJECT: ${{ matrix.project }}
        run: npm run test:e2e -- --project="$PW_PROJECT" --grep @flaky --pass-with-no-tests

      # #3554 forward-guard: suiten må ALDRIG efterlade et beskidt arbejdstræ.
      # Fem specs skrev direkte til committede PNG'er, så den obligatoriske
      # lokale pre-flight altid efterlod 7-9 ændrede binære filer - enten
      # smuttede de med i en urelateret PR (PNG-diffs er usynlige i review),
      # eller man rullede tilbage med `git checkout --` og ramte ægte,
      # ucommittede skærmbilleder.
      - name: Verify e2e left the working tree clean
        if: always()
        shell: bash
        working-directory: .
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::e2e-suiten ændrede committede filer. Alt genereret skal skrives til test-results/ (se evidenceShotPath i frontend/tests/e2e/fixtures.js, #3554)."
            exit 1
          fi

      # Målinger + flake-rapport SKAL uploades også når shard'en er rød:
      # samle-jobbet fælder dommen ud fra dem, og et manglende måletal er i sig
      # selv rødt (gaten må ikke kunne blive grøn ved at tabe sin måling).
      - name: Upload shard metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-shard-metrics-${{ matrix.key }}
          path: e2e-shard-metrics/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.key }}
          path: frontend/playwright-report/
          retention-days: 7

  # Samle-checket. Navnet er en KONTRAKT med branch protection (se
  # scripts/ci-required-checks.json) - omdøb det aldrig uden at ejeren har
  # ændret required checks først. `if: always()` fordi et skipped samle-job og
  # et skipped shard-sæt ser ens ud for GitHub, men kun det første kan bære
  # tidsbudget-gaten.
  frontend-smoke:
    needs: [changes, plan, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download-artifact på egne run-artifacts
      pull-requests: write # fejl-kommentar på PR'en (rød suite må ikke være stille)
      issues: write # #4281: tracking-issue ved rødt på den natlige cron
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Path-filteret er selv en gate: fejler det, ved vi ikke om suiten SKULLE
      # have kørt, og så må samle-checket ikke lyse grønt.
      - name: Fail if the path filter itself failed
        if: needs.changes.result == 'failure' || needs.changes.result == 'cancelled'
        run: |
          echo "::error::changes-jobbet endte som ${{ needs.changes.result }} - vi ved ikke om e2e-suiten skulle køre. frontend-smoke kan ikke give grønt lys."
          exit 1

      # Samme klasse som ovenfor: en ugyldig shard-plan giver nul laner, og nul
      # laner ser ud som en grøn suite. Uden planen ved vi heller ikke HVILKE
      # laner der skulle have rapporteret, så gaten kan ikke dømme.
      - name: Fail if the shard plan could not be expanded
        if: needs.plan.result != 'success'
        run: |
          echo "::error::plan-jobbet endte som ${{ needs.plan.result }} - frontend/tests/e2e/shard-plan.json kunne ikke udfoldes til en matrix. frontend-smoke kan ikke give grønt lys."
          exit 1

      # Gaten tester sig selv FØR den dømmer. Sekunder på ubuntu, og den fanger
      # den værste fejlklasse et budget-check kan have: et grønt check der har
      # mistet sin evne til at blive rødt.
      - name: Unit-test the gate scripts
        run: node --test scripts/check-e2e-shard-budget.test.mjs scripts/extract-e2e-flakes.test.mjs

      - name: Download shard metrics
        if: needs.e2e-shard.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-shard-metrics-*
          merge-multiple: true
          path: e2e-shard-metrics

      - name: Merge flake reports
        if: needs.e2e-shard.result != 'skipped'
        run: node scripts/extract-e2e-flakes.mjs --merge e2e-shard-metrics --out e2e-flakes.json

      - name: Upload flake report
        if: needs.e2e-shard.result != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-flakes
          path: e2e-flakes.json
          retention-days: 14

      # Dommen. Loft og forventede laner kommer nu fra shard-planen, så YAML og
      # plan aldrig kan drive fra hinanden (#5309).
      #
      # `--enforce-plan` KUN på den natlige main-kørsel: vokser suiten forbi sin
      # plan, er det main der skal melde det, ikke den tilfældige PR der lagde
      # de sidste sekunder på. Præcis den forveksling blokerede #5308, som ikke
      # fejlede noget. På PR'er står anbefalingen i job-summary som info.
      - name: Lane ceiling gate + plan verdict
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
          ENFORCE_PLAN: ${{ github.event_name == 'schedule' }}
        run: |
          args=(--dir e2e-shard-metrics
                --plan frontend/tests/e2e/shard-plan.json
                --shards-result "$SHARDS_RESULT")
          if [ "$ENFORCE_PLAN" = "true" ]; then args+=(--enforce-plan); fi
          node scripts/check-e2e-shard-budget.mjs "${args[@]}"

      # Rød suite skal være synlig i PR-samtalen (også på mobil, hvor
      # checks-boksen let overses - #2037 blev merget med rød frontend-smoke).
      # continue-on-error: fork-PR'er har read-only token; kommentaren er
      # best-effort og må aldrig maskere selve test-resultatet.
      - name: Comment on PR on failure
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "❌ **frontend-smoke fejlede** - enten fandt en Playwright-lane regressioner, eller en enkelt lane brød loftet. [Se run + artifacts]($RUN_URL): \`playwright-report-<lane>\` for fejlene, \`e2e-flakes\` for tests der først bestod ved retry.

          Rød e2e må ikke merges stille (#2000-spec-rot → PR #2114): fix koden eller opdatér spec'en i samme PR. Auto-merge venter nu eksplicit på dette check."

      # #4281: samme mønster som calendar-invariant-audit.yml / clock-drift-test-check.yml
      # - ét samlet issue pr. audit-type, opdateret in-place i stedet for et nyt
      # issue pr. rød nat. Kun scheduled runs opretter/opdaterer issuet; en rød
      # PR-kørsel har allerede PR-kommentaren ovenfor og fejler sit eget required check.
      - name: Open or update tracking issue (nightly schedule only)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '[bot] Playwright Smoke rød på main (nightly)';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              '## Playwright Smoke fejlede på en natlig kørsel mod main',
              '',
              'Dette er IKKE en PR-kørsel - den fulde e2e-suite kørte natligt mod main og fandt en rød tilstand ' +
                'som ingen PR-kørsel nødvendigvis vil fange igen (se [#4281](https://github.com/${{ github.repository }}/issues/4281)).',
              '',
              'main kan have stået rød siden den PR der introducerede fejlen blev merget - check artifacts på run-linket: ' +
                '`playwright-report-<lane>` for selve fejlene, `e2e-flakes` for tests der kun bestod ved retry.',
              '',
              'Er kørslen rød UDEN en fejlet test, er det vækst-alarmen (#5309): den natlige kørsel er den eneste der ' +
                'håndhæver shard-planen. Se `Lane ceiling gate + plan verdict` i job-summary - den skriver det præcise ' +
                'nye laneantal, som rettes i `frontend/tests/e2e/shard-plan.json`.',
              '',
              `Run-link: ${runUrl}`,
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'playwright-smoke-audit',
            });
            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
                labels: ['playwright-smoke-audit', 'priority:high', 'type:bug', 'claude:todo'],
              });
            }
