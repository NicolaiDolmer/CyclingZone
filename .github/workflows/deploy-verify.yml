name: Deploy verify

# Trigger:
#  - Push til main (manuel commit eller bruger-merget PR — push-eventet fyrer for
#    alle non-GITHUB_TOKEN merges). BEMÆRK: ingen `pull_request: closed`-trigger;
#    den var redundant med push og gav tvilling-runs for samme merge-commit, som
#    cancellede hinanden via concurrency-gruppen (falsk "cancelled" i verify-deploy.ps1).
#  - workflow_dispatch — eksplicit trigger fra auto-merge.yml/dependabot-auto-merge.yml,
#    fordi GITHUB_TOKEN-merges ikke fyrer push/pull_request events (anti-loop-safeguard).
# Effekt: Venter på de deployments committet faktisk udløser (Vercel kun ved
# frontend/-ændringer, Railway kun ved backend/-ændringer — spejler Vercels
# Ignored Build Step i frontend/vercel.json), smoke-tester prod, kommenterer ✅/❌
# på den merged PR. Brugeren kan trygt være offline efter mobile-merge.
#
# Railway-status (#5489): GitHub-deployment-status for Railway kan hænge bag
# Railway selv — set 22/9 og 23/9 (PR #5542), begge gange stod GH-deployment
# "in_progress" i 10+ min mens Railway selv meldte SUCCESS, og merge-køen
# stoppede på et FALSK rødt signal. Når secrets.RAILWAY_TOKEN er sat, bruger
# "Wait for Vercel + Railway deployments" derfor scripts/railway-deploy-status.mjs
# (Railways egen GraphQL-API) som PRIMÆR kilde for Railway: "success" markerer
# Railway-kravet opfyldt med det samme, "failed" stopper trinnet med det
# samme (rødt, uden at afvente polling-deadline). "pending" venter videre;
# med token kan et gammelt GitHub-success ikke opfylde Railway-kravet.
# Uden token bruges den nyeste GitHub-deployment-status. Smoke-test kører
# kun efter result=success, aldrig efter en afsluttet pending-observation, uanset
# hvilken kilde der gav grønt.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to verify (defaults to main HEAD)'
        required: false
      pr_number:
        description: 'PR number to comment on (optional, auto-detected from SHA)'
        required: false

permissions:
  contents: read
  pull-requests: write
  deployments: read
  actions: read
  issues: write

concurrency:
  group: deploy-verify-${{ github.event.inputs.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 40 min deployment polling + up to ~48 min short-cadence proof (Railway
    # drain + 30 min cadence + margin) + probes. scripts/merge-queue.ps1's
    # -DeployVerifyTimeoutMinutes must stay above this (asserted in
    # scripts/merge-queue-deploy-pending.test.mjs, #6318).
    timeout-minutes: 100
    steps:
      # #5424: flyttet hertil (var før "Wait for Vercel + Railway
      # deployments", se den bevarede begrundelse ved den næste brug af
      # `Checkout` nedenfor) fordi "Resolve target sha and PR number" nu selv
      # kalder scripts/ci/deploy-verify-pr-lookup.mjs og derfor skal have et
      # arbejdstræ FØR sit eget første trin, ikke bagefter. persist-
      # credentials: false — ingen trin i dette job laver authenticated
      # Git-kald; de der taler med GitHub-API'et bruger deres eget GH_TOKEN
      # via env.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Node 24 (readiness probe and deploy tooling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Resolve target sha and PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          # workflow-output-guard (#4463): steppet skriver til GITHUB_OUTPUT og
          # piper til `jq`/scripts/ci/deploy-verify-pr-lookup.mjs nedenfor —
          # uden pipefail ville et fejlende `gh api` kunne skjules bag den
          # højre sides exit-kode. `resolve_pr_number()` undgår allerede det
          # via $()+if, og GitHub Actions' default bash kører allerede med
          # `-eo pipefail`, så denne linje er reelt dokumentation/vagt-
          # tilfredsstillelse (satser den statiske lint,
          # scripts/lint-workflow-output-masking.mjs, ikke en adfærdsændring)
          # — men den er eksplicit her så enhver FREMTIDIG pipe i steppet er
          # dækket uanset hvilken shell-invokation der ender med at køre den. (#5424)
          set -o pipefail

          # #5286: `gh api ... --jq` lader jq læse et TOMT svar direkte, og et
          # transient tomt body (ikke en fejl-exit, bare intet output) giver
          # "unexpected end of JSON input" og vælter hele trinnet. Hent derfor
          # raw body FØRST, tjek at det ikke er tomt, og pip den til jq bagefter
          # — og prøv 3 gange med 2s mellemrum, fordi det er set at rette sig
          # selv på gen-kørsel (flake 15/9). En commit uden nogen PR (direkte
          # push, docs/chore) er en LOVLIG sti — den skal give et tomt NUMBER,
          # ikke en fejl.
          #
          # CodeRabbit (denne PR): `|| true` må ikke sluge en RIGTIG gh-fejl
          # (rate-limit/auth/netværk) og lade den se ud som "ingen PR" — så
          # skipper begge PR-kommentar-trin stille for en commit der RENT
          # FAKTISK har en PR. Derfor holdes exit-koden ($rc) adskilt fra et
          # tomt-men-succesfuldt svar: kun et ægte 200-svar (evt. med et tomt
          # `[]`) tæller som "bekræftet ingen PR"; blev alle 3 forsøg ved med
          # at FEJLE (rc != 0) kan vi ikke afgøre det, og trinnet vælter
          # bevidst med en tydelig fejl i stedet for at gætte "ingen PR".
          # #5424: `echo "$out" | jq -r '.[0].number // empty'` antog at et
          # ikke-tomt svar med rc=0 altid var et array. Et gyldigt 200-svar
          # der er JSON, men IKKE et array (fx en rate-limit-/abuse-besked som
          # `{"message": "..."}`), fik `.[0]` til at kaste jq's egen "Cannot
          # index object with number"-fejl — trinnet væltede med jq's rå
          # fejltekst i stedet for den tilsigtede ::error::-besked og uden at
          # bruge de resterende retry-forsøg. Selve array/ikke-array-tjekket
          # (og JSON.parse/tomt-body-haandteringen) er flyttet til
          # scripts/ci/deploy-verify-pr-lookup.mjs (enhedstestet, node --test
          # scripts/ci/deploy-verify-pr-lookup.test.mjs) — et ikke-array-svar
          # behandles nu som transient og forsøges igen, ligesom et tomt body
          # eller en fejlende `gh api` allerede gjorde.
          resolve_pr_number() {
            local sha="$1"
            local attempt out rc
            for attempt in 1 2 3; do
              if out=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" 2>/dev/null); then
                rc=0
              else
                rc=$?
              fi
              if [[ "$rc" -eq 0 ]]; then
                local number lookup_err
                lookup_err=$(mktemp)
                if number=$(printf '%s' "$out" | node scripts/ci/deploy-verify-pr-lookup.mjs 2>"$lookup_err"); then
                  rm -f "$lookup_err"
                  echo "$number"
                  return 0
                fi
                echo "::warning::gh api commits/$sha/pulls gav et svar der ikke kunne bruges (forsøg $attempt/3): $(cat "$lookup_err")" >&2
                rm -f "$lookup_err"
                [[ "$attempt" -lt 3 ]] && sleep 2
                continue
              fi
              echo "::warning::gh api commits/$sha/pulls fejlede (forsøg $attempt/3, exit=$rc)" >&2
              [[ "$attempt" -lt 3 ]] && sleep 2
            done
            echo "::error::gh api commits/$sha/pulls blev ved med at fejle/give et ubrugbart svar efter 3 forsøg (sidste exit=$rc) — kan ikke afgøre PR-tilknytning" >&2
            return 1
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SHA="${INPUT_SHA:-$(gh api repos/${{ github.repository }}/commits/main --jq .sha)}"
            if [[ -n "$INPUT_PR_NUMBER" ]]; then
              NUMBER="$INPUT_PR_NUMBER"
            else
              NUMBER=$(resolve_pr_number "$SHA")
            fi
          else
            SHA="$PUSH_SHA"
            NUMBER=$(resolve_pr_number "$SHA")
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Verifying sha=$SHA, PR=#${NUMBER:-(direct push)}"

      - name: Checkout target SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false
          # Keep full history: frontend-deployment-needed.mjs and the empty-
          # commit check compare against "$SHA^1" (#6318).
          fetch-depth: 0

      - name: Determine required deployments (path-based)
        id: required
        # Vercel: the canonical classifier covers frontend, backend/lib,
        # root/shared and unknown inputs; only positively independent changes
        # omit Vercel. Full history (target checkout fetch-depth 0) avoids
        # shallow-parent truncation.
        # Railway + cron impact (#6318): complete, SHA-matched diff including
        # rename origins. Unknown evidence fails closed; it must never produce
        # an empty cron impact. A verified empty commit has no impact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          node scripts/ci/cron-deploy-verification.mjs --impact
          # Use the canonical conservative frontend-input rule.
          REQUIREMENT=$(node scripts/frontend-deployment-needed.mjs "$SHA")
          NEED_VERCEL=$(jq -r 'if (.required | type) == "boolean" then (.required | tostring) else error("Invalid requirement") end' <<<"$REQUIREMENT" 2>/dev/null || true)
          [[ "$NEED_VERCEL" == "false" ]] || NEED_VERCEL=true
          echo "Changed files touch: frontend=$NEED_VERCEL"
          echo "need_vercel=$NEED_VERCEL" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel + Railway deployments
        id: deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.sha }}
          NEED_VERCEL: ${{ steps.required.outputs.need_vercel }}
          NEED_RAILWAY: ${{ steps.required.outputs.need_railway }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          # #4463: uden pipefail sluger `jq` gh's exit-kode, saa et fejlsvar fra
          # API'et ville laese som "ingen deployments" i stedet for som en fejl.
          set -o pipefail
          DEADLINE=$(($(date +%s) + 2400))  # pending is not a deployment failure
          CRON_SINCE=""
          while [[ "$(date +%s)" -lt "$DEADLINE" ]]; do
            DEPLOYMENTS=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&per_page=20")
            VERCEL_OK=false
            RAILWAY_OK=false
            # Refresh the boundary per observation round. Vercel may take much
            # longer; its wait must not consume a short cron's proof window.
            CRON_SINCE=""
            VERCEL_SEEN=false
            RAILWAY_SEEN=false

            for ID in $(echo "$DEPLOYMENTS" | jq -r '.[].id'); do
              CREATOR=$(echo "$DEPLOYMENTS" | jq -r ".[] | select(.id==$ID) | .creator.login")
              STATE=$(gh api "repos/${{ github.repository }}/deployments/$ID/statuses" --jq '.[0].state // "pending"')
              echo "  deployment $ID by $CREATOR → $STATE"
              if [[ "$CREATOR" == vercel* && "$VERCEL_SEEN" == "false" ]]; then
                VERCEL_SEEN=true
                if [[ "$STATE" == "success" ]]; then VERCEL_OK=true; fi
                if [[ "$NEED_VERCEL" == "true" && ( "$STATE" == "failure" || "$STATE" == "error" ) ]]; then
                  echo "result=failed" >> "$GITHUB_OUTPUT"
                  echo "::error::Latest Vercel deployment failed"
                  exit 1
                fi
              fi
              if [[ "$CREATOR" == railway* && "$RAILWAY_SEEN" == "false" ]]; then
                RAILWAY_SEEN=true
                if [[ "$STATE" == "success" ]]; then RAILWAY_OK=true; fi
                if [[ "$NEED_RAILWAY" == "true" && -z "${RAILWAY_TOKEN:-}" && ( "$STATE" == "failure" || "$STATE" == "error" ) ]]; then
                  echo "result=failed" >> "$GITHUB_OUTPUT"
                  echo "::error::Latest Railway deployment failed"
                  exit 1
                fi
              fi
            done

            # #5489: GitHub-deployment-status for Railway er sat som fallback —
            # naar RAILWAY_TOKEN er sat, spoerger vi Railways egen GraphQL-API
            # direkte (samme kilde som `railway deployment list`) og bruger DEN
            # som primaer kilde. API pending kan ikke overstyres af et gammelt GitHub-success; et genbyg af samme SHA er ikke verificeret.
            # aegte Railway-fejl skal ikke vente paa at et laenge-forsinket
            # GitHub-signal til sidst ogsaa siger nej. Uden RAILWAY_TOKEN
            # (secret ikke sat) er denne blok en no-op og adfaerden er
            # bit-identisk med foer #5489.
            if [[ "$NEED_RAILWAY" == "true" && -n "${RAILWAY_TOKEN:-}" ]]; then
              # Command substitution fanger kun stdout (den ENE statuslinje);
              # scriptets diagnostik paa stderr flyder uaendret til dette trins
              # log. `|| echo pending` daekker det usandsynlige tilfaelde at
              # node-processen selv craeshede haardt (scriptet exit'er ellers
              # altid 0, se dets egen top-level catch).
              RAILWAY_API_STATUS=$(node scripts/railway-deploy-status.mjs || echo "pending")
              echo "  Railway API-status (primaer kilde, #5489): $RAILWAY_API_STATUS"
              if [[ "$RAILWAY_API_STATUS" == "failed" ]]; then
                echo "::error::Railway API meldte FAILED for ${SHA:0:7} — stopper med det samme (uden at afvente polling-deadline, #5489). Se scripts/railway-deploy-status.mjs' stderr-diagnostik i dette trins log ovenfor."
                {
                  echo "railway=failed"
                  echo "result=failed"
                  echo "vercel=$VERCEL_OK"
                } >> "$GITHUB_OUTPUT"
                exit 1
              fi
              if [[ "$RAILWAY_API_STATUS" == "success" ]]; then
                RAILWAY_OK=true
              else
                RAILWAY_OK=false
              fi
            fi

            # Use a conservative UTC observation AFTER positive Railway READY,
            # never the workflow start time. The round satisfying all required
            # deployments supplies the latest positive Railway observation.
            if ! $RAILWAY_OK; then CRON_SINCE=""; fi
            if $RAILWAY_OK && [[ -z "$CRON_SINCE" ]]; then
              CRON_SINCE=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
            fi

            VERCEL_SATISFIED=$VERCEL_OK
            RAILWAY_SATISFIED=$RAILWAY_OK
            [[ "$NEED_VERCEL" == "false" ]] && VERCEL_SATISFIED=true
            [[ "$NEED_RAILWAY" == "false" ]] && RAILWAY_SATISFIED=true

            if $VERCEL_SATISFIED && $RAILWAY_SATISFIED; then
              if [[ "$NEED_VERCEL" == "false" && "$VERCEL_OK" == "false" ]]; then
                echo "Vercel ikke påkrævet (ingen frontend/-ændringer — Ignored Build Step skipper builden)"
                echo "vercel=skipped (no frontend changes)" >> "$GITHUB_OUTPUT"
              else
                echo "vercel=success" >> "$GITHUB_OUTPUT"
              fi
              if [[ "$NEED_RAILWAY" == "false" && "$RAILWAY_OK" == "false" ]]; then
                echo "Railway ikke påkrævet (ingen backend/-ændringer)"
                echo "railway=skipped (no backend changes)" >> "$GITHUB_OUTPUT"
              else
                echo "railway=success" >> "$GITHUB_OUTPUT"
              fi
              echo "All required deployments succeeded"
              echo "cron_since=$CRON_SINCE" >> "$GITHUB_OUTPUT"
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 15
          done

          echo "::notice::Deployment verification pending; no release verification performed yet"
          {
            echo "vercel=$VERCEL_OK"
            echo "railway=$RAILWAY_OK"
            echo "result=pending"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Deployment still pending
        if: steps.deployments.outputs.result == 'pending'
        run: echo "::notice::AFVENTER deployment; not verified. Merge queue must retry this attempt."

      - name: Verify affected cron check-ins
        id: crons
        if: steps.deployments.outputs.result == 'success'
        env:
          AFFECTED_SLUGS: ${{ steps.required.outputs.affected_slugs }}
          CRON_SINCE: ${{ steps.deployments.outputs.cron_since }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          node scripts/ci/cron-deploy-verification.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # Explicit markers make successful-but-deferred runs distinguishable from
      # verified releases through the attempt-specific Jobs API (#6318).
      - name: Cron check-ins verified
        if: steps.deployments.outputs.result == 'success' && steps.crons.outputs.state == 'verified'
        run: echo "Affected cron check-ins verified (or no affected monitored jobs)."

      - name: Cron check-ins deferred
        if: steps.deployments.outputs.result == 'success' && steps.crons.outputs.state == 'deferred'
        run: echo "::notice::AFVENTER CHECK-IN for long cadences (> 30 min); short cadences verified. Non-blocking for the merge queue; see jobs and deadlines in summary."

      - name: Smoke-test prod
        id: smoke
        if: steps.deployments.outputs.result == 'success'
        run: |
          # #5905: deployment liveness stays DB-independent; release smoke requires DB readiness.
          # Shared probe: at most 6 x 5s requests + 5 x 5s pauses; fails closed on non-ready payloads.
          if node backend/scripts/checkBackendReadiness.ts https://cyclingzone-production.up.railway.app; then
            BACKEND_HEALTH=200
          else
            BACKEND_HEALTH=unavailable
          fi
          BACKEND_AUTH=$(curl -s -o /dev/null -w "%{http_code}" https://cyclingzone-production.up.railway.app/api/auctions)
          FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" -L https://cyclingzone.org/)

          {
            echo "backend_health=$BACKEND_HEALTH"
            echo "backend_auth=$BACKEND_AUTH"
            echo "frontend=$FRONTEND"
          } >> "$GITHUB_OUTPUT"

          # Acceptkriterier:
          # - /health/ready returnerer 200 med status=ok, db=ok
          # - /api/auctions uden token returnerer 401 (auth virker)
          # - frontend root returnerer 200 (efter redirect)
          OK=true
          [[ "$BACKEND_HEALTH" != "200" ]] && OK=false
          [[ "$BACKEND_AUTH" != "401" ]] && OK=false
          [[ "$FRONTEND" != "200" ]] && OK=false

          if $OK; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Checkout skete tidligere frem til #5489 (kun her, "kun til cache-header-
      # guarden") — flyttet op til før "Wait for Vercel + Railway deployments",
      # fordi det trin nu også skal kunne køre scripts/railway-deploy-status.mjs,
      # og siden #5424 helt op til jobbets første trin (se `Checkout` derover).
      # Uden ARBEJDSTRÆET fejlede trinnet nedenfor med MODULE_NOT_FOUND på hvert
      # eneste push siden 7/8 — dvs. cache-guarden fra #3484 har aldrig kørt,
      # samtidig med at en permanent rød Deploy verify gjorde at ægte fejl
      # druknede (#3565). Denne pointe gælder stadig — den tidligere checkout
      # dækker den blot nu også.
      - name: Verify CDN cache-headers (#2423 — edge-request-forbrug)
        if: steps.deployments.outputs.result == 'success'
        run: node scripts/check-cdn-cache-headers.mjs https://cyclingzone.org

      # #4545: enhedstesten i frontend/vercel.rewrites.test.js bevogter vores HENSIGT
      # i repoet. Denne probe bevogter OPFØRSLEN i prod, og de fanger forskellige ting:
      # en ændring i Vercel-dashboardet eller en ændret header-semantik lader repo-testen
      # stå grøn mens spillerne rammer muren. Proben er kørt mod prod FØR fixet og
      # fejler dér (exit 1), så den er målt til at kunne bide.
      - name: Verify manglende asset fejler rent (#4545)
        if: steps.deployments.outputs.result == 'success' && steps.required.outputs.need_vercel == 'true'
        run: |
          if node scripts/check-asset-miss-behaviour.mjs --base=https://cyclingzone.org; then
            echo "✅ **Asset-miss-probe: OK** — en manglende chunk giver 404, ikke en HTML-side." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Asset-miss-probe: FEJLET** — en manglende chunk resolver til noget ugyldigt. Spillere kan sætte sig permanent fast bag chunk-fallbacken (#4545)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify Sentry source-maps uploaded (#621 item 3)
        id: sourcemaps
        # Opt-in via secrets. Hvis SENTRY_AUTH_TOKEN ikke er konfigureret i GitHub Actions
        # endnu, springes step (uden at fejle deploy-verify). Tilfoej alle 3 secrets for
        # at aktivere guarden mod stille source-map upload-fejl.
        # Kun relevant når Vercel faktisk byggede — backend-only commits har ingen
        # ny frontend-release, så en manglende bundle dér er forventet.
        if: steps.deployments.outputs.result == 'success' && steps.required.outputs.need_vercel == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # Et skip skal kunne SES. Guarden stod "success" i tre måneder mens den i
          # virkeligheden aldrig kørte, fordi det tidlige exit 0 kun efterlod en
          # annotation ingen kigger på (#4335). Derfor job-summary på hver udgang.
          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [[ -z "$SENTRY_AUTH_TOKEN" || -z "$SENTRY_ORG" || -z "$SENTRY_PROJECT" ]]; then
            echo "::warning::Sentry source-map guard skipped — add SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECT secrets to enable (#621 item 3)"
            note "⏭️ **Sentry source-map guard: SPRUNGET OVER** — secrets mangler i Actions, source-map-upload er uovervåget (#4335)."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sentry release name = git SHA (per frontend/vite.config.js sentryVitePlugin release.name).
          #
          # VIGTIGT: @sentry/vite-plugin v5 uploader source maps som ARTIFACT BUNDLES
          # (debug-id-baseret), ikke som legacy release-files. Det gamle endpoint
          # releases/<sha>/files/ returnerer derfor [] SELV NÅR uploaden er lykkedes.
          # Målt mod prod 28/8: release c9ce695 gav en fuldt symboliseret stacktrace,
          # men havde 0 legacy files og 1 artifact bundle med 357 filer. Havde guarden
          # været tændt med det gamle kald, var deploy-verify gået rød på hvert
          # frontend-deploy. Se #4335.
          HTTP_CODE=$(curl -s -o /tmp/sentry-bundles.json -w "%{http_code}" \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Accept: application/json" \
            "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/files/artifact-bundles/?query=$SHA&per_page=1")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Sentry API returnerede $HTTP_CODE — tjek SENTRY_AUTH_TOKEN scope (project:releases)"
            note "❌ **Sentry source-map guard: API-fejl $HTTP_CODE.**"
            echo "result=api-error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          FILE_COUNT=$(jq '[.[].fileCount] | add // 0' /tmp/sentry-bundles.json)

          # Fallback: releases uploadet ad den gamle vej har ingen bundle, men har files.
          # Beholdt så guarden ikke fejler falsk hvis upload-metoden skifter tilbage.
          if [[ "$FILE_COUNT" -eq 0 ]]; then
            LEGACY_CODE=$(curl -s -o /tmp/sentry-files.json -w "%{http_code}" \
              -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
              -H "Accept: application/json" \
              "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/releases/$SHA/files/?per_page=1")
            if [[ "$LEGACY_CODE" == "200" ]]; then
              FILE_COUNT=$(jq 'length' /tmp/sentry-files.json)
            fi
          fi

          if [[ "$FILE_COUNT" -eq 0 ]]; then
            echo "::error::Sentry release ${SHA:0:7} har 0 source-map files — hverken artifact bundle eller legacy files. Vercel sentryVitePlugin skippede upload — tjek SENTRY_AUTH_TOKEN/ORG/PROJECT i Vercel project env."
            note "❌ **Sentry source-map guard: 0 filer for ${SHA:0:7}** — upload fejlede stille."
            echo "result=empty-release" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Sentry release ${SHA:0:7} har $FILE_COUNT source-map files uploaded"
          note "✅ Sentry source-map guard: ${SHA:0:7} har $FILE_COUNT filer uploadet."
          echo "result=success" >> "$GITHUB_OUTPUT"

      # #4545: chunk-fejl blev droppet i beforeSend, saa der fandtes ikke et tal at
      # kigge paa. Nu naar de Sentry, og dette trin saetter tallet paa hvert deploy.
      # Uden det er "synlig i Sentry" kun sandt for den der husker at aabne Sentry.
      # Skip skal kunne SES (#4335) — derfor job-summary paa hver udgang.
      #
      # #4595 (7/9): trinnet er ADVISORY paa budgettet. Hvorfor: tallet er et
      # RULLENDE 24-timers vindue over hele spillerbasen, ikke en maaling af dette
      # deploy. Det maalte niveau har ligget paa 111-232/24 t mod budget 25, saa
      # gaten var roed paa hvert eneste frontend-merge (#4884, #4913) og skjulte
      # dermed de aegte deploy-fejl trinnene omkring den findes for at fange.
      # Et tal der altid er roedt er ikke en gate, det er stoej.
      # Rod-aarsagen (deploy-unikke bytes i hashede assets) rettes i samme PR;
      # naar tallet er faldet, kan budgettet saettes til den nye baseline og
      # `exit 1` tages tilbage.
      # Den HAARDE graense staar stadig: over CHUNK_ERROR_HARD_LIMIT er noget
      # katastrofalt galt (fx et deploy der serverer 404 paa alle chunks), og
      # DET skal stoppe koerslen.
      - name: Chunk-fejl-rate efter deploy (#4545)
        if: steps.deployments.outputs.result == 'success' && steps.required.outputs.need_vercel == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          CHUNK_ERROR_BUDGET: '25'
          CHUNK_ERROR_HARD_LIMIT: '1000'
        run: |
          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [[ -z "$SENTRY_AUTH_TOKEN" || -z "$SENTRY_ORG" ]]; then
            echo "::warning::Chunk-fejl-rate sprunget over — SENTRY_AUTH_TOKEN/SENTRY_ORG mangler i Actions"
            note "⏭️ **Chunk-fejl-rate: SPRUNGET OVER** — secrets mangler, saa omfanget af chunk-fejl er uovervaaget (#4545)."
            exit 0
          fi

          CODE=$(curl -s -o /tmp/chunk-rate.json -w "%{http_code}" \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Accept: application/json" \
            --get "https://sentry.io/api/0/organizations/$SENTRY_ORG/events/" \
            --data-urlencode "field=count()" \
            --data-urlencode "query=frontend_error_kind:chunk_load_error" \
            --data-urlencode "statsPeriod=24h" \
            --data-urlencode "dataset=errors")

          if [[ "$CODE" != "200" ]]; then
            echo "::warning::Sentry events-API returnerede $CODE"
            note "⚠️ **Chunk-fejl-rate: API-fejl $CODE** — tallet kunne ikke hentes (#4545)."
            exit 0
          fi

          COUNT=$(jq '[.data[]["count()"]] | add // 0' /tmp/chunk-rate.json)
          echo "Chunk-load-fejl seneste 24 t: $COUNT (budget $CHUNK_ERROR_BUDGET)"

          if [[ "$COUNT" -gt "$CHUNK_ERROR_HARD_LIMIT" ]]; then
            echo "::error::$COUNT chunk-load-fejl seneste 24 t — over den haarde graense $CHUNK_ERROR_HARD_LIMIT"
            note "❌ **Chunk-fejl-rate: $COUNT paa 24 t** — over den HAARDE graense ($CHUNK_ERROR_HARD_LIMIT). Det er ikke almindelig staleness: tjek om deployet serverer 404 paa chunks (asset-miss-proben) og overvej rollback."
            exit 1
          fi

          if [[ "$COUNT" -gt "$CHUNK_ERROR_BUDGET" ]]; then
            # Advisory (#4595): rullende 24 t over hele spillerbasen, ikke dette deploy.
            echo "::warning::$COUNT chunk-load-fejl seneste 24 t, budget er $CHUNK_ERROR_BUDGET (advisory, se #4595)"
            note "❌ **Chunk-fejl-rate: $COUNT paa 24 t** (budget $CHUNK_ERROR_BUDGET) — ADVISORY, stopper ikke koerslen. Spillere rammer chunk-fallbacken. Tallet er et rullende 24-timers vindue, ikke en maaling af dette deploy. Rod-aarsag + maal: #4595. Haard graense: $CHUNK_ERROR_HARD_LIMIT."
            exit 0
          fi
          note "✅ Chunk-fejl-rate: $COUNT paa 24 t (budget $CHUNK_ERROR_BUDGET, haard graense $CHUNK_ERROR_HARD_LIMIT)."

      # #5162 (K3): retention for carry-forward efter maalt klient-alder. Read-only
      # mod PostHog; eneste skrivning er retention.json i den private bucket.
      # Mangler secrets, springer scriptet selv over (gulvet holder listen).
      - name: Release-retention efter maalt klient-alder (#5162)
        if: steps.deployments.outputs.result == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
        run: node scripts/measure-client-release-age.mjs

      - name: Comment success on merged PR
        if: success() && steps.deployments.outputs.result == 'success' && steps.crons.outputs.state == 'verified' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          VERCEL: ${{ steps.deployments.outputs.vercel }}
          RAILWAY: ${{ steps.deployments.outputs.railway }}
        run: |
          BODY="<!-- deploy-verify:$SHA -->
          ✅ **Deploy verificeret LIVE** — \`${SHA:0:7}\`
          - Vercel deploy: ${VERCEL:-success}
          - Railway deploy: ${RAILWAY:-success}
          - Affected cron check-ins: verified (or no affected monitored jobs)
          - Backend \`/health/ready\` = 200 (DB-readiness med retry)
          - Backend \`/api/auctions\` (no auth) = 401 (auth gates virker)
          - Frontend root = 200

          Du kan trygt lukke telefonen — det er live."
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq ".[] | select(.body | contains(\"<!-- deploy-verify:$SHA -->\")) | .id" | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
          fi

      - name: Comment deferred cron proof on merged PR
        if: success() && steps.crons.outputs.state == 'deferred' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          CRON_SINCE: ${{ steps.deployments.outputs.cron_since }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="<!-- deploy-verify:$SHA -->
          ## AFVENTER CHECK-IN (${SHA:0:7})

          Railway er klar, smoke er groen, og alle berorte jobs med kort kadence (<= 30 min) har tikket efter deployet.
          Jobs med lang kadence (> 30 min) **afventer check-in** og er ikke bevist endnu.
          Boundary: $CRON_SINCE (+ Railway drain). [Jobs, sidste check-in og deadline]($RUN_URL).
          Merge-koeen fortsaetter; cron-heartbeat-vagten alarmerer hvis et langt job misser sin deadline."
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq ".[] | select(.body | contains(\"<!-- deploy-verify:$SHA -->\")) | .id" | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
          fi

      - name: Comment pending on merged PR
        if: success() && steps.deployments.outputs.result == 'pending' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          BODY="<!-- deploy-verify:$SHA -->
          ## Deploy afventer (${SHA:0:7})

          Deployment er endnu ikke klar. Release er **ikke verificeret**; ingen smoke-kontrol eller succesmelding er lavet. Merge-koeen genkoerer samme workflow og venter paa naeste attempt."
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq ".[] | select(.body | contains(\"<!-- deploy-verify:$SHA -->\")) | .id" | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
          fi

      - name: Comment failure on merged PR
        if: failure() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKEND_HEALTH: ${{ steps.smoke.outputs.backend_health }}
          BACKEND_AUTH: ${{ steps.smoke.outputs.backend_auth }}
          FRONTEND: ${{ steps.smoke.outputs.frontend }}
          VERCEL: ${{ steps.deployments.outputs.vercel }}
          RAILWAY: ${{ steps.deployments.outputs.railway }}
        run: |
          BODY="<!-- deploy-verify:$SHA -->
          ❌ **Deploy-verify FEJLEDE** — \`${SHA:0:7}\` — [se log]($RUN_URL)
          - Vercel: \`${VERCEL:-unknown}\`
          - Railway: \`${RAILWAY:-unknown}\`
          - Backend \`/health/ready\`: \`${BACKEND_HEALTH:-?}\` (forventet 200)
          - Backend \`/api/auctions\`: \`${BACKEND_AUTH:-?}\` (forventet 401)
          - Frontend: \`${FRONTEND:-?}\` (forventet 200)

          **Deploy-/release-verifikation fejlede.** Se det konkrete fejlende trin. Pending rapporteres særskilt og bliver aldrig markeret verificeret."
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq ".[] | select(.body | contains(\"<!-- deploy-verify:$SHA -->\")) | .id" | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
          fi
