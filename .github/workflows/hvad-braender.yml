# "Hvad brænder"-vagten (#6548, design-go ejer 12/10).
# Daglig rapport kl. 08:00 dansk tid i det fastgjorte issue #6549; kommentar kun ved rødt.
# Deterministisk node-script, ingen AI-tokens. Kun læsning fra prod (to skalar-selects).
# To cron-tider dækker sommer- og vintertid. GitHub forsinker planlagte kørsler op til
# flere timer (13/10), så gaten er "kl. 08 eller senere"; scriptet rapporterer kun én
# gang pr. dag (reportedOn i state). Manuel kørsel springer begge tjek over.
name: Hvad brænder

on:
  schedule:
    - cron: '0 6 * * *'   # 08:00 CEST
    - cron: '0 7 * * *'   # 08:00 CET
  workflow_dispatch:

concurrency:
  group: hvad-braender
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only at 08 Copenhagen time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Copenhagen date +%-H)" -ge 8 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Report
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          HVAD_BRAENDER_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node scripts/ops/hvad-braender.mjs
