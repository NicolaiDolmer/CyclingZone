name: Dependency review

on:
  pull_request:
  # Merge queue (4/8): dependency-review-action kræver PR-kontekst og kan ikke
  # evaluere en merge group. Valideringen skete på PR'en; i køen rapporterer
  # jobbet grønt via pass-through-steppet nedenfor (samme context-navn).
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Merge group pass-through
        if: github.event_name == 'merge_group'
        run: echo "Dependency review koerte paa selve PR'en; en merge group har ingen PR-diff at gennemgaa. Rapporterer groent."

      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Block vulnerable dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
