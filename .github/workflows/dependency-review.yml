name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Block vulnerable dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # MIDLERTIDIG, ÉN advisory — se #2960 for planen om at fjerne den igen.
          #
          # GHSA-qwww-vcr4-c8h2 "React Router: RSC Mode CSRF Bypass" rammer hele
          # react-router 7.12.0–8.2.x. Første patch er 8.3.0, som kræver React 19
          # (peer >= 19.2.7). Vi kører React 18.3.1, og React-major er ignoreret i
          # dependabot.yml som en dedikeret migration. Samtidig kræver Dependabot-
          # alerts #22/#23/#24 mindst react-router 7.18.0 — der findes altså ingen
          # version der lukker begge dele uden React 19 (PR #2959).
          #
          # Advisory'en kan ikke ramme denne app: RSC-mode bruges ikke. Ren SPA med
          # <BrowserRouter>/<Routes>, ingen loaders/actions, ingen data-router, ingen
          # @react-router/*-framework-pakker og intet server-runtime — entry-server.jsx
          # kalder kun renderToString på build-tidspunktet.
          #
          # fail-on-severity er UÆNDRET for alt andet. Tilføj ikke flere GHSA'er her
          # uden samme skriftlige begrundelse + et issue der fjerner dem igen.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
