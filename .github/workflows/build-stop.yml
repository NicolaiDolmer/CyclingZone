name: Build-stop check

# Byggestop-check i PR-CI (#7336 trin 1.3, spec 2026-10-29 §3.1).
#
# Naar scripts/build-stop.json har active:true, fejler checket en PR hvis ingen
# af de issues den refererer (Refs/Closes #N i body, issue-nummer i branch-navn)
# staar paa finishList, cleanupList eller brandList. Dependabot og rene
# docs/ops-PR'er er undtaget. Logik + tests: scripts/check-build-stop-pr.mjs.
#
# Dette workflow goer IKKE checket required - det er ejerens indstilling
# (branch protection), se PR-bodyen for kommandoen. Check'et hedder `build-stop`.
#
# Sikkerhed: PR-titel/-body/-branch gives KUN videre som env-variabler, aldrig
# interpoleret ind i et shell-kommandostreng. Ingen secrets, kun laese-rettigheder.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Merge queue: body og branch er allerede valideret paa selve PR'en; en merge
  # group har ingen PR-body. Jobbet rapporterer groent via pass-through.
  merge_group:

permissions:
  contents: read

jobs:
  build-stop:
    name: build-stop
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Merge group pass-through
        if: github.event_name == 'merge_group'
        run: echo "Byggestop blev valideret paa selve PR'en. Rapporterer groent i koeen."

      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check PR against the build stop
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")"
          export CHANGED_FILES
          node scripts/check-build-stop-pr.mjs
