name: Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC — catch-up scan af fuld history

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for push/schedule scans; PR scans bruger kun diff

      # Supply chain (#4467): en action pinnet til et FLYTBART tag er en secret-laek-vektor
      # paa linje med en haardkodet noegle - flyttes tagget upstream, koerer fremmed kode i
      # et job der har vores secrets. Guarden bor i `gitleaks`-jobbet fordi det ER et
      # required status check; laa den i et advisory job, ville den vaere roed og merge
      # alligevel (praecis fejlen reviewet fandt i #4456).
      - name: Test action-pinning guard
        run: node --test scripts/lint-action-pinning.test.mjs

      - name: Run action-pinning guard
        run: node scripts/lint-action-pinning.mjs

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
