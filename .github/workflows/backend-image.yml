# Backend-image til GHCR (#7034).
#
# Railways builds var pauset fra 21/10 (sikkerhedshaendelse, #7029), mens
# backenden koerte videre. Vi kunne ikke faa en rettelse ud. Dette workflow
# bygger backend-imaget hos GitHub, saa Railway kan deploye et faerdigt image
# i stedet for at bygge selv. Skiftet af Railway-servicens kilde er ejer-gated:
# docs/runbooks/RAILWAY_IMAGE_DEPLOY.md.
#
# PR: byg + roegtest, intet push. main: byg + roegtest + push
# ghcr.io/<owner>/cyclingzone-backend:<sha> og :main.

name: Backend image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cyclingzone-backend
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image name in lower case
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile.ghcr
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Roegtest uden secrets: Node-versionen matcher engines, og hele
      # runtime-modulgrafen (routes, cron, health) kan loades uden
      # devDependencies. Serveren startes ikke, fordi cron ellers rammer DB.
      - name: Smoke test image
        run: |
          expected=$(jq -r '.engines.node' backend/package.json)
          actual=$(docker run --rm "$IMAGE:$GITHUB_SHA" node -p 'process.versions.node')
          echo "engines.node=$expected image=$actual"
          case "$expected" in
            [0-9]*.[0-9]*.[0-9]*) [ "$actual" = "$expected" ] || { echo "::error::Node $actual matcher ikke engines $expected"; exit 1; } ;;
            *) [ "${actual%%.*}" = "24" ] || { echo "::error::Node $actual er ikke 24.x"; exit 1; } ;;
          esac
          docker run --rm \
            -e SUPABASE_URL=http://127.0.0.1:9 -e SUPABASE_SERVICE_KEY=smoke -e SUPABASE_ANON_KEY=smoke \
            "$IMAGE:$GITHUB_SHA" node --input-type=module -e \
            "await import('./lib/healthRoutes.ts'); await import('./routes/api.js'); await import('./cron.js'); console.log('IMPORT_OK'); process.exit(0)"
          docker run --rm "$IMAGE:$GITHUB_SHA" id -un | grep -qx node

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile.ghcr
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "### Backend image"
            echo "- Tag: \`$IMAGE:$GITHUB_SHA\`"
            echo "- Pushet: $PUSH"
          } >> "$GITHUB_STEP_SUMMARY"
