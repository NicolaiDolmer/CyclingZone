name: CI (AI-Autopilot)

on:
  push:
    branches:
      - main
  pull_request:
  # Merge queue (4/8): required checks skal rapportere på merge-group-SHA'en,
  # ellers timer køen ud. Alle jobs her er fil-/test-baserede og kører uændret.
  merge_group:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: test-service-key
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Type-check race engine v4 (#4030)
        run: npx tsc -p tsconfig.engine.json

      - name: Run backend tests
        run: npm test -- --test-reporter=spec

      - name: Lint backend
        run: npm run lint

      - name: Race-engine launch-gate (#1102)
        run: npm run race:gate

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_URL: https://example.invalid
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch main for PatchNotes guard
        if: github.event_name == 'pull_request'
        working-directory: .
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Test PatchNotes version guard
        working-directory: .
        run: node --test scripts/check-patch-notes-version.test.js

      - name: Check PatchNotes version uniqueness
        working-directory: .
        run: node scripts/check-patch-notes-version.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      # Brohoved-typecheck. Spejler backend's "Type-check race engine v4"-step.
      # Strict paa .ts/.tsx, JS passerer uroert, saa gaten koster ingen migrering.
      # Fanger den bugklasse schema-column-guard blev haandbygget mod (#3586):
      # en select mod en kolonne skemaet ikke har giver nu en typefejl i editoren.
      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test -- --test-reporter=spec

      - name: Build frontend
        run: npm run build

      # #2423: gaten maaler det BYGGEDE output, ikke konfigurationen. Den fejler
      # hvis nogen bygget URL baerer "?dpl=" — praecis den omskrivning der
      # knaekkede hele appen i prod 4/9 (PR #4745, revertet). Skew Protection
      # koerer via __vdpl-cookien i stedet, som ikke roerer en eneste URL.
      - name: Test skew-protection guard
        working-directory: .
        run: node --test scripts/check-skew-protection.test.mjs

      - name: Run skew-protection guard
        working-directory: .
        run: node scripts/check-skew-protection.mjs

      # Uden de naeste steps er vagten ovenfor en attrap: CI bygger uden skew-env,
      # saa gate 1 har intet "?dpl=" at finde og gate 2 skipper. #4745's
      # regression ville altsaa vaere gaaet groent igennem. Her bygges der MED
      # env slaaet til, saa gate 2/2b maaler noget den dag SKEW_PROTECTION_ENABLED
      # i frontend/src/lib/skewProtection.js er `true` igen. Lige nu (hotfix 4/9,
      # #2423) er flaget `false` — koden kalder aldrig installSkewProtection(),
      # saa disse steps bygger og verificerer reelt kun gate 1 igen; vagten
      # printer "[skip] Skew Protection er slaaet fra i koden (#2423)" og er
      # groen, hvilket er den tilsigtede tilstand, ikke en attrap.
      - name: Build frontend with Skew Protection enabled (#2423)
        env:
          VERCEL_SKEW_PROTECTION_ENABLED: "1"
          VERCEL_DEPLOYMENT_ID: dpl_ci_test
          VERCEL_ENV: production
        run: npm run build

      - name: Run skew-protection guard (skew-enabled build)
        working-directory: .
        env:
          VERCEL_DEPLOYMENT_ID: dpl_ci_test
          VERCEL_ENV: production
        run: node scripts/check-skew-protection.mjs

      # Preview-deploys maa aldrig pinnes: samme env, men VERCEL_ENV=preview skal
      # give et build UDEN deployment-id, og vagten skal bekraefte det.
      - name: Build frontend as a preview deploy (#2423)
        env:
          VERCEL_SKEW_PROTECTION_ENABLED: "1"
          VERCEL_DEPLOYMENT_ID: dpl_ci_test
          VERCEL_ENV: preview
        run: npm run build

      - name: Run skew-protection guard (preview build must not pin)
        working-directory: .
        env:
          VERCEL_DEPLOYMENT_ID: dpl_ci_test
          VERCEL_ENV: preview
        run: node scripts/check-skew-protection.mjs

  warning-budget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check lint warning budgets
        run: node scripts/check-eslint-warning-budget.mjs

  static-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # #4505 (udskilt fra #4330): saml de ti IKKE-required, lette statiske
    # guards (ingen npm ci) i ét job med én checkout + én setup-node, i stedet
    # for ti separate runnere for at koere to node-kommandoer hver. Hver guard
    # er stadig sit eget "Test X" + "Run X" par af steps under samme job, med
    # `if: ${{ !cancelled() }}` paa hvert TRIN: uden det ville et rødt
    # guard-trin stoppe alle EFTERFØLGENDE guards i dette job, og man ville
    # miste det de separate jobs gav gratis - at se ALLE fejlende guards i ét
    # hug. Ingen continue-on-error: alle ti er ikke-required i branch
    # protection (raadgivende for merge, jf. scripts/ci-required-checks.json),
    # men INGEN af dem havde continue-on-error paa step-niveau som separate
    # jobs - et rødt fund skal stadig faa DETTE job til at rapportere rødt,
    # praecis som da hver guard var sit eget job. Rør IKKE de øvrige statiske
    # guards (migration-idempotency, postgrest-cap-guard, getuser-guard,
    # rankings-fetch-guard, riders-column-grant-guard, swallowed-catch-guard,
    # silent-mutation-guard, finance-type-guard, dropped-supabase-error-guard,
    # maybesingle-unique-scope-guard, workflow-output-guard,
    # dependabot-exceptions-guard): de foerste ni er required status checks,
    # de sidste tre var ikke blandt #4505's ti navngivne kandidater.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # --- ui-anti-drift ---
      # #671 Plan 3 (spec DEL-C C1): forward-guard mod slop-drift i frontend/src.
      # Fejler KUN paa NYE raa hex / slop-tells (rounded-xl/2xl/3xl, glow,
      # backdrop-blur, blob-blur) / emoji-som-ikon ud over scripts/ui-slop-baseline.json
      # (ratchet — maa kun skrumpe). Kendte callsites + emoji er Plan 4's job.
      #
      # #4626 (slice 4 af #4622, docs/design/TASTE.md §3): samme job koerer OGSAA
      # check-anti-slop.mjs, de fire TASTE-forbudte moenstre lint-ui-slop.mjs
      # ikke daekker (unicode-pile-som-ikon, arbitraer text-[Npx] under 12px,
      # shadow-* uden for shadow-overlay, CSS/Tailwind-gradient). Samlet i dette
      # job i stedet for et nyt, fordi begge er rene node-scripts uden npm ci
      # (#4330: flere jobs = flere checkout/setup-node-runners for to kommandoer).
      - name: Test anti-drift guard
        if: ${{ !cancelled() }}
        run: node --test scripts/lint-ui-slop.test.mjs

      - name: Run anti-drift guard
        if: ${{ !cancelled() }}
        run: node scripts/lint-ui-slop.mjs

      - name: Test anti-slop guard
        if: ${{ !cancelled() }}
        run: node --test scripts/check-anti-slop.test.mjs

      - name: Run anti-slop guard
        if: ${{ !cancelled() }}
        run: node scripts/check-anti-slop.mjs

      # --- eslint-disable-guard ---
      # #4332 forward-guard: ratchet mod stille vaekst i antallet af
      # eslint-disable-direktiver. Fejler KUN paa flere direktiver end
      # scripts/eslint-disable-baseline.json tillader (ratchet — maa kun
      # skrumpe) eller en ny fil med direktiver. Laaser blot det nuvaerende
      # tal (42 frontend/src + 1 backend) — gennemgangen af om de 42
      # exhaustive-deps-disables skjuler en reel dependency-bug staar aaben.
      - name: Test eslint-disable guard
        if: ${{ !cancelled() }}
        run: node --test scripts/check-eslint-disable-count.test.mjs

      - name: Run eslint-disable guard
        if: ${{ !cancelled() }}
        run: node scripts/check-eslint-disable-count.mjs

      # --- t2-container-guard ---
      # #3454 forward-guard: en side der bruger den kanoniske <DataTable>
      # (T2 "wide data"-recipe, docs/design/PAGE_TEMPLATES.md) hører ikke hjemme
      # i en T1-container (max-w-4xl) — samme fejlklasse ramte production tre
      # gange (#1675, #1186, #2446, #3454). Lille, lukket allowlist (ikke en
      # ratchet) — hver undtagelse kræver en eksplicit begrundelse i scriptet.
      - name: Test T2-container guard
        if: ${{ !cancelled() }}
        run: node --test scripts/lint-t2-container-guard.test.mjs

      - name: Run T2-container guard
        if: ${{ !cancelled() }}
        run: node scripts/lint-t2-container-guard.mjs

      # --- pagination-guard ---
      # Forward-guard mod PostgREST's TAVSE 1000-rækkers-loft på selects (#3331).
      # Samme bug-klasse har ramt to gange: PCM rytter-matcher (2026-05-30, 88%
      # af ryttere usynlige for matching) og sponsor race-day-bonus (#3315,
      # 2026-08-04, ét menneskehold underbetalt 94%) — begge fanget af en
      # spiller, ikke en test. Flagger `.from(<deny-listet tabel>).select(...)`
      # uden `.limit()/.single()/.maybeSingle()/.range()` eller delegering til en
      # fetchAllRows*-pagineringshelper. Deny-liste: race_results, riders,
      # race_entries, race_stage_schedule, race_stage_profiles,
      # finance_transactions, notifications, race_stage_moments (#4566).
      # Baseline-ratchet (samme mønster som
      # lint-ui-slop.mjs) grandfatherer ~120 pre-eksisterende, prod-verificerede
      # sikre fund (single-team/single-race-scoping) — kun NYE overtrædelser
      # fejler builden. Opt-out: `pagination-safe: <begrundelse>`-kommentar.
      - name: Test pagination guard
        if: ${{ !cancelled() }}
        run: node --test scripts/lint-pagination-guard.test.mjs

      - name: Run pagination guard
        if: ${{ !cancelled() }}
        run: node scripts/lint-pagination-guard.mjs

      # --- fetchallrows-order-guard ---
      # Forward-guard: every fetchAllRows(...) call MUST carry a stable .order()
      # (#3391). fetchAllRows (backend/lib/supabasePagination.js) pages through a
      # table with .range() — without a stable, unique sort, PostgREST can return
      # rows in a different order between pages: SILENT data loss (rows
      # duplicated or dropped across pages), not a thrown error. Same bug class
      # cost 88%/38% data loss in #2951/#2962; #3391 found 15 call sites still
      # violating the contract (a comment-only requirement drifts). No opt-out —
      # a fetchAllRows(...) call has no legitimate reason to omit .order().
      - name: Test fetchAllRows order guard
        if: ${{ !cancelled() }}
        run: node --test scripts/check-fetchallrows-order.test.mjs

      - name: Run fetchAllRows order guard
        if: ${{ !cancelled() }}
        run: node scripts/check-fetchallrows-order.mjs

      # --- rls-classification-guard ---
      # #4440 forward-guard: en tabel der er NAEVNT i
      # docs/decisions/rls-no-policy-classification.md skal ogsaa vaere
      # KLASSIFICERET der - egen sektion med mindst een fil:linje-reference for
      # hvem der tilgaar den, eller en eksplicit konstatering af at ingen kodesti
      # goer. #4439 listede 26 driftstabeller uden at klassificere nogen af dem;
      # regnestykket gik op, dokumentet saa faerdigt ud, og det tog et
      # selvstaendigt issue at opdage. Vagten er ren dokument-intern konsistens
      # (ingen DB-adgang), saa den kan koere paa enhver PR.
      - name: Test RLS classification guard
        if: ${{ !cancelled() }}
        run: node --test scripts/check-rls-classification-coverage.test.mjs

      - name: Run RLS classification guard
        if: ${{ !cancelled() }}
        run: node scripts/check-rls-classification-coverage.mjs

      # --- rate-limit-coverage-guard ---
      # Forward-guard (#530): every requireAuth/requireAdmin route must have
      # rate-limit coverage — an inline <x>Limiter middleware, or fall under a
      # router.use(<prefix>, <x>Limiter) mount (e.g. the /admin-wide
      # adminApiLimiter). Audit found 88 currently-uncovered routes (76 GET + 12
      # POST, none of them under /admin — the 39 admin GET routes ARE already
      # covered by the /admin mount) — too many to fix in one PR, so a baseline
      # ratchet grandfathers them; only NEW uncovered routes fail the build. Not
      # added to required status checks yet — owner decision, see PR body.
      - name: Test rate-limit coverage guard
        if: ${{ !cancelled() }}
        run: node --test scripts/check-rate-limit-coverage.test.mjs

      - name: Run rate-limit coverage guard
        if: ${{ !cancelled() }}
        run: node scripts/check-rate-limit-coverage.mjs

      # --- unguarded-fetch-guard ---
      # Forward-guard mod NYE `await fetch(...)` uden try/catch i frontend/src
      # (#3628). fetch() REJECTER ved netvaerksudfald (mobil-WebKit: "TypeError:
      # Load failed"), saa et bart await efter en setLoading(true) springer
      # oprydningen over: knappen staar i "Gemmer..." og er typisk disabled.
      # Samme fejlklasse slap igennem to backwards-checks i traek (#2719 -> #3619
      # -> #3628), derfor en ratchet pr. fil: baseline laast efter #3628's
      # oprydning, en net-ny ubeskyttet fetch fejler CI. Statisk scanner, ingen
      # DB/runtime noedvendig.
      - name: Test unguarded-fetch guard
        if: ${{ !cancelled() }}
        run: node --test scripts/lint-unguarded-fetch-in-handler.test.mjs

      - name: Run unguarded-fetch guard
        if: ${{ !cancelled() }}
        run: node scripts/lint-unguarded-fetch-in-handler.mjs

      # --- schema-column-guard ---
      # Forward-guard mod "select mod en kolonne der ikke findes" (#3586). To bugs
      # af nøjagtig samme klasse landede på én dag: #3572
      # (season_standings.prize_money, latent i tre måneder) og Day-1-mailen
      # (race_results.created_at, latent bag en feature-gate). Ingen af de tre lag
      # kunne fange dem: createFakeSupabase er projektion-aware men ikke
      # skema-aware (en manglende kolonne bliver bare `undefined`), fixturerne
      # spejlede fejlen, og intet i CI læste det faktiske skema. Guarden opløser
      # hver `.from("<relation>").select(...)` i backend/ mod
      # database/schema-snapshot.json — en committet spejling af prods public-skema
      # — og fejler på en kolonne skemaet ikke har. Statisk: CI rører ALDRIG
      # databasen, den læser kun den committede JSON. Alt der ikke kan opløses
      # EKSAKT (dynamisk tabel/select-argument, relation uden for snapshottet,
      # uopløseligt embed) springes over og TÆLLES — falske positiver er værre end
      # manglende dækning. Snapshot-refresh (kræver SUPABASE_DB_URL, kun lokalt):
      # node scripts/lint-schema-columns.mjs --update-snapshot
      - name: Test schema-column guard
        if: ${{ !cancelled() }}
        run: node --test scripts/lint-schema-columns.test.mjs

      - name: Run schema-column guard
        if: ${{ !cancelled() }}
        run: node scripts/lint-schema-columns.mjs

      # Forward-guard for #4333: public rummer 66 operationelle backup-tabeller
      # fra tidligere haendelses-oprydninger (maalt mod prod 31/8/2026: 207
      # relationer i information_schema.tables + 4 materialiserede views = 211,
      # heraf 66 backups og 145 aegte). De holdes ude af de genererede typer,
      # frontend/src/types/database.types.ts. De bliver med vilje BEVARET i
      # database/schema-snapshot.json, fordi schema-column-guarden ovenfor skal
      # kunne verificere de backend-scripts der faktisk selecter fra dem -
      # se doc-blokken i scripts/lib/operational-backup-relations.mjs. Testen
      # fejler hvis en `supabase gen types typescript` bliver committet uden
      # strip-trinnet som `npm run types:gen` nu kaeder paa. Tabellerne selv
      # roeres ikke: drop er destruktiv klasse, ejer-gated under #2259.
      - name: Test backup-tables-out-of-types guard
        if: ${{ !cancelled() }}
        run: node --test scripts/strip-backup-tables-from-types.test.mjs

      - name: Run backup-tables-out-of-types guard
        if: ${{ !cancelled() }}
        run: node scripts/strip-backup-tables-from-types.mjs --check

      # --- supabase-ops-scripts ---
      # Unit-tests for scripts/ops/*.mjs (#4014 logflade-vagt + #3978 advisor-
      # sweep + #4453 Railway-logstroem-vagt) — ren klassifikationslogik
      # (spike/ny-fejlklasse-detektion, allowlist-diff, tag-daekning), ingen
      # netvaerkskald. De workflows der bruger scripterne
      # (supabase-log-watch.yml, supabase-advisor-sweep.yml,
      # railway-log-watch.yml) kalder Supabase Management-API'et hhv. Railway
      # CLI'en med egne tokens og koeres ikke her.
      - name: Test log-watch classification logic
        if: ${{ !cancelled() }}
        run: node --test scripts/ops/supabase-log-watch.test.mjs

      - name: Test advisor-sweep allowlist diff
        if: ${{ !cancelled() }}
        run: node --test scripts/ops/supabase-advisor-sweep.test.mjs

      # Indeholder forward-guarden fra #4453: fejler hvis et nyt
      # console.<niveau>("[tag]") i backendens runtime hverken har en taerskel
      # eller staar paa ignore-listen i railway-log-thresholds.json.
      # Bemaerk: dette job (static-guards) staar IKKE blandt main's required
      # status checks, saa denne guard er raadgivende - den goer jobbet roedt,
      # men blokerer ikke merge. Skal den blokere, tilfoej jobbet til
      # branch-protection og til scripts/ci-required-checks.json.
      - name: Test railway-log-watch classification + tag coverage
        if: ${{ !cancelled() }}
        run: node --test scripts/ops/railway-log-watch.test.mjs

  migration-idempotency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # #401 migration-drift guard: NEW database/2026-*.sql migrations must use
    # idempotent DDL (IF NOT EXISTS / DROP ... IF EXISTS first / DO-block guard)
    # so a re-run (recovery replay, partial-failure re-apply, fresh rebuild from
    # the migration log) is a no-op rather than an error. schema.sql +
    # supabase_setup.sql stay as bootstrap/DR snapshots. Rule + recipes:
    # docs/MIGRATIONS.md.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test idempotency guard
        run: node --test scripts/lint-migration-idempotency.test.mjs

      - name: Run idempotency guard
        run: node scripts/lint-migration-idempotency.mjs

      # #4163: samme familie, anden akse. Idempotens-vagten spoerger "kan denne
      # migration koere igen?"; form-vagten spoerger "genskaber den objektet i
      # den RIGTIGE form?". #4155 var idempotent OG forkert: den droppede
      # no_rider_double_booking og gav den tilbage uden DEFERRABLE, hvilket satte
      # entry-generator-sweepen i deterministisk doedvande timer foer S3-start.
      - name: Test constraint-form guard
        run: node --test scripts/lint-constraint-form.test.mjs

      - name: Run constraint-form guard
        run: node scripts/lint-constraint-form.mjs

      # #4330: forward-guard mod required check-navne der forsvinder. Et required
      # navn kan forsvinde i en workflow-refaktor uden at noget faelder, og branch
      # protection venter derefter i al evighed paa et check der aldrig rapporterer.
      # Main kan ikke merges, og symptomet dukker foerst op paa NAESTE PR.
      #
      # Guarden bor HER og ikke i et advisory job, fordi migration-idempotency ER et
      # required status check. Foerste udgave laa i et ikke-required job: den ville
      # gaa roed OG merge alligevel, fordi auto-merge.yml kun venter paa
      # `gh pr checks --required`. Det fund kom fra det adversariske review 31/8.
      - name: Test required-ci-jobs guard
        run: node --test scripts/check-required-ci-jobs.test.mjs

      - name: Run required-ci-jobs guard
        run: node scripts/check-required-ci-jobs.mjs

  workflow-output-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # #4463 forward-guard: en vagt der gaar GROEN uden at maale noget. Nat-vagten
    # calendar-invariant-audit rapporterede success 30/8 uden en eneste maalt
    # invariant, fordi dens parser stod som `node ... | tee invariants.txt` uden
    # pipefail: under bash -e taeller kun sidste kommandos exit-kode, `tee`
    # returnerer 0, og de senere steps blev sprunget over fordi outputtet de
    # betinger sig af aldrig blev skrevet. Anden gang samme fejlklasse rammer, se
    # .claude/learnings/2026-08-28-groent-flueben-der-intet-verificerede.md.
    # Guarden flagger ethvert step der skriver til GITHUB_OUTPUT og piper sin
    # maaling uden pipefail.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test workflow-output guard
        run: node --test scripts/lint-workflow-output-masking.test.mjs

      - name: Run workflow-output guard
        run: node scripts/lint-workflow-output-masking.mjs

      # #4463: samme familie. Guarden ovenfor sikrer at maalingens exit-kode NAAR
      # frem; denne sikrer at rapporten den producerer faktisk INDEHOLDER
      # maalinger - forskellen paa "intet brud" og "intet maalt".
      - name: Test invariant-rapportens parser
        run: node --test scripts/summarize-invariant-report.test.mjs

  dependabot-exceptions-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # #4551 forward-guard (ejer-direktiv 1/9): "en undtagelse uden udløb er en
    # permanent undtagelse". GHSA-allowlisten i dependency-review.yml stod uden
    # review-dato i månederne mellem #2960 og #4547, og løj om vores reelle
    # exponering indtil et helt andet PR tilfældigvis fjernede den. Guarden
    # fejler når en .github/dependabot.yml ignore-entry eller en
    # dependency-review.yml allow-ghsas/allow-licenses-linje mangler en
    # issue-reference, mangler en review-dato, eller review-datoen er passeret.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test dependabot-exceptions guard
        run: node --test scripts/check-dependabot-exceptions.test.mjs

      - name: Run dependabot-exceptions guard
        run: node scripts/check-dependabot-exceptions.mjs

  postgrest-cap-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod PostgREST 1000-rækkers-cap-trunkering. Samme bug
    # shippet 3× (#1798, #1839, #1841): en `.in("col", ids.slice(0, N))` capper
    # id-listen, PostgREST capper svaret ved 1000 rows — begge trunkerer TAVST,
    # så tal/aggregater læser falsk lavt uden fejl. Flagger nye forekomster i
    # backend + frontend/src; range-paginer + id-chunk i stedet (fetchAllRows /
    # fetchAll*-helpers). Opt-out: `postgrest-cap-ok`-kommentar med begrundelse.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test postgrest-cap guard
        run: node --test scripts/lint-postgrest-in-cap.test.mjs

      - name: Run postgrest-cap guard
        run: node scripts/lint-postgrest-in-cap.mjs

  maybesingle-unique-scope-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod .maybeSingle()-kald der ikke daekker tabellens fulde
    # flerkolonne-UNIQUE (#4496, rodaarsagen bag #4484). .maybeSingle() svarer
    # med BAADE en fejl OG data: null naar mere end én raekke matcher filteret
    # - fire kaldsteder laeste det som "ingen raekke findes" i stedet for
    # "flertydig forespoergsel", og graduerings-sweepet fejlede 23 gange paa
    # én nat. Usynlig i review (linjen ser rigtig ud) og usynlig for en naiv
    # mock (#3620-klassen). Constraints laeses statisk fra database/*.sql +
    # database/schema-snapshot.json - ingen DB-adgang. Opt-out:
    # "maybesingle-scope-ok: <begrundelse>".
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test maybeSingle unique-scope guard
        run: node --test scripts/check-maybesingle-unique-scope.test.mjs

      - name: Run maybeSingle unique-scope guard
        run: node scripts/check-maybesingle-unique-scope.mjs

  getuser-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod getUser()→null-deref-crashklassen (#1792, Sentry
    # CYCLINGZONE-16): en udløbet session giver `user = null`, og en bar
    # `user.id`-deref vælter hele siden. #1792 tilføjede inline-guards overalt,
    # men forhindrer ikke en NY side i at glemme guarden. Flagger `getUser()` /
    # `getAuthedUser()` hvis resultatet deref'es før en null-guard. Brug helper +
    # guard (frontend/src/lib/getAuthedUser.js). Opt-out: `getuser-guard-ok`.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test getuser guard
        run: node --test scripts/lint-getuser-guard.test.mjs

      - name: Run getuser guard
        run: node scripts/lint-getuser-guard.mjs

  rankings-fetch-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod rangliste perf-regressionen (#2196 Del 2). #2175 (Del 1)
    # flyttede /standings + /rider-rankings fra en ~38k-rækkers client-fetch af
    # race_results til Postgres-matviews. En ny direkte .from("race_results")-fetch
    # i en rangliste-sti gen-introducerer den tavse perf-regression (langsom side,
    # ingen fejl). Flagger de tre rangliste-datastier; query matviewet i stedet.
    # Opt-out: `rankings-raceresults-ok`-kommentar med begrundelse.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test rankings-fetch guard
        run: node --test scripts/lint-rankings-raceresults-fetch.test.mjs

      - name: Run rankings-fetch guard
        run: node scripts/lint-rankings-raceresults-fetch.mjs

  riders-column-grant-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod #2238 (rytter-siden tom for alle brugere): riders +
    # rider_derived_abilities bruger KOLONNE-niveau SELECT-grants (#1162), ikke
    # tabel-niveau — en ny kolonne er usynlig for anon/authenticated indtil den
    # eksplicit GRANT'es. Samme bug shippede 3× (#1309, ability_progress 12/6,
    # #2238's owner_is_ai). Guarden er selv-udvidende: den registrerer et
    # tabel-navn som "gated" fra den REVOKE SELECT ON <table> FROM
    # anon/authenticated den finder i korpusset, så den dækker automatisk
    # enhver fremtidig tabel der adopterer samme mønster — ikke kun riders.
    # Statisk (parser database/*.sql), ingen DB-adgang nødvendig i CI.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test riders-column-grant guard
        run: node --test scripts/lint-riders-column-grant.test.mjs

      - name: Run riders-column-grant guard
        run: node scripts/lint-riders-column-grant.mjs

  swallowed-catch-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod NYE svaltede catch-blokke (#2395 del 2). En catch der
    # hverken captureException'er, rethrow'er eller bærer en '// best-effort'-markør
    # skjuler fejl for Sentry (Sentry-hærdningen 12/7 fandt ~20 sådanne, flere ægte).
    # Ratchet pr. fil: baseline låst efter audit-oprydningen — en net-ny svaltet
    # catch fejler CI. Statisk (heuristik-scanner), ingen DB/runtime nødvendig.
    # #2897 (26/7): backend/routes/** kom i scope — api.js (hele HTTP-fladen,
    # 174 svaltede catches) lå udenfor, hvilket var hele pointen i issuet.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test swallowed-catch guard
        run: node --test scripts/lint-swallowed-catches.test.mjs

      - name: Run swallowed-catch guard
        run: node scripts/lint-swallowed-catches.mjs

  silent-mutation-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod NYE tavse fejl fra de 6 feedback-kontrakt-hooks (#2465).
    # useTraining/useAcademy/useFacilities/usePlanner/useScouting/useScoutingCentral
    # returnerer alle eksplicit {ok,error} — et kald der hverken await'es, return'es
    # eller .then()-kædes lader en fejl (session/netværk/backend-afvisning) forsvinde
    # tavst i UI'et. Ratchet pr. fil, samme mønster som swallowed-catch-guard.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test silent-mutation guard
        run: node --test scripts/lint-silent-mutations.test.mjs

      - name: Run silent-mutation guard
        run: node scripts/lint-silent-mutations.mjs

  finance-type-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod #2948-bug-klassen (#1463/#1465-twin): en finance_transactions.type
    # brugt i backend-koden (backend/lib + backend/routes + backend/scripts), men uden en
    # tilsvarende værdi i den nyeste finance_transactions_type_check-CHECK i database/*.sql.
    # #2948 fandt 'sponsor_race_day' (sponsorRaceDayIncome.js, #1663) manuelt 25/7 — en ægte
    # udbetaling havde aldrig kørt (#2913), så INSERT'en var aldrig detoneret, men ville have
    # væltet ved cutoveren 27/7 med 153 live sponsor-kontrakter. En tidligere guard for samme
    # bug-klasse (#1464/#1465) fandtes allerede, men brugte en hårdkodet fil-liste der aldrig
    # blev udvidet til de filer der senere begyndte at skrive finance-rækker — netop den
    # allowlist-drift denne guard eliminerer ved at directory-walke i stedet for at navngive
    # filer. Statisk (parser database/*.sql + grep-ankre i backend-koden), ingen DB-adgang
    # nødvendig i CI. Kendt scope-grænse (dokumenteret i scripts/lint-finance-types.mjs): én
    # RPC (repay_loan_atomic) hardkoder sin type direkte i SQL frem for JS-payload'en — uden
    # for #2957's scope, ikke aktuel drift (verificeret mod prod 26/7).
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test finance-type guard
        run: node --test scripts/lint-finance-types.test.mjs

      - name: Run finance-type guard
        run: node scripts/lint-finance-types.mjs

  dropped-supabase-error-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Forward-guard mod NYE droppede Supabase-errors (#2897, rodårsagen bag #2861).
    # supabase-js kaster ikke — den returnerer { data, error }. Destrukturerer man
    # kun `data`, forsvinder fejlen sporløst: ingen throw, ingen 500, ingen Sentry.
    # Kalender-siden brændte 8-9 sek. pr. load på et kald der aldrig kunne lykkes,
    # og ingen opdagede det. Fejlklassen har ramt tre gange (#2861, #2898, #2877);
    # swallowed-catch-guarden fanger den IKKE (der er ingen catch involveret).
    # Ratchet pr. fil, samme mønster som søster-guardsene. Statisk, ingen DB.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test dropped-supabase-error guard
        run: node --test scripts/lint-dropped-supabase-error.test.mjs

      - name: Run dropped-supabase-error guard
        run: node scripts/lint-dropped-supabase-error.mjs

      # #2974: søsterguard mod fire-and-forget mutationer (delete/insert/update/upsert
      # uden binding). Dropped-error-guarden ovenfor kræver en `data`-binding og
      # rammer derfor IKKE det bare `await supabase.from(...).delete()`.
      - name: Test unchecked-supabase-mutation guard
        run: node --test scripts/lint-unchecked-supabase-mutation.test.mjs

      - name: Run unchecked-supabase-mutation guard
        run: node scripts/lint-unchecked-supabase-mutation.mjs

  calendar-invariant-ci-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # #4123 — kalender-invarianterne + den gyldne S3-kalender-diff som eget, synligt
    # check på PR'er der rører pakkeren/generatoren. Testene kører allerede som en del
    # af backend-tests' `npm test` (alle *.test.js findes automatisk, se
    # backend/scripts/run-tests.js) — dette job giver dem deres EGET navn i PR-tjeklisten
    # i stedet for at drukne blandt ~340 andre backend-testfiler, samme begrundelse som
    # .github/workflows/calendar-scorecard-gate.yml (#4215).
    #
    # Genererer S3-kalenderen 100 % OFFLINE (lib/__fixtures__/racePoolCatalog.prod.json +
    # scripts/dev/lib/s3OfflineCalendarPlan.mjs). Ingen secrets, ingen prod-adgang.
    #
    # RÅDGIVENDE, IKKE PÅKRÆVET: står bevidst UDENFOR scripts/ci-required-checks.json i
    # første omgang (spawn-prompt-direktiv #4270) — samme mønster som
    # supabase-ops-scripts ovenfor. En rød diff her er ikke nødvendigvis en fejl (se
    # lib/calendarGoldenSnapshot.test.js's egen docstring: kan også være en TILSIGTET
    # ændring der mangler en `refreshCalendarGoldenSnapshot.mjs`-kørsel), så den skal
    # kunne læses og vurderes af et menneske før den evt. gøres blokerende.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Kalender-invariant-tests (#4123)
        working-directory: backend
        run: node --test lib/calendarInvariantsCiGate4123.test.js

      - name: Gylden kalender-snapshot-diff (#4123)
        working-directory: backend
        run: node --test lib/calendarGoldenSnapshot.test.js
