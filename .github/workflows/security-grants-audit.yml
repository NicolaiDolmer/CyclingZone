name: Security grants audit

# Vagt mod klient-eksekverbare SECURITY DEFINER-funktioner (#2858).
#
# Hændelsen der gjorde den nødvendig (#3765): apply_race_results_batch stod
# EXECUTE-bar for anon i ni dage. Funktionen er SECURITY DEFINER uden intern
# gate og sletter + indsætter i race_results — enhver med den publicerbare
# anon-nøgle kunne have omskrevet ethvert løbs resultater.
#
# Hvorfor intet fangede det:
#   1. auto-migrate.yml kører kun `database/*.sql` (maxdepth 1). Funktionen kom
#      fra database/proposals/ og blev anvendt i hånden — kun CREATE-delen kom
#      med, REVOKE-linjerne nederst i filen blev aldrig kørt.
#   2. rls-audit.yml dækker TABEL-grants (#2830), ikke FUNKTIONS-grants.
#   3. Intet kaldte Supabase-advisoren (0028/0029) eller læste pg_proc.proacl.
#
# To lag, fordi ingen af dem kan stå alene:
#   lint  (PR, ændrede filer)  — spærrer nye fejl ved review-tid.
#   live  (hver 6. time)       — ser den FAKTISKE database, og fanger derfor
#                                også SQL anvendt i hånden via MCP/Studio, som
#                                aldrig har været en fil i dette repo. Det var
#                                præcis den sti #3765 kom ind ad.
#
# Live-jobbet kører tre uafhængige drift-tjek mod samme forbindelse:
#   security-grants.sql        — hvilke SECURITY DEFINER-funktioner kan klienten kalde?
#   security-rls-policy-fn-grants.sql
#                              — den MODSATTE retning (#2671): kalder en RLS-policy
#                                en funktion som en rolle policyen rammer IKKE har
#                                EXECUTE på? Så fejler HELE tabellen med 42501 for
#                                den rolle. Klassen har bidt 3x på præcis samme
#                                policy (31/5, 29/6, 5/8) og er tavs, fordi den kun
#                                rammer roller ingen tester i hånden. Sidste bid
#                                stod uopdaget i ~3 uger.
#   proposals-reconcile.mjs    — ligger der forslag i database/proposals/ som ER
#                                anvendt i prod uden at være flyttet til top-niveau?
#                                Måling 14/8: 6 af 10. En anvendt fil der stadig
#                                står som udkast gør et HALVT anvendt forslag
#                                umuligt at skelne fra et uanvendt — og det var
#                                nøjagtig den blindhed #3765 gemte sig i.

on:
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/check-secdef-revoke-lint.mjs'
      - 'scripts/proposals-reconcile.mjs'
      - 'scripts/security-grants.sql'
      - 'scripts/security-rls-policy-fn-grants.sql'
      - '.github/workflows/security-grants-audit.yml'
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: security-grants-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  lint:
    name: Statisk REVOKE-lint (ændrede SQL-filer)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Selvtest af vagternes egen parsing
        run: |
          node --test scripts/check-secdef-revoke-lint.test.mjs
          node --test scripts/proposals-reconcile.test.mjs
          node --test scripts/security-rls-policy-fn-grants.test.mjs

      - name: Lint ændrede SQL-filer
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # Pathspec = mappen, .sql-filtret sker bagefter: git's default-pathspec
          # matcher '*' hen over '/', så 'database/**/*.sql' er både overflødigt
          # og let at tage fejl af. mapfile+array holder filnavnene citerede.
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- database \
              | grep -E '\.sql$' || true
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "✅ Ingen ændrede SQL-filer i database/ — intet at tjekke."
            exit 0
          fi
          echo "Ændrede SQL-filer:"
          printf '  %s\n' "${FILES[@]}"
          echo ""
          node scripts/check-secdef-revoke-lint.mjs "${FILES[@]}"

  live:
    name: Live grant-tjek mod prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify SUPABASE_DB_URL is configured
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${DB_URL:-}" ]; then
            echo "❌ SUPABASE_DB_URL secret missing — se docs/AUTO_MIGRATION_SETUP.md"
            exit 1
          fi

      - name: Kør grant-tjek
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          FINDINGS=$(psql "$DB_URL" -tA -F '|' -v ON_ERROR_STOP=1 -f scripts/security-grants.sql | sed '/^$/d')
          if [ -z "$FINDINGS" ]; then
            echo "✅ Ingen klient-eksekverbare SECURITY DEFINER-funktioner uden for allowlisten."
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Fund:"
            printf '%s\n' "$FINDINGS"
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
            {
              echo "findings<<SECGRANTS_EOF"
              printf '%s\n' "$FINDINGS"
              echo "SECGRANTS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # Anden drift-akse (#2671): den omvendte fejl. Grant-tjekket ovenfor finder
      # funktioner klienten KAN kalde men ikke burde. Dette finder funktioner en
      # RLS-policy kalder, som rollen IKKE kan kalde — hvorefter hele tabellen
      # svarer 42501 for den rolle. Tavs fejl: den rammer kun roller ingen tester
      # i hånden. Har bidt 3x på riders / "Public read riders" (31/5, 29/6, 5/8).
      - name: Kør RLS-policy-funktions-tjek
        id: policyfn
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          FINDINGS=$(psql "$DB_URL" -tA -F '|' -v ON_ERROR_STOP=1 -f scripts/security-rls-policy-fn-grants.sql | sed '/^$/d')
          if [ -z "$FINDINGS" ]; then
            echo "✅ Alle funktioner kaldt fra RLS-policies i public kan eksekveres af de roller policyen rammer."
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Fund:"
            printf '%s\n' "$FINDINGS"
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
            {
              echo "findings<<POLICYFN_EOF"
              printf '%s\n' "$FINDINGS"
              echo "POLICYFN_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # Tredje drift-akse: et forslag i database/proposals/ der ER anvendt i prod,
      # men aldrig blev flyttet til top-niveau. Mappen holder dermed op med at
      # fortælle sandheden, og et halvt anvendt forslag bliver umuligt at skelne
      # fra et uanvendt udkast — præcis den tilstand #3765 opstod i.
      - name: Kør proposals-reconcile
        id: proposals
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          node --test scripts/proposals-reconcile.test.mjs
          node scripts/proposals-reconcile.mjs > /tmp/proposals-reconcile.sql
          FINDINGS=$(psql "$DB_URL" -tA -F '|' -v ON_ERROR_STOP=1 -f /tmp/proposals-reconcile.sql | sed '/^$/d' | grep -v '^INFO|' || true)
          if [ -z "$FINDINGS" ]; then
            echo "✅ Ingen forslag i database/proposals/ er anvendt i prod uden at være forfremmet."
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Fund:"
            printf '%s\n' "$FINDINGS"
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
            {
              echo "findings<<PROPOSALS_EOF"
              printf '%s\n' "$FINDINGS"
              echo "PROPOSALS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Opret eller opdatér proposals-issue ved fund
        if: steps.proposals.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.proposals.outputs.findings }}
        run: |
          set -euo pipefail
          TITLE="[proposals-drift] Forslag er anvendt i prod uden at være forfremmet"
          {
            echo "\`scripts/proposals-reconcile.mjs\` fandt filer i \`database/proposals/\` hvis objekter findes i prod. Mappen betyder \"afventer ejer-beslutning\" — så længe en anvendt fil ligger der, passer den beskrivelse ikke."
            echo ""
            echo '```'
            printf '%s\n' "$FINDINGS"
            echo '```'
            echo ""
            echo "Format: severity | check | detail"
            echo ""
            echo "**CRITICAL / \`proposal_partially_applied\`** = kun nogle af filens objekter lever. Det var #3765's tilstand. Afgør om resten skal køres, eller om det anvendte skal rulles tilbage."
            echo ""
            echo "**WARN / \`proposal_applied_not_promoted\`** = hele filen er anvendt. Flyt den til \`database/<navn>.sql\` og indsæt en \`schema_migrations\`-række med samme filnavn, så \`auto-migrate.yml\` springer den over i stedet for at køre den igen. Rækkefølgen er vigtig: registrér FØRST, flyt derefter."
            echo ""
            echo "Reglen står i \`database/proposals/README.md\`; det er håndhævelsen der manglede."
            echo "Workflow: .github/workflows/security-grants-audit.yml"
          } > proposals-body.md
          EXISTING=$(gh issue list --state open --search "proposals-drift in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "${EXISTING:-}" ] && [ "$EXISTING" != "null" ]; then
            echo "↳ Åbent issue #$EXISTING findes — tilføjer kommentar."
            gh issue comment "$EXISTING" --body-file proposals-body.md
          else
            echo "↳ Opretter nyt issue."
            gh issue create --title "$TITLE" --body-file proposals-body.md --label "claude:todo"
          fi

      - name: Opret eller opdatér issue ved fund
        if: steps.check.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.check.outputs.findings }}
        run: |
          set -euo pipefail
          TITLE="[security-grants] Klient-eksekverbar SECURITY DEFINER-funktion i prod"
          {
            echo "Det automatiske grant-tjek (\`scripts/security-grants.sql\`) fandt SECURITY DEFINER-funktioner i \`public\` som \`anon\` eller \`authenticated\` kan kalde over PostgREST."
            echo ""
            echo '```'
            printf '%s\n' "$FINDINGS"
            echo '```'
            echo ""
            echo "Format: severity | check | detail"
            echo ""
            echo "**CRITICAL** = funktionen skriver i databasen. Behandl som et åbent hul indtil andet er bevist:"
            echo "kør den foreslåede REVOKE, og tjek derefter om noget legitimt kaldte den (backend bruger service_role og rammes ikke)."
            echo ""
            echo "**WARN** = read-only. Bekræft at klient-adgangen er tilsigtet; er den det, tilføjes funktionen til allowlisten i \`scripts/security-grants.sql\` MED begrundelse."
            echo ""
            echo "Baggrund: #2858 (klassen) · #3765 (hændelsen — ni dages eksponering)."
            echo "Workflow: .github/workflows/security-grants-audit.yml"
          } > security-grants-body.md
          EXISTING=$(gh issue list --state open --search "security-grants in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "${EXISTING:-}" ] && [ "$EXISTING" != "null" ]; then
            echo "↳ Åbent issue #$EXISTING findes — tilføjer kommentar."
            gh issue comment "$EXISTING" --body-file security-grants-body.md
          else
            echo "↳ Opretter nyt issue."
            gh issue create --title "$TITLE" --body-file security-grants-body.md --label "claude:todo" --label "security"
          fi

      - name: Opret eller opdatér policy-funktions-issue ved fund
        if: steps.policyfn.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.policyfn.outputs.findings }}
        run: |
          set -euo pipefail
          TITLE="[policy-fn-grants] RLS-policy kalder funktion som rollen ikke kan eksekvere"
          {
            echo "\`scripts/security-rls-policy-fn-grants.sql\` fandt RLS-policies i \`public\` der kalder en funktion som en af de roller policyen rammer ikke har EXECUTE på."
            echo ""
            echo "En RLS-policy evalueres med KALDERENS rettigheder. Mangler grantet, fejler hver eneste adgang til tabellen for den rolle med \`42501 permission denied for function\`. Det ligner ikke en RLS-afvisning, og det rammer kun roller ingen tester i hånden."
            echo ""
            echo '```'
            printf '%s\n' "$FINDINGS"
            echo '```'
            echo ""
            echo "Format: severity | check | detail"
            echo ""
            echo "**CRITICAL / \`policy_fn_missing_execute\` + authenticated** = indloggede spillere får 42501 på hele tabellen. Behandl som nedbrud og kør det GRANT der står i detail."
            echo ""
            echo "**WARN / \`policy_fn_missing_execute\` + anon** = anon fail-closer. Kan være tilsigtet, men skal være en truffet beslutning: enten GRANT EXECUTE, eller scope policyen \`TO authenticated\` så anon får en ren tom afvisning, eller whitelist posten i scriptet MED learning-reference."
            echo ""
            echo "**WARN / \`policy_fn_whitelist_stale\`** = en whitelist-post matcher ikke længere et fund. Grantet er givet, eller policyen er omdøbt eller droppet. Fjern posten."
            echo ""
            echo "**CRITICAL / \`policy_fn_name_not_regex_safe\`** = funktionsnavnet falder uden for scanningens dækning. Omdøb funktionen, eller udvid udtrækket."
            echo ""
            echo "Baggrund: #2671 (klassen, bidt 3x på riders / \"Public read riders\": 31/5, 29/6, 5/8)."
            echo "Læringer: \`.claude/learnings/2026-05-31-rls-policy-calling-function-needs-role-grant.md\`, \`.claude/learnings/2026-07-18-anon-riders-select-fail-closed-42501.md\`"
            echo "Workflow: .github/workflows/security-grants-audit.yml"
          } > policy-fn-grants-body.md
          EXISTING=$(gh issue list --state open --search "policy-fn-grants in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "${EXISTING:-}" ] && [ "$EXISTING" != "null" ]; then
            echo "↳ Åbent issue #$EXISTING findes — tilføjer kommentar."
            gh issue comment "$EXISTING" --body-file policy-fn-grants-body.md
          else
            echo "↳ Opretter nyt issue."
            gh issue create --title "$TITLE" --body-file policy-fn-grants-body.md --label "claude:todo" --label "security"
          fi

      - name: Fejl ved fund
        if: steps.check.outputs.has_findings == 'true' || steps.policyfn.outputs.has_findings == 'true' || steps.proposals.outputs.has_findings == 'true'
        run: |
          if [ "${{ steps.check.outputs.has_findings }}" = "true" ]; then
            echo "::error::Grant-tjekket fandt klient-eksekverbare SECURITY DEFINER-funktioner. Se issue."
          fi
          if [ "${{ steps.policyfn.outputs.has_findings }}" = "true" ]; then
            echo "::error::En RLS-policy kalder en funktion som rollen ikke kan eksekvere. Se issue."
          fi
          if [ "${{ steps.proposals.outputs.has_findings }}" = "true" ]; then
            echo "::error::Forslag i database/proposals/ er anvendt i prod uden at være forfremmet. Se issue."
          fi
          exit 1
