# Patch notes coverage guard (#3638) — reopens #623's 25/5 finding: a 5%
# real miss-rate over 80 user-facing PRs (4 concrete misses: #601, #456,
# #145, #112) was measured and the guard was never built.
#
# ADVISORY ONLY (owner mandate, #3638 comment 12/8): "Flaggeren bør foreslå,
# ikke blokere — en falsk positiv må ikke stoppe en merge." This job never
# fails — scripts/check-patch-notes-coverage.js always exits 0. Findings are
# written to the job summary as a suggestion.
#
# Definition of "user-facing" and the 4-known-miss proof live in
# scripts/check-patch-notes-coverage.js / .test.js — see #3638 for design
# principle 5 (a new gate must be proven against a known defect).

name: Patch notes coverage

on:
  pull_request:

permissions:
  contents: read

jobs:
  patch-notes-coverage:
    name: patch-notes-coverage (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch main for patch notes coverage guard
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Test patch notes coverage guard
        run: node --test scripts/check-patch-notes-coverage.test.js

      - name: Patch notes coverage (advisory)
        run: node scripts/check-patch-notes-coverage.js
