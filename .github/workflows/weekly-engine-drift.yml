name: Weekly Engine Drift

# Ugentlig motor-rapport paa rigtige loeb mod gates + alarm (#2557, S14).
# Hver mandag 07:00 dansk tid maaler backend/scripts/ops/weeklyEngineDrift2557.mjs
# ugens afviklede etaper pr. loebsgruppe (korte etapeloeb, Grand Tours, endagsloeb,
# monumenter, U23/junior) og sammenligner med graenserne i ENGINE_GATE_THRESHOLDS_JSON.
# Rapporten er privat og gaar kun til Discord-ops. Ved afvigelse faar jobbet exit 1
# og en alarm med @mention sendes foerst. Actions-loggen viser kun
# "N gates OK / M afvigelser" (ingen maalte tal, ingen graenser).
#
# READ-ONLY mod prod: scriptet bruger en klient der kun kan SELECT.
#
# GitHub-secrets (sæt med `gh secret set <NAVN>`):
#   findes allerede:   SUPABASE_URL, SUPABASE_SERVICE_KEY
#   SKAL oprettes:     ENGINE_GATE_THRESHOLDS_JSON  (den private taerskelfil som JSON, sektionen
#                                                    `weeklyEngineDrift`; se scriptets header)
#                      DISCORD_OPS_WEBHOOK_URL      (ops-kanalens webhook; samme secret som db-watchdog)
#   valgfri:           DISCORD_OPS_MENTION          (fx <@123456789012345678>)
# Mangler en paakraevet secret eller er taerskelfilen ugyldig, fejler jobbet tydeligt (exit 2)
# UDEN at sende noget.
#
# Tidszone: GitHub cron er UTC. Mandag 07:00 i Europe/Copenhagen er 05:00 UTC om sommeren og
# 06:00 UTC om vinteren, saa begge tider er planlagt og "gate"-jobbet lader kun
# den der rammer klokken 07 koere. workflow_dispatch springer tjekket over.

on:
  schedule:
    - cron: '0 5 * * 1' # 07:00 CEST
    - cron: '0 6 * * 1' # 07:00 CET
  workflow_dispatch:
    inputs:
      days:
        description: 'Vindue i dage bagud fra nu (default 7).'
        required: false
        default: '7'
      dry_run:
        description: 'true = maal og vis kun resumeet i loggen, send intet til Discord.'
        required: false
        default: 'false'

concurrency:
  group: weekly-engine-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Tjek dansk tid
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/Copenhagen date +%H)"
          if [ "$hour" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ikke 07 dansk tid, springer over (den anden cron tager den)."
          fi

  report:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Weekly engine drift report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENGINE_GATE_THRESHOLDS_JSON: ${{ secrets.ENGINE_GATE_THRESHOLDS_JSON }}
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          DISCORD_OPS_MENTION: ${{ secrets.DISCORD_OPS_MENTION }}
          WEEKLY_DRIFT_DAYS: ${{ github.event.inputs.days }}
          WEEKLY_DRIFT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/ops/weeklyEngineDrift2557.mjs
        working-directory: backend
