name: Debug 8348 (temporary)

# MIDLERTIDIG (#8348): maaler een test i Playwright-containeren. Fjernes i
# samme PR, foer den markeres klar.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'chore/8348-snapshots-linux-container'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Trust the checkout (container git)
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Fonts in the image
        shell: bash
        run: |
          fc-match system-ui || true
          fc-match sans-serif || true
          fc-match Arial || true
          fc-list : family | sort -u || true
      - name: Build frontend (e2e)
        run: npm run build
        env:
          VITE_E2E: "1"
          VITE_API_URL: http://127.0.0.1:4173
          VITE_SUPABASE_URL: https://cycling-zone-e2e.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-key
          VITE_PUBLIC_APP_URL: http://127.0.0.1:4173
      - name: Run the one test
        shell: bash
        env:
          PW_SNAPSHOT_BASELINE: linux-container
        run: npx playwright test tests/e2e/5124-season-matrix-mobile.spec.js --project=mobile-chromium --project=desktop-chromium -g "linse-kontrollen" --retries=0 --reporter=line || true
