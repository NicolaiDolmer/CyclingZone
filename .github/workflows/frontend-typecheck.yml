name: Frontend JS typecheck baseline

on:
  pull_request:
    paths:
      - 'frontend/**'
      # Frontend tests import backend helpers; tsc follows that graph.
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/typecheck-baseline*'
      - '.github/workflows/frontend-typecheck.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # Frontend tests import backend helpers; tsc follows that graph.
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/typecheck-baseline*'
      - '.github/workflows/frontend-typecheck.yml'
  merge_group:

permissions:
  contents: read

jobs:
  frontend-typecheck-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: node --test scripts/ci/typecheck-baseline.test.mjs scripts/verify-affected.test.mjs
      - run: node scripts/ci/typecheck-baseline.mjs
