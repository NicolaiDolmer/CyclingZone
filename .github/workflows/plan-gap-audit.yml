name: Plan-hul-tjek

# #8230 (ejer 16/11 + 19/11): hver mandag finder scripts/plan-gap-audit.mjs
# planlagt arbejde, der er faldet ud af planen (kun læsning), og lægger ét
# kort med højst 10 punkter som kommentar på #8230. PC1 viser ejeren kortet
# i mandagsblokken. Skriver aldrig til Supabase eller repoet.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plan-gap-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Kør plan-hul-tjekket (kun læsning)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          SUPABASE_SERVICE_KEY=$(printf '%s' "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')
          export SUPABASE_URL SUPABASE_SERVICE_KEY
          node scripts/plan-gap-audit.mjs --days 7 --out plan-gap.md
      - name: Læg kortet på #8230
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- plan-gap-audit:v1 -->'
            echo "**Plan-hul-tjek $(date -u +%Y-%m-%d)** (mandag, kun læsning). PC1 viser ejeren kortet."
            echo
            cat plan-gap.md
          } > comment.md
          gh issue comment 8230 --repo "${{ github.repository }}" --body-file comment.md
