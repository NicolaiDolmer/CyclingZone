name: League-size invariant audit

# Trusted default-branch code only: never execute PR code or consume PR artifacts
# with production secrets. workflow_run also supports Dependabot and fork PRs.
# publishes-check-on-pr-head: league-size-invariant
on:
  workflow_run:
    workflows: ['CI (AI-Autopilot)']
    types: [completed]
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: read

concurrency:
  group: league-audit-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    name: league-size-invariant
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Start check on current PR head
        id: target
        uses: actions/github-script@v9
        with:
          script: |
            const bridge = require('./scripts/lib/league-audit-check.cjs');
            if (context.eventName !== 'workflow_run') {
              core.setOutput('run', 'true');
              return;
            }
            const target = await bridge.targetForRun(github, context);
            if (!target) return; // Closed or superseded SHA: never certify its successor.
            const id = await bridge.startCheck(github, context, target, new Date().toISOString());
            core.setOutput('check_id', id);
            core.setOutput('run', 'true');

      - name: Set up Node.js
        if: steps.target.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install trusted backend dependencies
        if: steps.target.outputs.run == 'true'
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Measure production and redact candidate details
        if: steps.target.outputs.run == 'true'
        id: audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_KEY"
          status=0
          node backend/scripts/audit-league-size-invariant.js --json > league-audit-private.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node <<'NODE'
          const fs = require('fs');
          const { publicSummary } = require('./scripts/lib/league-audit-check.cjs');
          const report = publicSummary(JSON.parse(fs.readFileSync('league-audit-private.json', 'utf8')));
          fs.writeFileSync('league-size-audit.json', JSON.stringify(report, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `total=${report.total_findings}\n`);
          NODE

      - name: Complete PR check even when measurement fails
        if: always() && steps.target.outputs.check_id != ''
        uses: actions/github-script@v9
        env:
          LEAGUE_CHECK_ID: ${{ steps.target.outputs.check_id }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const fs = require('fs');
            const bridge = require('./scripts/lib/league-audit-check.cjs');
            let report = null;
            if (fs.existsSync('league-size-audit.json')) {
              report = JSON.parse(fs.readFileSync('league-size-audit.json', 'utf8'));
            }
            await bridge.finishCheck(github, context, Number(process.env.LEAGUE_CHECK_ID),
              report, process.env.AUDIT_OUTCOME === 'success', new Date().toISOString());

      - name: Upload aggregate report
        if: steps.audit.outputs.total != ''
        uses: actions/upload-artifact@v7
        with:
          name: league-size-audit-report
          path: league-size-audit.json

      - name: Open or update tracking issue
        if: github.event_name == 'schedule' && steps.audit.outputs.total != '' && steps.audit.outputs.total != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('league-size-audit.json', 'utf8'));
            const title = `[bot] League-size invariant audit fandt ${report.total_findings} afvigende pulje(r)`;
            const body = ['Read-only production audit (#2377 / #4753).',
              'Active pools require 24 teams; dormant lower tiers require zero.',
              '```json', JSON.stringify(report, null, 2), '```',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'league-size-audit'
            });
            if (existing.length) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing[0].number, title, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body,
                labels: ['league-size-audit', 'priority:high', 'type:bug', 'claude:todo'] });
            }

      - name: Fail if findings
        if: steps.audit.outputs.total != '' && steps.audit.outputs.total != '0'
        run: exit 1
