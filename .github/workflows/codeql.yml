name: CodeQL

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 4 * * 1'  # weekly Monday 04:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # python tilføjet 10/9: GitHub detekterer 11 .py-filer (hooks + scripts),
        # og et sprog der findes i repoet uden analyse giver "CodeQL is reporting
        # warnings" på tool-statussiden. Ingen build: autobuild er no-op for python.
        language: [javascript-typescript, actions, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: /language:${{ matrix.language }}
