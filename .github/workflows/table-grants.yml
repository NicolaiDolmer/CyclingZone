name: Explicit table grants
on:
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/audit-table-grants*'
      - 'scripts/lint-migration-idempotency.mjs'
      - '.github/workflows/table-grants.yml'
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'scripts/audit-table-grants*'
      - 'scripts/lint-migration-idempotency.mjs'
      - '.github/workflows/table-grants.yml'
permissions:
  contents: read
jobs:
  table-grants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install isolated PostgreSQL test dependency
        run: npm ci --prefix backend --ignore-scripts
      - name: Verify template access as real database roles
        run: node --test scripts/audit-table-grants.pg.test.mjs
      - name: Test missing grants and excess exposure
        run: node --test scripts/audit-table-grants.test.mjs
      - name: Validate the migration template
        run: node scripts/audit-table-grants.mjs database/templates/new-public-table.sql
      - name: Audit changed SQL against its declared access
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/audit-table-grants.mjs --base "$BASE_SHA"
