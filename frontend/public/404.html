<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Cycling Zone</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="This page does not exist. Head back to Cycling Zone, the fair browser-based cycling manager." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- #6557: statisk side (serveres af Vercel med status 404), derfor egne
         tokens kopieret fra src/index.css (Chalk lys / navy mørk) og selvhostede skrifter. -->
    <style>
      @font-face { font-family: "Bebas Neue"; src: url("/fonts/bebas-neue-latin-400-normal.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "DM Sans"; src: url("/fonts/dm-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 1000; font-display: swap; }
      :root {
        color-scheme: light dark;
        --bg-body: #f4f2ec; --bg-card: #fcfbf7; --border: #e5e0d5;
        --text-1: #0e0f15; --text-2: #66637a; --text-3: #9896b0;
        --accent: #e8c547; --accent-t: #a07800;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-body: #0e0f15; --bg-card: #161824; --border: #2a2d3a;
          --text-1: #ededf2; --text-2: #9da0b3; --text-3: #888ba0; --accent-t: #ffd966;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 32px 16px; font-family: "DM Sans", system-ui, sans-serif; background: var(--bg-body); color: var(--text-1); }
      .wordmark { font-family: "Bebas Neue", "DM Sans", sans-serif; font-size: 28px; letter-spacing: .04em; color: var(--text-1); text-decoration: none; padding-bottom: 6px; border-bottom: 1px solid var(--accent); }
      main { width: 100%; max-width: 420px; padding: 32px 28px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; text-align: center; }
      .code { font-family: "Bebas Neue", "DM Sans", sans-serif; font-size: 64px; line-height: 1; color: var(--accent-t); font-variant-numeric: tabular-nums; margin: 0 0 8px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 24px; line-height: 1.5; color: var(--text-2); font-size: 15px; }
      .btn { display: inline-block; padding: 10px 20px; border-radius: 5px; background: var(--accent); color: #0e0f15; font-weight: 600; font-size: 15px; text-decoration: none; }
      .btn:focus-visible { outline: 2px solid var(--text-1); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <a class="wordmark" href="/">CYCLING ZONE</a>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1 data-da="Siden findes ikke">This page doesn't exist</h1>
      <p data-da="Linket kan være forældet, eller der er en tastefejl i adressen.">The link may be out of date, or the address has a typo.</p>
      <a class="btn" href="/" data-da="Tilbage til Cycling Zone">Back to Cycling Zone</a>
    </main>
    <script>
      // Samme sprogvalg som appen: gemt valg (cz_lang) først, ellers browserens sprog. EN er standard.
      (function () {
        var lang = "en";
        try { lang = localStorage.getItem("cz_lang") || ""; } catch (e) { lang = ""; }
        if (!lang) lang = (navigator.language || "en").slice(0, 2).toLowerCase();
        if (lang !== "da") return;
        document.documentElement.lang = "da";
        document.title = "Siden findes ikke · Cycling Zone";
        var els = document.querySelectorAll("[data-da]");
        for (var i = 0; i < els.length; i++) els[i].textContent = els[i].getAttribute("data-da");
      })();
    </script>
  </body>
</html>
