<title>Spoiler shield on v6c</title>
<!--
  #7859 Spoiler shield, built on race page wireframe v6c (#7778).
  Standalone sketch: no product code, no imports from the app, not built by Vite.
  The CSS block marked "wireframe v6c" is copied unchanged from the wireframe, so the
  race page renders exactly as the wireframe does. Everything after it is the sketch's own.
  All races, riders, teams and numbers are synthetic. Views: ?v=1 ... ?v=9.
  ?shot hides the sketch bar (used for the screenshots), ?marks shows the numbered
  deviations from the wireframe.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter+Tight:wght@600;700&family=Bebas+Neue&display=swap">
<style>

  --film:#0b0d15; --mine:rgba(232,197,71,.12); --pop:#232735; --g0:#4a4f62; --gd:#2e3343; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --card:#191c26; --sub:#1f2330; --line:#2c3142; --t1:#f1efe8; --t2:#c3c0cf; --t3:#9a97ab;
  --gold-t:#ecd07a; --gold-soft:rgba(232,197,71,.16); --navy:#0b0d15; --good:#4cc283; --warn:#e3a54a; --bad:#ff6b6b;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--t1);font-family:var(--body);font-size:14px;line-height:1.45}

/* ===== v6b: system-true fixes only (TASTE.md + PAGE_TEMPLATES.md), #7778. Taste choices (hero form, width) untouched. ===== */
:root{--me-bg:#1a1f38;--me-fg:#f4f2ec;
  --terrain-flat:#2a7366;--terrain-rolling:#567326;--terrain-hilly:#80651a;--terrain-mountain:#962f2a;--terrain-high-mountain:#62388f;--terrain-time-trial:#2b5f99;--gold-face:rgba(232,197,71,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--me-bg:#ededf2;--me-fg:#0e0f15;
  --terrain-flat:#5fae9f;--terrain-rolling:#97b46a;--terrain-hilly:#c9aa55;--terrain-mountain:#cf6f69;--terrain-high-mountain:#a885c9;--terrain-time-trial:#6f9fd4}}
/* section card recipe: 20px padding (16 mobile), 15/600 title, 16px under header, 14px gaps */
.card{padding:20px}.card h2{font-size:15px;font-weight:600;margin-bottom:16px}
.grid,.col{gap:14px}
/* micro type: only 11 (text-2xs) and 10 (text-3xs) below 12 */
th{font-size:11px}.st .today{font-size:10px}.st .win,.st .top .t{font-size:11px}.legend{font-size:11px}
.rr .b,.rr .a,.rr .ty{font-size:11px}.word{font-size:12px}.pop .h{font-size:11px}.tychip{font-size:11px}
/* one radius: 5px (pills only for chips/DIG) */
.lab,.tychip,.pop .o,.st .today{border-radius:5px}
.legend i{border-radius:0;width:10px;height:10px;vertical-align:-1px}
/* no shadows outside overlays */
img.fl{box-shadow:none;outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
.st[aria-pressed="true"]{box-shadow:none;border-color:var(--line);border-bottom:2px solid var(--gold);padding-bottom:7px}
/* gold only in the four places: active choices use the Segmented recipe (gold text on a 10% gold face) */
.seg button[aria-pressed="true"],.mode button[aria-pressed="true"]{background:var(--gold-face);color:var(--gold-t);cursor:default}
.plan[aria-pressed="true"]{box-shadow:none;border-color:var(--line);background:var(--gold-face)}.plan[aria-pressed="true"] b{color:var(--gold-t)}
.btn2[aria-pressed="true"],.chip[aria-pressed="true"],.chapters button[aria-pressed="true"]{background:var(--card);color:var(--t1);border-color:var(--t1)}
.report button[aria-current="true"],.pop .o[aria-pressed="true"]{background:var(--sub)}

/* synthetic elevation: rolling base plus ramps for each climb */
function makeProfile(D, base, climbs, opts = {}){
  const h = [];
  for (let km = 0; km <= D; km++){
    let e = base + 22 * Math.sin(km / 7.3) + 11 * Math.sin(km / 2.9) + (opts.tilt || 0) * km;
    for (const c of climbs){
      const foot = c.crest_km - c.length_km, rise = c.length_km * c.avg_gradient * 10, dl = c.desc ?? rise / 70;
      if (km >= foot && km <= c.crest_km) e = Math.max(e, base + rise * ((km - foot) / c.length_km));
      else if (km > c.crest_km && km <= c.crest_km + dl) e = Math.max(e, base + rise * (1 - (km - c.crest_km) / dl));
    }
    h.push(Math.round(e));
  }
  const segments = [];
  for (const c of climbs){ segments.push({ kind:'climb', from_km:c.crest_km - c.length_km, to_km:c.crest_km }); if (c.crest_km < D) segments.push({ kind:'descent', from_km:c.crest_km, to_km:Math.min(D, c.crest_km + (c.desc ?? c.length_km * c.avg_gradient * 10 / 70)) }); }
  return { h, step_km:1, segments };
}

function miniProf(q){ const h = q.elevation_profile?.h || []; if (!h.length) return ''; const step = Math.max(1, Math.floor(h.length / 60)); const pts = h.filter((_,i) => i % step === 0); const mx = Math.max(...pts), mn = Math.min(...pts), rng = Math.max(mx - mn, 300); const line = pts.map((e,i) => `${(i/(pts.length-1)*100).toFixed(1)},${(26 - (e-mn)/rng*22).toFixed(1)}`).join(' '); const D = q.distance_km || 1, dots = (q.climbs || []).filter(c => c.category).map(c => { const i = Math.min(h.length - 1, Math.round(c.crest_km / D * (h.length - 1))); return `<i style="left:${(c.crest_km / D * 100).toFixed(1)}%;top:${((26 - (h[i]-mn)/rng*22) / 26 * 24).toFixed(1)}px"></i>`; }).join(''); return `<span class="mini-w"><svg class="mini" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,26 ${line} 100,26" fill="var(--g0)"/></svg>${dots}</span>`; }
function profileInner(n, opts = {}){
  const p = PROFILE[n]; const h = p.elevation_profile.h; const D = p.distance_km;
  const W = Math.max(480, opts.W || 1000), nC = (p.climbs || []).length, rowsL = nC > 2 && W < 900 ? 3 : 2, LS = rowsL === 3 ? 30 : 16, extra = rowsL === 3 ? 44 : 0, H = (opts.h || 240) + extra, top = 46 + extra, bot = 30, left = 62;
  const maxH = Math.max(...h), minH = Math.min(...h);
  const yMax = Math.ceil((maxH + 150)/500)*500, yMin = Math.max(0, Math.floor((minH - 150)/500)*500);
  const X = km => left + (km / D) * (W - left - 8);
  const Y = e => top + (1 - (e - yMin) / (yMax - yMin)) * (H - top - bot);
  const step = p.elevation_profile.step_km;
  const climbs = p.segments.filter(s => s.kind === 'climb'), desc = p.segments.filter(s => s.kind === 'descent');
  let slices = '';
  for (let i = 0; i < h.length - 1; i++){
    const km = i * step, g = (h[i+1]-h[i]) / (step*1000) * 100;
    const inDesc = desc.some(s => km >= s.from_km && km < s.to_km);
    const col = inDesc || g < 0 ? 'var(--gd)' : bandColor(g);
    slices += `<path d="M${X(km).toFixed(1)} ${(H-bot)} L${X(km).toFixed(1)} ${Y(h[i]).toFixed(1)} L${X(km+step).toFixed(1)} ${Y(h[i+1]).toFixed(1)} L${X(km+step).toFixed(1)} ${H-bot}Z" fill="${col}"/>`;
  }
  const line = h.map((e,i) => `${i?'L':'M'}${X(i*step).toFixed(1)} ${Y(e).toFixed(1)}`).join(' ');
  let grid = '';
  for (let e = yMin; e <= yMax; e += 500){ grid += `<line x1="${left}" x2="${W-8}" y1="${Y(e)}" y2="${Y(e)}" stroke="var(--line)"/><text x="${left-6}" y="${Y(e)+4}" text-anchor="end" font-size="11" fill="var(--t3)">${e.toLocaleString('en-GB')} m</text>`; }
  const OFF = i => rowsL === 3 ? ((i % 3) - 2) * LS : (i % 2) * 16;
  let marks = '';
  (p.climbs || []).forEach((c, i) => {
    const seg = climbs.find(s => Math.abs(s.to_km - c.crest_km) < 1.5) || {};
    const x = X(c.crest_km); const idx = Math.min(h.length-1, Math.round(c.crest_km/step)); const y = Y(h[idx]);
    const anchor = x > W - 220 ? 'end' : 'start', tx = anchor === 'end' ? x - 22 : x + 22;
    marks += `<line x1="${x}" x2="${x}" y1="${y}" y2="${top-6+OFF(i)}" stroke="var(--t2)"/>
      <rect x="${Math.min(x, W-12)-11}" y="${top-24+OFF(i)}" width="22" height="18" rx="3" fill="var(--kom)"/><text x="${Math.min(x, W-12)}" y="${top-11+OFF(i)}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${c.category}</text>
      <text x="${tx}" y="${top-14+OFF(i)}" text-anchor="${anchor}" font-size="12.5" font-weight="700" fill="var(--t1)">${esc(c.name)}</text>
      <text x="${tx}" y="${top+1+OFF(i)}" text-anchor="${anchor}" font-size="11" fill="var(--t2)">${c.length_km} km · ${c.avg_gradient} % · ${Math.round(h[idx]).toLocaleString('en-GB')} m</text>
      <rect x="${X(seg.from_km ?? c.crest_km - c.length_km)}" y="${H-bot+4}" width="${X(c.crest_km)-X(seg.from_km ?? c.crest_km - c.length_km)}" height="6" fill="var(--kom)"/>`;
  });
  let spr = '';
  (p.sprints || []).filter(s => s.kind === 'intermediate').forEach(s => { const x = X(s.km); spr += `<g><line x1="${x}" x2="${x}" y1="${top+30}" y2="${H-bot}" stroke="var(--good)" stroke-dasharray="3 3"/><rect x="${x-9}" y="${top+22}" width="18" height="16" rx="3" fill="var(--good)"/><text x="${x}" y="${top+34}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">S</text></g>`; });
  const last10 = `<rect x="${X(D-10)}" y="${top-4}" width="${X(D)-X(D-10)}" height="${H-bot-top+4}" fill="var(--sub)" opacity=".7"/>`;
  const pos = opts.posKm != null ? `<line x1="${X(opts.posKm)}" x2="${X(opts.posKm)}" y1="${top-6}" y2="${H-bot}" stroke="var(--gold)" stroke-width="2"/><circle cx="${X(opts.posKm)}" cy="${Y(h[Math.min(h.length-1, Math.round(opts.posKm/step))])}" r="6" fill="var(--gold)" stroke="#0e0f15"/>` : '';

  const chap = CHAPTERS.slice().reverse().find(c => c[1] <= pos);
  const cur = L.slice().reverse().find(l => l[0] <= pos);
  return `<div class="grid"><div class="col"><section class="card"><h2>Race film <small>one player · the route is the timeline</small></h2>
     <div class="film"${VIEW === '2' ? dev(1) : ''}>${profileSVG(1, { h:190, posKm:pos })}
      <div class="ctl"><button type="button"><svg class="chev"><use href="#s-play"/></svg>Play</button><input type="range" min="0" max="162" step="0.5" value="${pos}" aria-label="Position in the stage, km"><span class="n" style="font-family:var(--num)">km ${pos}</span><span>${chap ? chap[0] : ''}</span></div></div>
     <div class="chapters">${CHAPTERS.map(c => `<button type="button" aria-pressed="${chap && chap[0]===c[0]}">${c[0]}</button>`).join('')}</div>
    </section></div>
    <div class="col"><section class="card"><h2>What happened <small>${sh ? 'only up to where you are in the film' : 'click a line to jump'}</small></h2>
     <div class="report">${L.map(l => `<button type="button" aria-current="${cur && cur[0]===l[0]}"><span class="km">km ${l[0]}</span><span>${esc(l[1])}</span></button>`).join('')}</div>
     ${sh && pos < 150 ? '<div class="hidden-box" style="margin-top:8px">The finale is ahead · keep watching</div>' : ''}
    </section>${sh ? `<div class="hidden-box">Your day and the result are in Results · <button type="button" class="btn2" data-act="show">Show results</button></div>` : ''}</div></div>`;
}
function stageView(){
  const seg = `<div class="seg rl-mode" role="group" aria-label="Stage view"><button type="button" aria-pressed="${S.mode==='story'}" data-mode="story">Story · film and report</button><button type="button" aria-pressed="${S.mode==='results'}" data-mode="results">Results · full list</button></div>`;
  return routeLine(1, seg, S.mode !== 'story') + (S.mode === 'story' ? stageStory() : (hidden(1) ? `<div class="hidden-box">Results are hidden by your spoiler shield · <button type="button" class="btn2" data-act="show">Show results</button></div>` : stageResults()));
}
const racePage = () => hero() + calendar() + `<main>${stageView()}</main>`;

/* ---------- 5 dashboard ---------- */
function todayCard(o){
  return `<a class="sc" href="#" onclick="return false"${dev(o.dev)}><div class="hd"><div style="min-width:0"><div class="nm">${esc(o.race)}</div><div class="mlab lv">${esc(o.label)}</div></div><span class="badge ${o.badge}">${o.state}</span></div>${miniProf(PROFILE[o.stage])}<div class="stl">${o.line}</div><div class="mlab sec">${o.sec}</div></a>`;
}
function dashboard(){
  const done = sh => todayCard({ race:RACE, label:'Stage 1 of 7', stage:1, badge:'neutral', state:'Finished', dev: sh ? 1 : 0,
    line: sh ? `<svg class="eye"><use href="#s-eyeoff"/></svg><span>Result hidden by your spoiler shield</span>` : `<svg class="eye"><use href="#s-trophy"/></svg><span class="win-n">Won by Luca Ferrandi</span>`,
    sec: sh ? 'Standing after the last stage you have seen' : 'GC: 3rd of 140' });
  const live = todayCard({ race:'Tour of the Fjords', label:'Stage 3 of 5', stage:3, badge:'live', state:'Live', line:'<span class="badge live" style="background:none;padding:0">Live</span>', sec:'GC: 12th of 120' });
  const up = todayCard({ race:RACE, label:'Stage 2 of 7', stage:2, badge:'neutral', state:'Upcoming', line:'<span class="t" style="font-family:var(--num)">17:00</span>', sec:'Locks 16:55' });
  const latest = sh => `<section class="card lr"${dev(sh ? 2 : 0)}><h2>Latest result <small class="mlab">Sat 13:02</small></h2>
     <p class="big">${sh ? `Stage 1 of ${RACE} is finished` : 'Mikkel Aagaard 3rd on stage 1'}</p>
     <p class="dim" style="margin:0">${sh ? 'Your riders and the winner stay hidden until you open the stage.' : `${RACE} · 1:29 behind the winner · 43 prize pts`}</p>
     ${sh ? `<div class="hidden-box">Your result is hidden by your spoiler shield · <button type="button" class="btn2">Show result</button></div>` : `<div class="tbl" style="margin-top:10px"><table><tbody><tr><td class="p">3</td><td>${fl('dk')}${rn('Mikkel Aagaard')}</td><td class="n">+1:29</td></tr><tr><td class="p">9</td><td>${fl('nl')}${rn('Jonas Vermeer')}</td><td class="n">+2:37</td></tr></tbody></table></div>`}</section>`;
  const block = sh => `<div class="sk-col"><section class="card"><h2>Today's stages <small class="mlab">3 stages</small></h2><div class="strip">${done(sh)}${live}${up}</div></section>${latest(sh)}</div>`;
  return `<div class="t2"><div class="pagehead"><h1 class="pg">Dashboard</h1><p class="dim">Your team, today and the latest results.</p></div>
    <p class="cap">With the shield on</p>${block(true)}
    <p class="cap" style="margin-top:24px">Shield off (as today)</p><div class="was">${block(false)}</div></div>`;
}

/* ---------- 6 inbox and in-game ---------- */
function inbox(){
  const row = (o) => `<li class="${o.unread ? 'unread' : ''}"${dev(o.dev)}><svg class="ri"><use href="#${o.icon}"/></svg><div><div class="ti">${o.unread ? '<span class="dot" aria-label="Unread"></span>' : ''}${esc(o.title)}</div>${o.msg ? `<div class="ms">${esc(o.msg)}</div>` : ''}<div class="mlab mt">${o.meta}</div></div>${o.act ? `<button type="button" class="quiet">${o.act}<svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>` : '<span></span>'}</li>`;
  const neutral = { unread:true, icon:'s-flag', title:`Stage 1 of ${RACE} is finished`, msg:'', meta:'Sat 13:02 · Race', act:'See the result', dev:1 };
  const today = { unread:true, icon:'s-flag', title:'Ferrandi wins solo on Monte Serra', msg:`Stage 1 of ${RACE}. Mikkel Aagaard 3rd, Jonas Vermeer 9th.`, meta:'Sat 13:02 · Race', act:'See the result' };
  const other = [
    { icon:'s-gavel', title:'You were outbid on Stefan Ricci', msg:'The auction ends Sat 21:00.', meta:'Sat 12:40 · Auction', act:'Bid again' },
    { icon:'s-coin', title:'Sponsor payment received', msg:'Paid into your account.', meta:'Sat 08:00 · Finance', act:'' },
  ];
  return `<div class="t1"><div class="pagehead row"><div><h1 class="pg">Notifications</h1><p class="dim">Races, auctions, transfers and your board.</p></div><div class="acts"><button type="button" class="btn2">Mark all as read</button></div></div>
    <div class="sk-col">
    <section class="card"><h2>Inbox <small class="mlab">With the shield on</small></h2><ul class="rows">${row(neutral)}${other.map(row).join('')}</ul></section>
    <section class="card"${dev(2)}><h2>In-game <small class="mlab">bell and pop-up, with the shield on</small></h2>
      <div class="frame"><div class="topbar"><span class="dim" style="margin-right:auto">Top bar</span><span class="bell" aria-label="Notifications, 1 unread"><svg><use href="#s-bell"/></svg><span class="n">1</span></span></div>
        <div class="popin" role="dialog" aria-label="Latest notifications"><div class="h">Latest</div><div class="o"><b>Stage 1 of ${RACE} is finished</b><small>Sat 13:02 · Race</small></div><div class="o">You were outbid on Stefan Ricci<small>Sat 12:40 · Auction</small></div></div>
        <div class="toast" role="status"><svg class="ri" style="width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:1.6"><use href="#s-flag"/></svg><div><b>Stage 1 is finished</b><span class="dim">${RACE}</span><div style="margin-top:6px"><button type="button" class="quiet">Open the race<svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button></div></div></div>
      </div></section>
    <section class="card was"><h2>The same race row with the shield off <small class="mlab">as today</small></h2><ul class="rows">${row(today)}</ul></section>
    </div></div>`;
}

/* ---------- 7 browser notifications and settings ---------- */
function browserView(){
  const rule = (on, label, d) => `<button type="button" class="rule" aria-pressed="${on}"${dev(d)}><i aria-hidden="true"></i>${label}</button>`;
  return `<div class="t1"><div class="pagehead"><h1 class="pg">Settings</h1><p class="dim">Notifications, language and how results reach you.</p></div>
    <div class="sk-col">
    <section class="card"><h2>Browser notifications <small class="mlab">with the shield on</small></h2>
      <div class="os-wrap"${dev(1)}><div><p class="os-cap">Android</p><div class="os android"><div class="app"><i></i>Cycling Zone · now</div><b>Stage 1 is finished</b><p>${RACE} · see the result</p></div></div>
      <div><p class="os-cap">Chrome on a computer</p><div class="os win"><div class="app"><i></i>Cycling Zone · cyclingzone.app</div><b>Stage 1 is finished</b><p>${RACE} · see the result</p></div></div></div>
      <p class="dim" style="margin:12px 0 0">With the shield off the notification says who won and where your riders finished, as today.</p></section>
    <section class="card"><h2>Results and spoilers</h2><div class="set">
      <div class="r"><div><b>Spoiler shield for all races</b><p>Hides winners and results until you open the stage. Each race page also has its own switch.</p></div>${rule(false, 'Off', 2)}</div>
      <div class="r"><div><b>Browser notifications</b><p>A notification when a stage is finished. With the shield on it only says that the stage is finished.</p></div>${rule(true, 'On', 0)}</div>
      <div class="r"><div><b>Open a finished stage in</b><p>The shield always opens a finished stage in Story.</p></div><div class="seg" role="group" aria-label="Open a finished stage in"><button type="button" aria-pressed="true">Results</button><button type="button" aria-pressed="false">Story</button></div></div>
    </div></section></div></div>`;
}

/* ---------- 8 standings ---------- */
function standings(){
  const T = [['Team C',412,0],['Team F',398,1],[ME,377,2],['Team D',351,3],['Team H',330,4],['Team B',318,5],['Team G',296,6],['Team E',281,7],['Team A',260,8]];
  return `<div class="t2"><div class="pagehead row"><div><h1 class="pg">Standings</h1><p class="dim"${dev(1)}>Division 2 · points up to the last stage you have seen: ${RACE}, before stage 1</p></div><div class="acts"><button type="button" class="btn2"${dev(2)}>Show latest</button></div></div>
    <div class="tabs small" role="tablist"><button role="tab" type="button" aria-selected="true">Teams</button><button role="tab" type="button" aria-selected="false">Riders</button></div>
    <section class="card"><h2>Season standings <span class="hd-meta"${dev(3)}>1 finished stage not seen yet</span></h2>
      <div class="tbl"><table data-sort-exempt="standings"><thead><tr><th>Pos</th><th>Team</th><th class="n">Races</th><th class="n">Points</th><th class="n">Gap</th></tr></thead><tbody>
      ${T.map(([t, pts], i) => `<tr><td class="p">${i + 1}</td><td class="team">${tn(t)}${t === ME ? '<span class="you">You</span>' : ''}</td><td class="n">14</td><td class="n">${pts}</td><td class="n">${i ? '-' + (T[0][1] - pts) : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="dim" style="margin-top:8px">The Riders tab follows the same rule. Show latest adds the stages you have not seen.</p></section></div>`;
}

/* ---------- 9 coverage (Danish: for the owner) ---------- */
function coverage(){
  const R = [
    ['Løbsside: etapestriben', 'Vinder pr. kørt etape, fører i Samlet', 'hide', 'Finished / Hidden (wireframe)', '2, 3'],
    ['Løbsside: hovedet', 'Vinder og afstand i verdict-linjen', 'hide', 'Stage finished · result hidden by your spoiler shield (wireframe)', '2, 3'],
    ['Løbsside: Story', 'Referat og film til mål', 'hide', 'Kun til hvor du er i filmen, The finale is ahead (wireframe)', '2'],
    ['Løbsside: Results, Din dag, trøjer, sidste km', 'Alle placeringer', 'hide', 'Bag Show results (wireframe)', '3'],
    ['Løbsside: Taktik efter etapen', 'Placering pr. rytter', 'hide', 'Hidden, som wireframets Tactics-kolonne', '3'],
    ['Løbscentret og Resultater-siden', 'Podium pr. løb', 'hide', 'Finished i stedet for podium, samme ord som striben', '9'],
    ['Forside: dagens etaper', 'Vindernavn på chippen', 'hide', 'Result hidden by your spoiler shield', '5'],
    ['Forside: Seneste resultat', 'Placeringer, "vandt"', 'hide', 'Stage 1 is finished + Show result', '5'],
    ['Indbakke', 'Referat-overskrift + placering', 'neutral', 'Stage 1 of [løb] is finished · See the result', '6'],
    ['Klokke og pop-up i spillet', 'Samme tekst som indbakken', 'neutral', 'Stage 1 is finished · Open the race', '6'],
    ['Browser-notifikation (push)', 'Samme tekst som indbakken', 'neutral', 'Stage 1 is finished · [løb] · see the result', '7'],
    ['Mail-digest', 'Bedste placering pr. løb', 'neutral', 'Forslag: samme neutrale tekst (ikke aftalt)', '7'],
    ['Stilling og ranglister', 'Point fra nye etaper', 'seen', 'Stilling efter din sidst sete etape + Show latest', '8'],
    ['Holdets og rytterens resultatfaner, hover-kort', 'Seneste placeringer', 'seen', 'Kun etaper du har set', '8'],
    ['Løbshistorik og arkiv', 'Vindere', 'seen', 'Kun etaper du har set', '8'],
    ['Præstationer og bestyrelsesmål', 'Udløses af en etapesejr', 'seen', 'Vises først når etapen er set (skal med i byggeplanen)', '9'],
    ['Discord (DM og bot)', 'Placeringer', 'out', 'Ikke en del af løsningen (ejervalg 16/11)', '9'],
  ];
  const TAG = { hide:['Skjult','hide'], neutral:['Neutral tekst','neutral'], seen:['Til sidst sete etape','seen'], out:['Udenfor','out'] };
  return `<div class="t2"><div class="pagehead"><h1 class="pg">Hvor skjoldet virker</h1><p class="dim">Skjoldet er slået fra som standard. Når det er slået til, gælder én regel tre steder: skjul, sig det neutralt, eller vis til din sidst sete etape.</p></div>
    <section class="card"><h2>Alle steder et resultat afsløres i dag <small class="mlab">liste fra skitsen 16/11</small></h2><div class="tbl"><table class="cov" data-sort-exempt="kortlaegning"><thead><tr><th>Sted</th><th class="why-col">Afslører i dag</th><th>Med skjoldet</th><th class="why-col">Sådan</th><th class="n">Visning</th></tr></thead><tbody>
    ${R.map(([w, a, k, how, v]) => `<tr><td>${esc(w)}</td><td class="why-col dim">${esc(a)}</td><td><span class="tag ${TAG[k][1]}">${TAG[k][0]}</span></td><td class="why-col">${esc(how)}</td><td class="n">${v}</td></tr>`).join('')}
    </tbody></table></div></section></div>`;
}

/* ---------- render ---------- */
function bar(){
  return `<div class="sk-bar"><b>Skitse #7859 · spoiler-skjold bygget på wireframe v6c.</b><span>Syntetiske data. Visning 1-4 er løbssiden som wireframet, 5-9 udvider samme løsning. Tilføj <code>&amp;marks</code> for afvigelser.</span><nav aria-label="Views">${VIEWS.map(([k, l]) => `<a href="?v=${k}${Q.has('marks') ? '&marks' : ''}" aria-current="${k === VIEW ? 'page' : 'false'}">${k} ${l}</a>`).join('')}</nav></div>`;
}
function render(){
  const body = ['1','2','3','4'].includes(VIEW) ? racePage() : VIEW === '5' ? dashboard() : VIEW === '6' ? inbox() : VIEW === '7' ? browserView() : VIEW === '8' ? standings() : coverage();
  document.getElementById('wrap').innerHTML = bar() + body;
  setCalH(); fitProfiles();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'shield'){ S.shield = !S.shield; S.mode = S.shield ? 'story' : 'results'; if (S.shield) S.pos = Math.min(S.pos, 128); return render(); }
  if (b.dataset.act === 'show'){ S.seen[S.stage] = true; S.mode = 'results'; return render(); }
  if (b.dataset.mode){ S.mode = b.dataset.mode; return render(); }
});
window.addEventListener('resize', () => { fitProfiles(); setCalH(); });
render();
</script>
</body>
</html>
