<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch #7627 training receipt shows the race contribution</title>
<!--
  Levende skitse til #7627. Statisk, ingen build, ingen netvaerk: aabn filen direkte i en browser.
  Parametre: ?v=now|a|b|c  ?theme=light|dark  ?lang=en|da  ?open=first|all|none  ?w=<px> (kun til billeder)
  Data er opfundne eksempler (Rytter A, B, C). Ingen rigtige spillere, hold eller balancetal.
  Alle tal er procent af vejen mod naeste hele point, samme enhed som kvitteringen viser i dag.
  Sketchen laeser kun det kvitteringen allerede har: pr. aktivitet fremgang pr. evne (progress_before/after, gains).
-->
<style>
:root{
  --bg-body:#f4f2ec;--bg-card:#fcfbf7;--bg-subtle:#ece9e1;--border:#e5e0d5;--border-strong:#827f96;
  --text-1:#0e0f15;--text-2:#4c4a5e;--text-3:#67657e;--accent:232 197 71;--accent-t:160 120 0;--on-accent:#1a1f38;
  --success:21 119 47;--danger:168 30 30;--radius:5px;
  --font-sans:'DM Sans',system-ui,-apple-system,sans-serif;--font-data:'Inter Tight',system-ui,sans-serif;
  --font-display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
}
[data-theme="dark"]{
  --bg-body:#0e0f15;--bg-card:#161824;--bg-subtle:#14161e;--border:#2a2d3a;--border-strong:#6a6e86;
  --text-1:#ededf2;--text-2:#9da0b3;--text-3:#888ba0;--accent-t:255 217 102;--success:95 217 138;--danger:251 132 132;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-body);color:var(--text-1);font:14px/1.45 var(--font-sans);-webkit-font-smoothing:antialiased}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.sketch-bar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 12px;border:1px dashed var(--border-strong);border-radius:var(--radius);font-size:12px;color:var(--text-2);margin-bottom:16px}
.sketch-bar a{color:rgb(var(--accent-t));text-decoration:none;margin-right:6px}
.sketch-bar a.on{font-weight:700;text-decoration:underline}
h1{font:400 28px/1 var(--font-display);letter-spacing:.02em;margin:0 0 4px}
.sub{color:var(--text-2);font-size:12px;margin:0 0 16px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.meta{font:500 10px/1.3 var(--font-data);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;min-height:44px}
.sec-h h2{font:400 22px/1 var(--font-display);letter-spacing:.03em;margin:0}
.note{font-size:12px;color:var(--text-2);margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:12px}
.tiles .big{font:700 20px/1.1 var(--font-data);font-variant-numeric:tabular-nums}
.tiles .mid{font:600 18px/1.1 var(--font-data);font-variant-numeric:tabular-nums}
.tiles .lbl{font-size:10px;color:var(--text-3)}
.tiles.four{grid-template-columns:repeat(4,1fr)}
/* rytterraekker */
.cols{display:grid;gap:8px;align-items:center;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 4.5rem}
.cols.race{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 7rem 4.5rem}
.head{padding:8px 0;font:500 10px/1.3 var(--font-data);text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.rrow{border-top:1px solid var(--border)}
.rbtn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:44px;padding:12px 0}
.rbtn.cols{display:grid;text-align:left;color:var(--text-1);font:inherit}
.rbtn:hover{background:var(--bg-subtle)}
.rbtn:focus-visible{outline:2px solid rgb(var(--accent-t));outline-offset:2px}
.rname{font-size:13px;font-weight:600}
.pt{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-weight:600;color:rgb(var(--success))}
.dim{color:var(--text-3)}
.small{font-size:12px}
.detail{border-top:1px solid var(--border);padding:16px 0 16px 19px}
.acts{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:12px 12px}
.acts .d{font:400 10px var(--font-data);color:var(--text-3)}
.acts .n{font-size:12px;font-weight:500;margin-top:4px}
.acts .i{font-size:10px;color:var(--text-3)}
.acts li.rc{border-left:2px solid rgb(var(--accent));padding-left:8px}
.acts .g{margin-top:6px;display:grid;gap:2px}
.acts .g span{font:500 11px/1.3 var(--font-data);font-variant-numeric:tabular-nums;color:var(--text-2)}
.acts .g span b{color:var(--text-1);font-weight:600}
.blk{margin-bottom:12px}
.line{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;border-top:1px solid var(--border);padding:8px 0;font-size:12px}
.line.l{padding:6px 0}
.cols2{columns:2;column-gap:24px}
.cols2 .line{break-inside:avoid}
.from-race{font:500 11px var(--font-data);font-variant-numeric:tabular-nums;color:rgb(var(--accent-t))}
.foot{margin:12px 0 0;font-size:12px;color:var(--text-3)}
/* variant B: evne x kilde */
.src{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) 4.5rem 4.5rem 5.5rem;gap:8px;align-items:center;border-top:1px solid var(--border);padding:8px 0;font-size:12px}
.src.hd{border-top:0;padding:0 0 4px;font:500 10px/1.3 var(--font-data);text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.src .r{text-align:right;font-family:var(--font-data);font-variant-numeric:tabular-nums}
.bar{display:flex;height:8px;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:var(--bg-subtle)}
.bar i{display:block;height:100%}
.bar .t{background:var(--border-strong)}
.bar .rc{background:rgb(var(--accent))}
.key{display:flex;gap:16px;font-size:11px;color:var(--text-2);margin:0 0 8px}
.key span::before{content:"";display:inline-block;width:10px;height:8px;margin-right:6px;border:1px solid var(--border);vertical-align:0}
.key .t::before{background:var(--border-strong)}
.key .rc::before{background:rgb(var(--accent))}
.whole{display:inline-block;margin-left:6px;font:600 11px var(--font-data);color:rgb(var(--success))}
.cell-lbl{display:none}
/* variant C: raekke-kolonne og dagsstribe */
.mini{display:flex;align-items:center;gap:8px}
.mini .bar{flex:1;min-width:36px}
.mini b{font:600 12px var(--font-data);font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right}
.strip{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 12px;margin-bottom:12px;border:1px solid var(--border);border-left:2px solid rgb(var(--accent));border-radius:var(--radius);font-size:13px}
.strip .bar{width:160px}
.strip b{font-family:var(--font-data);font-variant-numeric:tabular-nums}
/* prosa om varianten */
.about{margin-top:24px;display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.about .card h3{margin:0 0 6px;font:400 20px/1 var(--font-display);letter-spacing:.03em}
.about .card p{margin:0 0 6px;font-size:12px;color:var(--text-2)}
@media (max-width:720px){
  .wrap{padding:16px}
  .tiles,.tiles.four{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:minmax(0,1fr) 4.5rem}
  .cols.race{grid-template-columns:minmax(0,1fr) 5.5rem}
  .cols>.dev{grid-column:1 / -1;order:3}
  .cols.race>.rshare{order:2}
  .head .dev,.head.cols .dev{display:none}
  .acts{grid-template-columns:repeat(3,1fr)}
  .cols2{columns:1}
  .src{grid-template-columns:minmax(0,1fr) 3.4rem 3.4rem 4rem}
  .src>.bar{grid-column:1 / -1;order:5}
  .src.hd>.barh{display:none}
  .detail{padding-left:0}
  .about{grid-template-columns:1fr}
  .strip .bar{width:100%}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var V=q.get('v')||'a', LANG=q.get('lang')==='da'?'da':'en', THEME=q.get('theme')==='dark'?'dark':'light';
  var OPEN=q.get('open')||'first', W=parseInt(q.get('w')||'',10);
  document.documentElement.setAttribute('data-theme',THEME); document.documentElement.lang=LANG;
  if(W>0){document.body.style.maxWidth=W+'px';document.body.style.margin='0 auto'}

  var T={
    en:{title:'Training report',date:'Friday 14 Nov',settled:'Settled',note:'All activities for this date are included. Form and fatigue are settled once for the date.',
      whole:'Whole ability points',riders:'Rider receipts',slots:'Training slots recorded',fromRace:'From races',fromRaceOf:'{p}% of the day\'s progress came from races',
      colRider:'Rider',colDev:'Daily development',colFat:'Fatigue',colRace:'Of which race',
      noWhole:'No whole point recorded',train:'Training',race:'Race',raceDay:'Race day {n}',act:'Activity {n}',
      intens:{high:'High intensity',medium:'Medium intensity',low:'Low intensity'},
      wholeH:'Whole ability points',progH:'Progress toward the next point',viaRace:'of which race {p}%',
      srcH:'Where the progress came from',kTrain:'Training',kRace:'Race',cT:'Training',cR:'Race',cAll:'Total',cAbility:'Ability',wholeTag:'+{n} whole',
      expandNote:'Race progress is part of the daily total. It is shown here so you can see which ability each source moved.',
      dayRace:'Races gave {p}% of the squad\'s progress today',
      about:{now:'Today',a:'A. In the activity strip',b:'B. Ability by source',c:'C. Day strip and row column'}},
    da:{title:'Træningsrapport',date:'Fredag 14. nov.',settled:'Afregnet',note:'Alle datoens aktiviteter er med. Form og træthed er opgjort én gang for datoen.',
      whole:'Hele evnepoint',riders:'Rytterkvitteringer',slots:'Træningsdage registreret',fromRace:'Fra løb',fromRaceOf:'{p}% af dagens fremgang kom fra løb',
      colRider:'Rytter',colDev:'Dagens udvikling',colFat:'Træthed',colRace:'Heraf løb',
      noWhole:'Intet helt point registreret',train:'Træning',race:'Løb',raceDay:'Løbsdag {n}',act:'Aktivitet {n}',
      intens:{high:'Høj intensitet',medium:'Middel intensitet',low:'Lav intensitet'},
      wholeH:'Hele evnepoint',progH:'Fremgang mod næste point',viaRace:'heraf løb {p}%',
      srcH:'Hvor fremgangen kom fra',kTrain:'Træning',kRace:'Løb',cT:'Træning',cR:'Løb',cAll:'I alt',cAbility:'Evne',wholeTag:'+{n} helt',
      expandNote:'Fremgang fra løb er med i dagens sum. Her ses det, hvilken evne hver kilde flyttede.',
      dayRace:'Løb gav {p}% af holdets fremgang i dag',
      about:{now:'I dag',a:'A. I aktivitetsstrimlen',b:'B. Evne efter kilde',c:'C. Dagsstribe og rækkekolonne'}}
  };
  var L=T[LANG];
  var AB={en:{climbing:'Climbing',sprint:'Sprint',acceleration:'Acceleration',punch:'Punch',endurance:'Endurance',recovery:'Recovery',tactics:'Tactics'},
          da:{climbing:'Klatring',sprint:'Sprint',acceleration:'Acceleration',punch:'Punch',endurance:'Udholdenhed',recovery:'Restitution',tactics:'Taktik'}}[LANG];
  var ORDER=['climbing','sprint','acceleration','punch','endurance','recovery','tactics'];
  var nf=new Intl.NumberFormat(LANG==='da'?'da-DK':'en-GB');
  function fmt(n){return nf.format(n)}
  function fill(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]})}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  /* Opfundne data. Tal = procent af vejen mod naeste hele point. Aktivitet: kind t(raening) eller r(ace). */
  var RIDERS=[
    {id:'a',name:'Rider A',fat:[34,52],lvl:{climbing:71},start:{climbing:60,endurance:20,punch:10},acts:[
      {k:'t',focus:'climbing',int:'high',d:{climbing:18,endurance:6}},
      {k:'t',focus:'climbing',int:'high',d:{climbing:17,endurance:5}},
      {k:'t',focus:'climbing',int:'medium',d:{climbing:16,endurance:6}},
      {k:'r',day:4,d:{punch:14,endurance:9,climbing:5}},
      {k:'r',day:5,d:{punch:12,endurance:8,climbing:4}}]},
    {id:'b',name:'Rider B',fat:[21,44],lvl:{sprint:64},start:{sprint:85,acceleration:40},acts:[
      {k:'r',day:3,d:{sprint:9,acceleration:10}},
      {k:'r',day:4,d:{sprint:8,acceleration:9}},
      {k:'r',day:5,d:{sprint:7,acceleration:8}}]},
    {id:'c',name:'Rider C',fat:[40,47],lvl:{},start:{recovery:30,tactics:55},acts:[
      {k:'t',focus:'recovery',int:'low',d:{recovery:12,tactics:3}},
      {k:'t',focus:'recovery',int:'low',d:{recovery:11,tactics:4}},
      {k:'t',focus:'recovery',int:'low',d:{recovery:11,tactics:3}},
      {k:'t',focus:'recovery',int:'low',d:{recovery:10,tactics:3}},
      {k:'r',day:5,d:{tactics:4,recovery:2}}]}
  ];
  function sum(o){return Object.keys(o).reduce(function(s,k){return s+o[k]},0)}
  function agg(r){
    var tr={},rc={};
    r.acts.forEach(function(a){var t=a.k==='r'?rc:tr;Object.keys(a.d).forEach(function(k){t[k]=(t[k]||0)+a.d[k]})});
    var rows=[];
    ORDER.forEach(function(k){
      var t=tr[k]||0,c=rc[k]||0,s=(r.start[k]||0);
      if(!t&&!c)return;
      var total=s+t+c,w=Math.floor(total/100);
      rows.push({k:k,t:t,r:c,all:t+c,whole:w,from:s,to:total-w*100});
    });
    return {rows:rows,t:sum(tr),r:sum(rc)};
  }
  function share(a){var s=a.t+a.r;return s?Math.round(a.r/s*100):0}
  var AGG=RIDERS.map(agg);
  function wholeOf(a){return a.rows.filter(function(x){return x.whole>0})}
  var points=AGG.reduce(function(s,a){return s+wholeOf(a).reduce(function(m,x){return m+x.whole},0)},0);
  var dayT=AGG.reduce(function(s,a){return s+a.t},0), dayR=AGG.reduce(function(s,a){return s+a.r},0);
  var dayShare=Math.round(dayR/(dayT+dayR)*100);

  var open={}; RIDERS.forEach(function(r,i){open[r.id]=(OPEN==='all')||(OPEN==='first'&&i===0)});
  var nameOf=function(a){return a.k==='r'?L.race:(a.focus?AB[a.focus]:L.train)};

  function actList(r){
    var showGain=(V==='a');
    return '<ol class="acts">'+r.acts.map(function(a,i){
      var d=a.k==='r'?fill(L.raceDay,{n:a.day}):fill(L.act,{n:i+1});
      var g='';
      if(showGain){
        var ks=ORDER.filter(function(k){return a.d[k]});
        g='<div class="g" data-testid="activity-gain">'+ks.map(function(k){return '<span><b>+'+fmt(a.d[k])+'%</b> '+AB[k]+'</span>'}).join('')+'</div>';
      }
      return '<li'+(a.k==='r'&&V!=='now'?' class="rc"':'')+'><p class="d" style="margin:0">'+d+'</p><p class="n" style="margin:4px 0 0">'+nameOf(a)+'</p>'+
        (a.k==='t'?'<p class="i" style="margin:0">'+L.intens[a.int]+'</p>':'')+g+'</li>';
    }).join('')+'</ol>';
  }
  function wholeBlock(r,a){
    var w=wholeOf(a);
    var body=w.length?w.map(function(x){
      var rc=(V==='a'&&x.r>0)?'<span class="from-race">'+fill(L.viaRace,{p:fmt(x.r)})+'</span>':'';
      return '<div class="line"><span style="font-weight:600">'+AB[x.k]+'</span><span class="num" style="display:flex;gap:12px;align-items:baseline">'+rc+
        '<span class="dim">+'+fmt(x.all)+'%</span><b>'+fmt(r.lvl[x.k])+' &rarr; '+fmt(r.lvl[x.k]+x.whole)+'</b></span></div>';
    }).join(''):'<p class="line small" style="margin:0">'+L.noWhole+'</p>';
    return '<div class="blk"><p class="meta" style="margin:0 0 4px">'+L.wholeH+'</p>'+body+'</div>';
  }
  function progBlock(r,a){
    var p=a.rows.filter(function(x){return !x.whole});
    if(!p.length)return '';
    return '<div class="blk"><p class="meta" style="margin:0 0 4px">'+L.progH+'</p><div class="cols2">'+p.map(function(x){
      var rc=(V==='a'&&x.r>0)?' <span class="from-race">'+fill(L.viaRace,{p:fmt(x.r)})+'</span>':'';
      return '<div class="line l"><span class="dim" style="color:var(--text-2)">'+AB[x.k]+'</span><span class="num">'+rc+' +'+fmt(x.all)+'%</span></div>';
    }).join('')+'</div></div>';
  }
  function srcTable(a){
    var rows=a.rows;
    var max=Math.max.apply(null,rows.map(function(x){return x.all}));
    return '<div class="blk" data-testid="source-table"><p class="meta" style="margin:0 0 6px">'+L.srcH+'</p>'+
      '<div class="key"><span class="t">'+L.kTrain+'</span><span class="rc">'+L.kRace+'</span></div>'+
      '<div class="src hd"><span>'+L.cAbility+'</span><span class="barh"></span><span class="r">'+L.cT+'</span><span class="r">'+L.cR+'</span><span class="r">'+L.cAll+'</span></div>'+
      rows.map(function(x){
        var wt=Math.round(x.t/max*100),wr=Math.round(x.r/max*100);
        return '<div class="src"><span style="font-weight:600">'+AB[x.k]+(x.whole?'<span class="whole">'+fill(L.wholeTag,{n:x.whole})+'</span>':'')+'</span>'+
          '<span class="bar" role="img" aria-label="'+esc(L.cT+' '+x.t+'%, '+L.cR+' '+x.r+'%')+'"><i class="t" style="width:'+wt+'%"></i><i class="rc" style="width:'+wr+'%"></i></span>'+
          '<span class="r dim">'+(x.t?'+'+fmt(x.t)+'%':'0')+'</span><span class="r" style="'+(x.r?'color:rgb(var(--accent-t));font-weight:600':'color:var(--text-3)')+'">'+(x.r?'+'+fmt(x.r)+'%':'0')+'</span>'+
          '<span class="r" style="font-weight:600">+'+fmt(x.all)+'%</span></div>';
      }).join('')+'<p class="foot">'+L.expandNote+'</p></div>';
  }
  function devCell(a){
    var w=wholeOf(a);
    if(!w.length)return '<span class="dim">'+L.noWhole+'</span>';
    return '<span style="display:flex;flex-wrap:wrap;gap:4px 12px">'+w.map(function(x){return '<span><span class="pt">+'+fmt(x.whole)+'</span> '+AB[x.k]+'</span>'}).join('')+'</span>';
  }
  function raceCol(a){
    var s=share(a);
    return '<span class="rshare mini" data-testid="row-race-share"><span class="bar" role="img" aria-label="'+esc(L.colRace+' '+s+'%')+'"><i class="rc" style="width:'+s+'%"></i></span><b>'+(s?s+'%':'0')+'</b></span>';
  }
  function row(r,i){
    var a=AGG[i],isOpen=open[r.id],race=(V==='c');
    var h='<div class="rrow"><button class="rbtn cols'+(race?' race':'')+'" aria-expanded="'+isOpen+'" data-id="'+r.id+'">'+
      '<span class="rname">'+r.name+'</span><span class="dev small">'+devCell(a)+'</span>'+(race?raceCol(a):'')+
      '<span class="num small" style="text-align:right">'+r.fat[0]+' &rsaquo; '+r.fat[1]+'</span></button>';
    if(isOpen){
      h+='<div class="detail" data-testid="rider-details">'+actList(r);
      if(V==='b')h+=srcTable(a);
      else h+=wholeBlock(r,a)+progBlock(r,a);
      h+='</div>';
    }
    return h+'</div>';
  }
  function tiles(){
    var t='<div class="tiles'+(V==='c'?' four':'')+'">'+
      '<div><p class="big" style="margin:0">'+points+'</p><p class="lbl" style="margin:0">'+L.whole+'</p></div>'+
      '<div><p class="mid" style="margin:0">'+RIDERS.length+' / '+RIDERS.length+'</p><p class="lbl" style="margin:0">'+L.riders+'</p></div>'+
      '<div><p class="mid" style="margin:0">5 / 5</p><p class="lbl" style="margin:0">'+L.slots+'</p></div>';
    if(V==='c')t+='<div data-testid="tile-race"><p class="mid" style="margin:0">'+dayShare+'%</p><p class="lbl" style="margin:0">'+L.fromRace+'</p></div>';
    return t+'</div>';
  }
  function strip(){
    return '<div class="strip" data-testid="day-strip"><span>'+fill(L.dayRace,{p:'<b>'+dayShare+'</b>'})+'</span>'+
      '<span class="bar" role="img" aria-label="'+esc(L.kTrain+' '+(100-dayShare)+'%, '+L.kRace+' '+dayShare+'%')+'"><i class="t" style="width:'+(100-dayShare)+'%"></i><i class="rc" style="width:'+dayShare+'%"></i></span></div>';
  }
  function receipt(){
    var race=(V==='c');
    return '<section class="card" data-testid="daily-training-receipt">'+
      '<div class="sec-h"><h2>'+L.date+'</h2><span class="meta">'+L.settled+'</span></div>'+
      '<p class="note">'+L.note+'</p>'+tiles()+(V==='c'?strip():'')+
      '<div class="cols head'+(race?' race':'')+'"><span>'+L.colRider+'</span><span class="dev">'+L.colDev+'</span>'+(race?'<span class="rshare">'+L.colRace+'</span>':'')+'<span style="text-align:right">'+L.colFat+'</span></div>'+
      RIDERS.map(row).join('')+'</section>';
  }
  var DESC={
    en:{now:['What players see today','The activity says only "Race". Race progress is inside the total but cannot be told apart.'],
      a:['Smallest change','Each activity lists what it moved. The whole-point and progress lines say how much of each ability came from races.','Pros: tiny, only the strip and two lines change. Cons: to see where one ability came from you add up slots yourself.'],
      b:['Answers the question directly','Training and race side by side per ability, with a split bar. Replaces the two lists in the fold-out.','Pros: one table, no adding. Cons: it is a new block and the order of slots is lost (the strip stays).'],
      c:['Day and squad level','A day strip says how much of the squad progress came from races, and each row gets a share column.','Pros: shows at a glance which riders lean on races. Cons: a share does not say which ability; needs the fold-out too.']},
    da:{now:['Det spillerne ser i dag','Aktiviteten hedder bare "Løb". Fremgang fra løb ligger i summen, men kan ikke skilles ud.'],
      a:['Mindste ændring','Hver aktivitet viser, hvad den flyttede. Linjerne for hele point og fremgang siger, hvor meget af hver evne der kom fra løb.','Fordele: lille, kun strimlen og to linjer ændres. Ulemper: for at se, hvor én evne kom fra, skal man selv lægge pladser sammen.'],
      b:['Svarer direkte på spørgsmålet','Træning og løb side om side pr. evne med en delt bjælke. Erstatter de to lister i udfoldningen.','Fordele: én tabel, ingen regnestykker. Ulemper: en ny blok, og rækkefølgen af pladser går tabt (strimlen bliver).'],
      c:['Dag og hold','En dagsstribe siger, hvor meget af holdets fremgang der kom fra løb, og hver række får en andelskolonne.','Fordele: viser på et øjeblik, hvilke ryttere der lever af løb. Ulemper: en andel siger ikke hvilken evne; kræver også udfoldningen.']}
  };
  function nav(){
    var vs=['now','a','b','c'],lbl={now:L.about.now,a:L.about.a,b:L.about.b,c:L.about.c};
    function u(p){var s=new URLSearchParams(q);Object.keys(p).forEach(function(k){s.set(k,p[k])});return '?'+s.toString()}
    return '<div class="sketch-bar"><span><b>#7627</b></span><span>'+vs.map(function(v){return '<a href="'+u({v:v})+'"'+(v===V?' class="on"':'')+'>'+lbl[v]+'</a>'}).join('')+'</span>'+
      '<span><a href="'+u({lang:'en'})+'"'+(LANG==='en'?' class="on"':'')+'>EN</a><a href="'+u({lang:'da'})+'"'+(LANG==='da'?' class="on"':'')+'>DA</a></span>'+
      '<span><a href="'+u({theme:'light'})+'"'+(THEME==='light'?' class="on"':'')+'>light</a><a href="'+u({theme:'dark'})+'"'+(THEME==='dark'?' class="on"':'')+'>dark</a></span>'+
      '<span><a href="'+u({open:'first'})+'">first</a><a href="'+u({open:'all'})+'">all</a><a href="'+u({open:'none'})+'">none</a></span></div>';
  }
  function about(){
    var d=DESC[LANG][V];
    return '<div class="card" style="margin-top:16px"><p class="meta" style="margin:0 0 4px">'+L.about[V]+'</p><p style="margin:0 0 4px;font-weight:600">'+d[0]+'</p><p style="margin:0 0 4px;font-size:12px;color:var(--text-2)">'+d[1]+'</p>'+(d[2]?'<p style="margin:0;font-size:12px;color:var(--text-2)">'+d[2]+'</p>':'')+'</div>';
  }
  function render(){
    document.getElementById('app').innerHTML=nav()+'<h1>#7627</h1><p class="sub">'+L.title+'</p>'+receipt()+about();
    Array.prototype.forEach.call(document.querySelectorAll('.rbtn'),function(b){
      b.addEventListener('click',function(){var id=b.getAttribute('data-id');open[id]=!open[id];render()});
    });
  }
  render();
})();
</script>
</body>
</html>
