<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch #8300 dashboard</title>
<!--
  Levende skitse til #8300 (dashboardet som spillets bedste side). Statisk, ingen build, ingen netvaerk:
  aabn filen direkte i en browser.
  Parametre: ?v=now|a|b|c  ?shield=off|on  ?theme=light|dark  ?return=1 (tilbagevendende spiller, ikke tilmeldt)
  Data er opfundne eksempler (holdnavne, ryttere, tal). Flag er de rigtige flag-icons 7.6.0-SVG'er,
  samme pakke og version som spillets <Flag>-komponent.
  Spillertekst er EN (spillet er EN-first); skitse-baandet oeverst er dansk til ejeren.
-->
<style>
@font-face{font-family:'DM Sans';src:url('../../frontend/public/fonts/dm-sans-latin-wght-normal.woff2') format('woff2');font-weight:100 1000}
@font-face{font-family:'Inter Tight';src:url('../../frontend/public/fonts/inter-tight-latin-wght-normal.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'Bebas Neue';src:url('../../frontend/public/fonts/bebas-neue-latin-400-normal.woff2') format('woff2')}
:root{
  --bg-body:#f4f2ec;--bg-card:#fcfbf7;--bg-subtle:#ece9e1;--border:#e5e0d5;--border-strong:#827f96;
  --text-1:#0e0f15;--text-2:#4c4a5e;--text-3:#67657e;--accent:232 197 71;--accent-t:160 120 0;--on-accent:#1a1f38;
  --success:21 119 47;--danger:168 30 30;--info:37 99 235;--radius:5px;
  --sidebar:#1a1f38;--sidebar-t:#c9cbe0;--sidebar-t2:#8a8da8;
  --font-sans:'DM Sans',system-ui,-apple-system,sans-serif;--font-data:'Inter Tight',system-ui,sans-serif;
  --font-display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
}
[data-theme="dark"]{
  --bg-body:#0e0f15;--bg-card:#161824;--bg-subtle:#1c1f2c;--border:#2a2d3a;--border-strong:#6a6e86;
  --text-1:#ededf2;--text-2:#9da0b3;--text-3:#888ba0;--accent-t:255 217 102;--success:95 217 138;--danger:251 132 132;--info:125 165 255;
  --sidebar:#0b0c12;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-body);color:var(--text-1);font:14px/1.45 var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flag{width:18px;height:13.5px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgb(0 0 0 / .08);vertical-align:-2px}

/* skitse-baand (braendt ind i billedet) */
.sk{background:#fff8dc;border-bottom:1px solid #e8d48a;color:#3b2f00;padding:10px 20px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
[data-theme="dark"] .sk{background:#2b2408;border-color:#5b4a10;color:#f3e3a6}
.sk b.l{font:400 30px/1 var(--font-display);letter-spacing:.02em}
.sk .n{font-weight:700;font-size:15px}
.sk .s{font-size:13px;opacity:.9;flex:1 1 360px}
.sk .t{font:500 11px var(--font-data);text-transform:uppercase;letter-spacing:.08em;opacity:.75}

/* app-skal */
.shell{display:flex;min-height:100vh}
.side{width:208px;flex:none;background:var(--sidebar);color:var(--sidebar-t);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.side .logo{font:400 24px/1 var(--font-display);letter-spacing:.04em;color:#fff;margin:0 8px 18px}
.side a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius);font-size:13px;color:var(--sidebar-t)}
.side a.on{background:rgb(255 255 255 / .07);color:#fff}
.side a .b{margin-left:auto;font:600 11px var(--font-data);background:rgb(var(--accent));color:var(--on-accent);border-radius:999px;padding:0 6px}
.side .grp{font:500 10px var(--font-data);text-transform:uppercase;letter-spacing:.1em;color:var(--sidebar-t2);margin:14px 8px 4px}
.main{flex:1;min-width:0}
.page{max-width:1600px;margin:0 auto;padding:28px 32px 64px}
.mtop,.mnav{display:none}

/* sidehoved (den ene opskrift) */
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph h1{font:400 34px/1 var(--font-display);letter-spacing:.02em;margin:0}
.ph .sub{color:var(--text-2);font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ph .act{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.dl b{color:var(--text-1);font-weight:600}
.dl .num{color:rgb(var(--danger));font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--radius);font:600 13px var(--font-sans);border:1px solid var(--border);background:var(--bg-card);color:var(--text-1);cursor:pointer;white-space:nowrap}
.btn.gold{background:rgb(var(--accent));border-color:rgb(var(--accent));color:var(--on-accent)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.qa{color:rgb(var(--accent-t));font:500 12px var(--font-sans);display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.qa svg.i{width:13px;height:13px}

/* kort */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.ch h2{font:600 15px/1.2 var(--font-sans);margin:0}
.meta{font:500 11px/1.3 var(--font-data);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.muted{color:var(--text-2)}
.small{font-size:12px}

/* noegletal */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:14px 16px}
.kpi .v{font:700 22px/1.1 var(--font-data);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12px;color:var(--text-2);margin-top:2px}
.up{color:rgb(var(--success))}.down{color:rgb(var(--danger))}
.kpis.rail{grid-template-columns:1fr 1fr}

/* tabeller */
table{width:100%;border-collapse:collapse}
th{font:500 11px var(--font-data);text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);text-align:left;padding:0 8px 8px;white-space:nowrap}
td{padding:9px 8px;border-top:1px solid var(--border);vertical-align:middle}
th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{padding-right:0}
td.r,th.r{text-align:right}
tr.me td{background:rgb(var(--accent) / .10)}
.race{display:flex;align-items:center;gap:8px;min-width:0}
.race .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race .st{color:var(--text-3);font-size:12px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--font-data);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.pill.live{border-color:rgb(var(--danger) / .4);color:rgb(var(--danger))}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:rgb(var(--danger))}
.pill.done{color:rgb(var(--success));border-color:rgb(var(--success) / .35)}
.hid{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:12px}
.hid a{color:rgb(var(--accent-t));font-weight:500}
.rider{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

/* liste/feed */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0;padding-top:2px}
.ico{width:30px;height:30px;border-radius:var(--radius);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);flex:none;background:var(--bg-body)}
.ico.warn{color:rgb(var(--danger));border-color:rgb(var(--danger) / .3)}
.ico.good{color:rgb(var(--success));border-color:rgb(var(--success) / .3)}
.ico.gold{color:rgb(var(--accent-t));border-color:rgb(var(--accent) / .5)}
.li .tx{flex:1;min-width:0}
.li .tx b{font-weight:600}
.li .tx .s2{font-size:12px;color:var(--text-2);margin-top:1px}
.li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.when{font:500 11px var(--font-data);color:var(--text-3);white-space:nowrap}
.grp-h{font:500 11px var(--font-data);text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);padding:14px 0 4px;border-top:1px solid var(--border)}
.grp-h:first-child{border-top:0;padding-top:0}
.sum{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid rgb(var(--accent) / .45);background:rgb(var(--accent) / .08);border-radius:var(--radius);margin-bottom:12px;font-size:13px}
.sum b{font-weight:600}

/* notat-pile paa billedet */
.note{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#d6336c;color:#fff;font:700 11px var(--font-data);margin-left:6px;vertical-align:1px;flex:none}
.hide-notes .note{display:none}

/* grids pr. variant */
.gA{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:14px}
.gB{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;margin-top:14px}
.gC{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}

/* foer (nu-tilstand): approksimation af dagens side */
.now-wrap{max-width:1024px;margin:0 auto}
.banner{border:1px solid rgb(var(--accent) / .55);background:rgb(var(--accent) / .10);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}

/* mobil */
@media (max-width:640px){
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;background:var(--sidebar);color:#fff}
  .mtop .logo{font:400 22px/1 var(--font-display);letter-spacing:.04em}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:static;height:60px;background:var(--bg-card);border-top:1px solid var(--border);z-index:5}
  .mnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--text-2)}
  .mnav a.on{color:var(--text-1);font-weight:600}
  .page{padding:16px 16px 24px}
  .main{display:flex;flex-direction:column;min-height:100vh}.page{flex:1;width:100%}
  .race{flex-wrap:wrap;gap:2px 8px}.race .nm{white-space:normal;flex:1 1 0;min-width:0}.race .st{flex-basis:100%;padding-left:26px}
  td,th{padding-left:6px;padding-right:6px}
  .ph{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:16px}
  .ph h1{font-size:30px}
  .ph .act{width:100%;justify-content:space-between}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px}
  .kpi .v{font-size:19px}
  .gA,.gB,.gC{grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
  .gC{margin-top:0}
  .hide-m{display:none}
  .sk b.l{font-size:26px}
  .now-wrap .banner{flex-direction:column;align-items:flex-start}
}
@media (min-width:641px){.only-m{display:none}}
</style>
</head>

function stagesTable(wide){
  const rows=STAGES.map(s=>{
    let status=s.status==='done'?'<span class="pill done">Finished</span>':s.status==='live'?'<span class="pill live">Live</span>':'<span class="pill">Today</span>';
    let win,mine;
    if(s.status!=='done'){win=`<span class="muted small">${s.time}</span>`;mine=s.lineup?'<a class="qa" href="#">Pick riders'+ic('chev')+'</a>':'<span class="muted small">2 riders</span>';}
    else if(SHIELD){win=`<span class="hid">${ic('eyeoff')} Hidden · <a href="#">Show result</a></span>`;mine='<span class="hid">Hidden</span>';}
    else{win=`<span class="rider">${fl(s.winner[1])} ${s.winner[0]}</span>`;mine=`<span class="rider">${fl(s.mine[1])} ${s.mine[0]} <b class="num">${s.mine[2]}.</b></span>`;}
    return `<tr><td><div class="race">${fl(s.c)}<span class="nm">${s.race}</span><span class="st">${s.st}</span></div></td><td>${status}</td>${wide?`<td class="hide-m">${win}</td>`:''}<td class="r">${mine}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>Race</th><th>Status</th>${wide?'<th class="hide-m">Winner</th>':''}<th class="r">Your best</th></tr></thead><tbody>${rows}</tbody></table>`;
}

 `<div class="hid" style="font-size:13px;padding:6px 0">${ic('eyeoff')} Ronde van het Noorden, stage 3 is finished. Result hidden by your spoiler shield.</div><div style="margin-top:10px"><a class="btn sm" href="#">Show result</a></div>`:
 `<div class="list">${[['S. Holm','dk',4,'+12'],['A. Moreau','fr',11,'+3'],['L. Bakker','nl',23,'0']].map(r=>`<div class="li" style="align-items:center"><span class="num" style="width:26px;font-weight:700">${r[2]}.</span><div class="tx"><span class="rider">${fl(r[1])} ${r[0]}</span></div><span class="num ${r[3]!=='0'?'up':'muted'}">${r[3]} pts</span></div>`).join('')}</div>`}</div>`;

const feedItem=f=>`<div class="li"><div class="ico ${f.k}">${ic(f.i)}</div><div class="tx"><div>${f.t}</div><div class="s2">${f.s}</div></div><div class="rt"><span class="when">${f.w}</span><a class="qa" href="#">${f.a}${ic('chev')}</a></div></div>`;
const actItem=(a,i)=>`<div class="li"><div class="ico ${i===0?'warn':''}">${ic(a.i)}</div><div class="tx"><div>${a.t}</div><div class="s2">${a.s}</div></div><div class="rt"><a class="btn sm" href="#">${a.a}</a></div></div>`;
const actionsCard=(note='')=>`<div class="card"><div class="ch"><h2>Your next moves${note}</h2><span class="meta">${ACTIONS.length} open</span></div><div class="list">${ACTIONS.map(actItem).join('')}</div></div>`;
const marketCard=()=>`<div class="card"><div class="ch"><h2>Market</h2><a class="qa" href="#">Auctions${ic('chev')}</a></div><div class="list">
 <div class="li" style="align-items:center"><div class="tx"><span class="rider">${fl('no')} M. Lindqvist</span><div class="s2">Outbid · ends <span class="num">2 h 10 m</span></div></div><span class="num down">1.45M</span></div>
 <div class="li" style="align-items:center"><div class="tx"><span class="rider">${fl('si')} J. Kranjc</span><div class="s2">Leading · ends <span class="num">5 h</span></div></div><span class="num up">0.82M</span></div>
 <div class="li" style="align-items:center"><div class="tx"><span class="rider">${fl('gb')} O. Hart</span><div class="s2">Your sale · <span class="num">3</span> bids</div></div><span class="num">0.64M</span></div></div></div>`;

/* sidehoved: fristen + den ENE guld-knap i handlingsraekken (regel 3, ingen banner) */
function header(note=''){
  const sub=`Division 2 · Season 2 · Race day <span class="num">14</span> of <span class="num">40</span>`;
  return `<div class="ph"><div><h1>${TEAM}</h1><div class="sub">${fl('dk')} ${sub}</div></div>
  <div class="act"><span class="dl">${ic('clock')} Season 3 sign-up closes in <span class="num">2 d 4 h</span></span><a class="btn gold" href="#">Keep your spot${note}</a></div></div>`;
}
function returnSummary(){
  return RET?`<div class="sum">${ic('home')}<span><b>Welcome back.</b> Since your last visit 9 days ago: <b class="num">6</b> stages finished, you moved up <b class="num">2</b> places, <b class="num">2</b> contracts expire this season.</span></div>`:'';
}

/* ---------- varianter ---------- */
const LBL={
 now:['FØR','Dagens dashboard (gengivet)','Smal kolonne på 1024 px, påmindelsen som boks over indholdet, kort i lang række under hinanden.'],
 a:['A','Kommandocentralen','Tre kolonner i fuld bredde: dine næste træk, dagens løb og holdets status står side om side over folden.'],
 b:['B','Løbsdagen først','Dagens etaper som bred tabel øverst, derefter hvad der kræver dig og holdets tal.'],
 c:['C','Siden sidst','Én prioriteret strøm af det der er sket og det du skal gøre, med holdets tal i en smal højre kolonne.']
};
function band(){
  const [l,n,s]=LBL[V];
  return `<div class="sk"><b class="l">${l}</b><span class="n">${n}</span><span class="s">${s}</span><span class="t">#8300 · eksempeldata · skjold ${SHIELD?'til':'fra'}${RET?' · tilbagevendende spiller':''}</span></div>`;
}
function body(){
  if(V==='now'){
    return `<div class="now-wrap">
    <div class="ph"><div><h1>${TEAM}</h1><div class="sub">${fl('dk')} Division 2 · Season 2</div></div><div class="act"><a class="btn" href="#">Customize</a></div></div>
    <div class="banner"><div><b>Keep your spot for season 3</b><div class="small muted">Sign-up closes in 2 d 4 h. Teams that don't sign up are parked.</div></div><a class="btn gold" href="#">Sign up</a></div>
    ${kpis()}<div class="stack" style="margin-top:14px">${stagesCard(true)}${latestCard()}${actionsCard()}${marketCard()}${divCard()}</div></div>`;
  }
  if(V==='a'){
    return `${header(N(1))}${returnSummary()}${kpis()}
    <div class="gA"><div class="stack">${actionsCard(N(2))}</div><div class="stack">${stagesCard(false,N(3))}${latestCard(N(4))}</div><div class="stack">${divCard(N(5))}${marketCard()}</div></div>`;
  }
  if(V==='b'){
    return `${header(N(1))}${returnSummary()}${stagesCard(true,N(2))}
    <div class="gB"><div class="stack"><div class="card"><div class="ch"><h2>Needs you${N(3)}</h2><span class="meta">${ACTIONS.length} open</span></div><div class="list">${ACTIONS.map(actItem).join('')}</div></div>${latestCard()}</div>
    <div class="stack">${kpis('rail')}${divCard(N(4))}</div></div>`;
  }
  // C
  return `${header(N(1))}
  <div class="gC"><div class="stack"><div class="card"><div class="ch"><h2>Since your last visit${N(2)}</h2><a class="qa" href="#">All messages${ic('chev')}</a></div>
    ${returnSummary()}
    <div class="list"><div class="grp-h">Do now</div>${ACTIONS.slice(0,1).map(actItem).join('')}<div class="grp-h">Today</div>${FEED_TODAY.map(feedItem).join('')}<div class="grp-h">Earlier</div>${FEED_EARLIER.map(feedItem).join('')}</div></div>
    ${stagesCard(true,N(3))}</div>
  <div class="stack">${kpis('rail')}${divCard(N(4))}${marketCard()}</div></div>`;
}
function shell(inner){
  const nav=[['home','Dashboard',1],['bell','Messages',0,5],['users','My team'],['cal','Planning'],['dumbbell','Training'],['gavel','Auctions'],['swap','Transfers'],['list','Standings'],['brief','Board'],['msg','Forum']];
  return `<div class="shell"><nav class="side"><div class="logo">Cycling Zone</div>${nav.map(n=>`<a class="${n[2]?'on':''}" href="#">${ic(n[0])}${n[1]}${n[3]?`<span class="b num">${n[3]}</span>`:''}</a>`).join('')}</nav>
  <div class="main"><div class="mtop"><span class="logo">Cycling Zone</span>${ic('menu')}</div><div class="page">${inner}</div>
  <nav class="mnav">${[['home','Home',1],['bell','Messages'],['users','Team'],['cal','Planning'],['menu','More']].map(n=>`<a class="${n[2]?'on':''}" href="#">${ic(n[0])}${n[1]}</a>`).join('')}</nav></div></div>`;
}
document.getElementById('app').innerHTML=band()+shell(body());
</script>
</body>
</html>
