  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ef41c650-ab40-4b2f-a6ef-df9551ee4887\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\"><meta name=\"design_doc_mode\" content=\"canvas\">\n<style>/* ──────────────────────────────────────────────────────────────────────────\n   Cycling Zone · Color tokens\n   Locked palette (BRAND_BRIEF §5 + Phase-4 token migration):\n     Navy #0e0f15 · Gold #e8c547 · Chalk #f4f2ec\n   Light (\"Chalk\") is the default; [data-theme=\"dark\"] flips to the navy canvas.\n   Accent colors are stored as space-separated RGB channels so consumers can do\n   rgb(var(--accent) / <alpha>) — matching the production Tailwind setup.\n   ────────────────────────────────────────────────────────────────────────── */\n\n:root {\n  color-scheme: light;\n\n  /* ── Brand constants (theme-independent reference values) ── */\n  --brand-navy:        #0e0f15;  /* P1 locked dark canvas / foreground */\n  --brand-navy-2:      #1a1f38;  /* sidebar / on-accent text */\n  --brand-gold:        #e8c547;  /* primary accent — \"yellow jersey = winner\" */\n  --brand-gold-bright: #ffd966;  /* dark-mode accent variant / twin-lines */\n  --brand-gold-deep:   #a07800;  /* WCAG-safe gold foreground on light canvas */\n  --brand-chalk:       #f4f2ec;  /* P2 locked light canvas */\n  --brand-white:       #ffffff;\n  --brand-black:       #0a0a0f;  /* near-black w/ a hint of navy */\n\n  /* ── Surfaces — Chalk ladder: canvas → card → elevated ── */\n  --bg-body:     #f4f2ec;   /* Chalk canvas */\n  --bg-card:     #fcfbf7;   /* card */\n  --bg-elevated: #ffffff;   /* modals / popovers / raised */\n  --bg-subtle:   #ece9e1;   /* recessed inset / hover (tracks, nested panels) */\n  --border:      #e5e0d5;\n\n  /* ── Text ── */\n  --text-1: #0e0f15;   /* primary (navy) */\n  --text-2: #66637a;   /* secondary */\n  --text-3: #9896b0;   /* tertiary / muted */\n\n  /* ── Accent (RGB channels for alpha support) ── */\n  --accent:    232 197 71;   /* @kind color */  /* #e8c547 brand gold */\n  --accent-t:  160 120 0;    /* @kind color */  /* #a07800 deep-gold foreground */\n  --on-accent: #1a1f38;      /* navy text on a gold fill */\n\n  /* ── \"You\" marker — neutral navy, never gold (gold = the leader) ── */\n  --me-ring:     26 31 56;     /* @kind color */\n  --me-badge-bg: 26 31 56;     /* @kind color */\n  --me-badge-fg: 244 242 236;  /* @kind color */\n\n  /* ── Sidebar — always dark navy (option A), identical in both themes ── */\n  --bg-sidebar:       #1a1f38;\n  --bg-sidebar-hover: rgba(255, 255, 255, 0.06);\n  --border-sidebar:   rgba(255, 255, 255, 0.07);\n  --text-sidebar-1:   #ffffff;\n  --text-sidebar-2:   rgba(255, 255, 255, 0.55);\n  --text-sidebar-3:   rgba(255, 255, 255, 0.25);\n\n  /* ── Semantic states (D-SEM Set 2 — warning shifted off brand gold) ── */\n  --success:    21 119 47;    /* @kind color */  /* #15772f */\n  --success-bg: #dcfce7;\n  --danger:     168 30 30;     /* @kind color */  /* #a81e1e */\n  --danger-bg:  #fee2e2;\n  --warning:    154 91 0;      /* @kind color */  /* #9a5b00 */\n  --warning-bg: #fef3c7;\n  --info:       26 71 192;     /* @kind color */  /* #1a47c0 */\n  --info-bg:    #dbeafe;\n\n  /* ── Division accents (standings) ── */\n  --div-1: #e8c547;  /* gold */\n  --div-2: #60a5fa;  /* blue */\n  --div-3: #a78bfa;  /* violet */\n\n  /* ── External brand — Discord Blurple (CTA only) ── */\n  --discord:       88 101 242;   /* @kind color */  /* #5865F2 */\n  --discord-hover: 71 82 196;    /* @kind color */  /* #4752c4 */\n\n  /* ── Categorical chart palette (RGB triplets, theme-agnostic) ── */\n  --cz-chart-1:  96 165 250;  /* @kind color */\n  --cz-chart-2: 167 139 250;  /* @kind color */\n  --cz-chart-3:  52 211 153;  /* @kind color */\n  --cz-chart-4: 251 191  36;  /* @kind color */\n  --cz-chart-5: 248 113 113;  /* @kind color */\n  --cz-chart-6:  34 211 238;  /* @kind color */\n  --cz-chart-7: 244 114 182;  /* @kind color */\n  --cz-chart-8: 250 204  21;  /* @kind color */\n  --cz-chart-9: 148 163 184;  /* @kind color */\n}\n\n[data-theme=\"dark\"] {\n  color-scheme: dark;\n\n  --bg-body:     #0e0f15;   /* locked navy canvas (P1) */\n  --bg-card:     #161824;   /* card */\n  --bg-elevated: #1f2233;   /* elevated */\n  --bg-subtle:   #14161e;   /* recessed inset / hover */\n  --border:      #2a2d3a;\n\n  --text-1: #ededf2;\n  --text-2: #9da0b3;\n  --text-3: #888ba0;   /* AA-fixed muted */\n\n  --accent:    232 197 71;    /* @kind color */\n  --accent-t:  255 217 102;   /* @kind color */  /* bright gold on navy */\n  --on-accent: #1a1f38;\n\n  --me-ring:     237 237 242;  /* @kind color */\n  --me-badge-bg: 237 237 242;  /* @kind color */\n  --me-badge-fg: 14 15 21;     /* @kind color */\n\n  /* Sidebar identical in both themes (option A) */\n\n  --success:    95 217 138;   /* @kind color */  /* #5fd98a */\n  --success-bg: rgba(95, 217, 138, 0.12);\n  --danger:     251 132 132;  /* @kind color */  /* #fb8484 */\n  --danger-bg:  rgba(251, 132, 132, 0.12);\n  --warning:    240 168 48;   /* @kind color */  /* #f0a830 */\n  --warning-bg: rgba(240, 168, 48, 0.12);\n  --info:       122 176 251;  /* @kind color */  /* #7ab0fb */\n  --info-bg:    rgba(122, 176, 251, 0.12);\n}\n<\u002Fstyle>\n<style>/* ──────────────────────────────────────────────────────────────────────────\n   Cycling Zone · Typography tokens + self-hosted brand fonts\n   Three-role hybrid (locked #481 Phase 4):\n     • Bebas Neue   — display wordmark / headlines (super-condensed)\n     • Inter Tight  — data / UI workhorse (font-mono → data), tabular numerics\n     • DM Sans      — body / prose\n   ────────────────────────────────────────────────────────────────────────── */\n\n/* Bebas Neue — display. */\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6f339da1-f32f-4e70-936a-2dea99459c4a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"08ab34f5-05ea-46f1-9415-5070e6b4267b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n\n/* Inter Tight (variable wght 100–900) — data / UI font. */\n@font-face {\n  font-family: 'Inter Tight';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"a70865dd-b1d0-4e41-afe9-e20ce5d2c412\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n@font-face {\n  font-family: 'Inter Tight';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"d76f7d7e-02e4-4555-8337-50ed7fc022b8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n\n/* DM Sans — body / prose (loaded from Google Fonts in the live app; bring your\n   own <link> in standalone pages, or it falls back to the system stack below). */\n\n:root {\n  /* Families — each carries its real production fallback stack. */\n  --font-display: 'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif;\n  --font-data:    'Inter Tight', 'Inter Tight Fallback', system-ui, sans-serif;\n  --font-body:    'DM Sans', system-ui, -apple-system, sans-serif;\n\n  /* Type scale — app data UI runs tight (12–20px); display headlines scale big.\n     Body/prose uses --font-body; data/labels use --font-data; headlines display. */\n  --text-2xs: 10px;   /* category tags, sidebar eyebrows */\n  --text-xs:  12px;   /* labels, table meta, captions */\n  --text-sm:  14px;   /* body default in the app */\n  --text-md:  15px;   /* large body / marketing lede */\n  --text-lg:  18px;   /* card headings */\n  --text-xl:  20px;   /* page titles (app) */\n  --text-2xl: 24px;   /* section display */\n  --text-3xl: 30px;   /* KPI numerals */\n  --text-4xl: 36px;\n  --text-5xl: 48px;\n  --text-6xl: 60px;\n  --text-7xl: 72px;   /* marketing hero (Bebas) */\n\n  /* Weights — Inter Tight is variable; DM Sans 400/500/600/700. */\n  --weight-regular:  400;  /* @kind font */\n  --weight-medium:   500;  /* @kind font */\n  --weight-semibold: 600;  /* @kind font */\n  --weight-bold:     700;  /* @kind font */\n  --weight-black:    900;  /* @kind font */\n\n  /* Letter-spacing — the brand leans on uppercase eyebrows w/ wide tracking. */\n  --tracking-tight:  -0.02em;  /* @kind font */\n  --tracking-normal: 0;        /* @kind font */\n  --tracking-wide:   0.08em;   /* @kind font */\n  --tracking-eyebrow: 0.16em;  /* @kind font */\n  --tracking-kicker:  0.22em;  /* @kind font */\n\n  /* Line-heights */\n  --leading-display: 0.92;   /* @kind font */\n  --leading-snug:    1.2;    /* @kind font */\n  --leading-normal:  1.5;    /* @kind font */\n  --leading-relaxed: 1.65;   /* @kind font */\n}\n<\u002Fstyle>\n<style>/* ──────────────────────────────────────────────────────────────────────────\n   Cycling Zone · Spacing, radii, shadow, motion & z-index tokens\n   Restraint is the brand (BRAND_BRIEF §3): small radii, hairline borders, a\n   single overlay shadow. No glow, no decorative gradients.\n   ────────────────────────────────────────────────────────────────────────── */\n\n:root {\n  /* ── Spacing scale (4px base) ── */\n  --space-0:  0px;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n\n  /* ── Radii — deliberately tight (fundament #671) ── */\n  --radius-none: 0px;\n  --radius-sm:   5px;    /* the workhorse: buttons, inputs, cards, chips */\n  --radius-md:   8px;    /* nav items, larger cards */\n  --radius-lg:   12px;   /* app data tables / panels */\n  --radius-pill: 9999px; /* badges, marketing chips */\n\n  /* ── Borders ── */\n  --border-width: 1px;     /* hairline is the default */\n  --border-width-accent: 2px; /* the gold top-rule on section headers */\n\n  /* ── Motion — short, precise, eased. No bounce. ── */\n  --dur-fast: 120ms;  /* @kind other */\n  --dur:      150ms;  /* @kind other */\n  --dur-slow: 240ms;  /* @kind other */\n  --ease: cubic-bezier(.2, .7, .2, 1);  /* @kind other */\n\n  /* ── Shadow — one overlay shadow only (modals / popovers). ── */\n  --shadow-overlay: 0 12px 28px -10px rgba(14, 15, 21, .18);\n\n  /* ── Z-index ladder ── */\n  --z-base: 0;          /* @kind other */\n  --z-dropdown: 1000;   /* @kind other */\n  --z-sticky: 1100;     /* @kind other */\n  --z-overlay: 1200;    /* @kind other */\n  --z-modal: 1300;      /* @kind other */\n  --z-toast: 1400;      /* @kind other */\n\n  /* ── Layout ── */\n  --sidebar-width: 208px;   /* w-52 */\n  --content-max: 1152px;    /* max-w-6xl readable column */\n  --content-max-wide: 1600px;\n}\n\n[data-theme=\"dark\"] {\n  /* Deeper overlay shadow on the navy canvas */\n  --shadow-overlay: 0 12px 30px -8px rgba(0, 0, 0, .6);\n}\n<\u002Fstyle>\n<style>/* ──────────────────────────────────────────────────────────────────────────\n   Cycling Zone · Global base\n   Body defaults, keyboard focus ring, and the brand motion keyframes\n   (skeleton shimmer, overlay reveals, price pulse). All respect\n   prefers-reduced-motion (a hard requirement in the source system).\n   ────────────────────────────────────────────────────────────────────────── */\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--bg-body);\n  color: var(--text-1);\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Metric-matched fallback for the data font (keeps the webfont swap CLS-free). */\n@font-face {\n  font-family: 'Inter Tight Fallback';\n  src: local('Arial');\n  ascent-override: 87.37%;\n  descent-override: 21.76%;\n  line-gap-override: 0.00%;\n  size-adjust: 110.88%;\n}\n\n/* Data / numeric font helper — tabular figures keep number columns aligned. */\n.font-data,\n.font-mono {\n  font-family: var(--font-data);\n  font-variant-numeric: tabular-nums;\n}\n\n/* Keyboard-only focus ring (:focus-visible). Outline (not box-shadow) survives\n   high-contrast mode; accent-t is theme-aware (deep-gold light / bright dark). */\n:where(a, button, input, select, textarea, [tabindex=\"0\"], [role=\"button\"]):focus-visible {\n  outline: 2px solid rgb(var(--accent-t));\n  outline-offset: 1px;\n  border-radius: var(--radius-sm);\n}\n\n/* ── Price pulse-flash (gold) — live auction current-price change ── */\n@keyframes cz-pulse-flash {\n  0%   { background-color: rgb(var(--accent) / 0); }\n  20%  { background-color: rgb(var(--accent) / 0.45); }\n  100% { background-color: rgb(var(--accent) / 0); }\n}\n.cz-pulse-flash { animation: cz-pulse-flash 1.5s ease-out; border-radius: 4px; }\n\n/* ── Skeleton shimmer — discrete accent-t sweep, no glow ── */\n@keyframes cz-shimmer { 100% { transform: translateX(100%); } }\n@keyframes cz-spin { to { transform: rotate(360deg); } }\n\n/* ── Overlay reveals — discrete fade / pop / slide, no glow ── */\n@keyframes cz-overlay-fade { from { opacity: 0; } to { opacity: 1; } }\n@keyframes cz-overlay-pop  { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }\n@keyframes cz-toast-in     { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.001ms !important;\n  }\n}\n<\u002Fstyle>\n<style>/* ══════════════════════════════════════════════════════════════════════════\n   Cycling Zone · Component styles\n   Ported from the production Tailwind primitives (frontend/src/components/ui).\n   All values reference the design tokens — no hard-coded brand hex here.\n   The JSX components apply these classes; this file ships in the styles.css\n   closure so consumers get the components fully styled.\n   ══════════════════════════════════════════════════════════════════════════ */\n\n/* ───────────────────────── Button ───────────────────────── */\n.cz-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  font-family: var(--font-body);\n  font-weight: var(--weight-semibold);\n  border-radius: var(--radius-sm);\n  border: 1px solid transparent;\n  cursor: pointer;\n  white-space: nowrap;\n  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease),\n    border-color var(--dur) var(--ease), filter var(--dur) var(--ease), transform var(--dur-fast) var(--ease);\n}\n.cz-btn:disabled { opacity: .4; pointer-events: none; }\n.cz-btn--sm { padding: 6px 12px;  font-size: var(--text-xs); }\n.cz-btn--md { padding: 10px 16px; font-size: var(--text-sm); }\n.cz-btn--lg { padding: 12px 20px; font-size: var(--text-md); }\n.cz-btn--full { width: 100%; }\n\n.cz-btn--primary { background: rgb(var(--accent)); color: var(--on-accent); border-color: transparent; }\n.cz-btn--primary:hover:not(:disabled) { filter: brightness(1.05); }\n.cz-btn--primary:active:not(:disabled) { transform: translateY(1px); }\n\n.cz-btn--secondary { background: transparent; color: var(--text-1); border-color: var(--border); }\n.cz-btn--secondary:hover:not(:disabled) { border-color: var(--text-3); }\n\n.cz-btn--ghost { background: transparent; color: var(--text-2); border-color: transparent; }\n.cz-btn--ghost:hover:not(:disabled) { background: var(--bg-subtle); color: var(--text-1); }\n\n.cz-btn--danger { background: transparent; color: rgb(var(--danger)); border-color: rgb(var(--danger) / .5); }\n.cz-btn--danger:hover:not(:disabled) { background: rgb(var(--danger) / .1); }\n\n.cz-btn--discord { background: rgb(var(--discord)); color: #fff; border-color: transparent; }\n.cz-btn--discord:hover:not(:disabled) { background: rgb(var(--discord-hover)); }\n\n.cz-btn__spinner {\n  width: 14px; height: 14px; border-radius: var(--radius-pill);\n  border: 2px solid currentColor; border-top-color: transparent;\n  animation: cz-spin .6s linear infinite;\n}\n\n/* ───────────────────────── Card ───────────────────────── */\n.cz-card {\n  border-radius: var(--radius-sm);\n  border: 1px solid var(--border);\n  background: var(--bg-card);\n}\n.cz-card--interactive { transition: border-color var(--dur) var(--ease); cursor: pointer; }\n.cz-card--interactive:hover { border-color: var(--text-3); }\n\n/* ───────────────────────── Status badge (broadcast) ───────────────────────── */\n.cz-status {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-family: var(--font-data); font-size: 11px; font-weight: var(--weight-semibold);\n  text-transform: uppercase; letter-spacing: var(--tracking-wide); font-variant-numeric: tabular-nums;\n}\n.cz-status--info    { color: rgb(var(--info)); }\n.cz-status--success { color: rgb(var(--success)); }\n.cz-status--danger  { color: rgb(var(--danger)); }\n.cz-status--warning { color: rgb(var(--warning)); }\n.cz-status--emphasis { border-radius: var(--radius-sm); padding: 2px 8px; }\n.cz-status--info.cz-status--emphasis    { background: rgb(var(--info) / .1); }\n.cz-status--success.cz-status--emphasis { background: rgb(var(--success) / .1); }\n.cz-status--danger.cz-status--emphasis  { background: rgb(var(--danger) / .1); }\n.cz-status--warning.cz-status--emphasis { background: rgb(var(--warning) / .1); }\n.cz-status__dot { width: 6px; height: 6px; border-radius: var(--radius-pill); background: currentColor; }\n.cz-status__dot--pulse { animation: cz-pulse-dot 1.4s ease-in-out infinite; }\n@keyframes cz-pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }\n\n/* ───────────────────────── Category tag ───────────────────────── */\n.cz-tag {\n  display: inline-flex; align-items: center;\n  font-family: var(--font-data); font-size: 10px; font-weight: var(--weight-semibold);\n  text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-2);\n  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-subtle);\n  padding: 2px 8px;\n}\n.cz-tag--dense {\n  border: 0; background: transparent; border-radius: 0;\n  padding: 0 0 0 8px; letter-spacing: .1em;\n  border-left: 2px solid rgb(var(--accent));\n}\n\n/* ───────────────────────── Chip (marketing pill) ───────────────────────── */\n.cz-chip {\n  display: inline-flex; align-items: center; gap: var(--space-2);\n  border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--bg-subtle);\n  padding: 6px 14px; font-family: var(--font-data); font-size: var(--text-xs);\n  font-weight: var(--weight-semibold); text-transform: uppercase;\n  letter-spacing: var(--tracking-wide); color: var(--text-2);\n}\n\n/* ───────────────────────── Form controls ───────────────────────── */\n.cz-label {\n  display: block; margin-bottom: 6px;\n  font-family: var(--font-data); font-size: 11px; font-weight: var(--weight-semibold);\n  text-transform: uppercase; letter-spacing: var(--tracking-eyebrow); color: var(--text-2);\n}\n.cz-control {\n  width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border);\n  background: var(--bg-card); color: var(--text-1); font-family: var(--font-body);\n  transition: border-color var(--dur) var(--ease);\n}\n.cz-control::placeholder { color: var(--text-3); }\n.cz-control:focus { outline: none; border-color: var(--text-3); }\n.cz-control:disabled { opacity: .5; cursor: not-allowed; }\n.cz-control--sm { padding: 6px 10px;  font-size: var(--text-xs); }\n.cz-control--md { padding: 8px 12px;  font-size: var(--text-sm); }\n.cz-control--lg { padding: 10px 14px; font-size: var(--text-md); }\n.cz-control--error { border-color: rgb(var(--danger)); }\n.cz-control--error:focus { border-color: rgb(var(--danger)); }\n.cz-helper { margin-top: 6px; font-size: var(--text-xs); color: var(--text-3); }\n.cz-helper--error { color: rgb(var(--danger)); }\n.cz-select { appearance: none; background-image:\n  url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239896b0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/><\u002Fsvg>\");\n  background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 34px;\n}\n\n/* Checkbox / Radio / Toggle */\n.cz-choice { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--text-1); cursor: pointer; user-select: none; }\n.cz-choice input { position: absolute; opacity: 0; width: 0; height: 0; }\n.cz-choice__box {\n  width: 18px; height: 18px; flex: none; border: 1px solid var(--border); background: var(--bg-card);\n  border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;\n  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); color: var(--on-accent);\n}\n.cz-choice__box--radio { border-radius: var(--radius-pill); }\n.cz-choice input:checked + .cz-choice__box { background: rgb(var(--accent)); border-color: rgb(var(--accent)); }\n.cz-choice input:focus-visible + .cz-choice__box { outline: 2px solid rgb(var(--accent-t)); outline-offset: 1px; }\n.cz-choice__check { opacity: 0; }\n.cz-choice input:checked + .cz-choice__box .cz-choice__check { opacity: 1; }\n.cz-choice__radiodot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--on-accent); transform: scale(0); transition: transform var(--dur) var(--ease); }\n.cz-choice input:checked + .cz-choice__box--radio .cz-choice__radiodot { transform: scale(1); }\n\n.cz-toggle__track {\n  width: 38px; height: 22px; flex: none; border-radius: var(--radius-pill);\n  background: var(--bg-subtle); border: 1px solid var(--border); position: relative;\n  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);\n}\n.cz-toggle__knob {\n  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: var(--radius-pill);\n  background: var(--bg-elevated); box-shadow: 0 1px 2px rgba(0,0,0,.2);\n  transition: transform var(--dur) var(--ease);\n}\n.cz-choice input:checked + .cz-toggle__track { background: rgb(var(--accent)); border-color: rgb(var(--accent)); }\n.cz-choice input:checked + .cz-toggle__track .cz-toggle__knob { transform: translateX(16px); }\n\n/* ───────────────────────── Table ───────────────────────── */\n.cz-table-wrap { border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--bg-card); overflow: hidden; }\n.cz-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }\n.cz-table th {\n  text-align: left; padding: 12px 16px; color: var(--text-3);\n  font-family: var(--font-data); font-size: 11px; font-weight: var(--weight-semibold);\n  text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); white-space: nowrap;\n}\n.cz-table th.cz-num, .cz-table td.cz-num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-data); }\n.cz-table td { padding: 13px 16px; color: var(--text-2); border-bottom: 1px solid var(--border); }\n.cz-table tbody tr:last-child td { border-bottom: 0; }\n.cz-table tbody tr { transition: background var(--dur) var(--ease); }\n.cz-table tbody tr.cz-row--hover:hover { background: var(--bg-subtle); cursor: pointer; }\n.cz-table td.cz-strong, .cz-table th.cz-strong { color: var(--text-1); font-weight: var(--weight-medium); }\n.cz-jersey-dot { display: inline-block; width: 9px; height: 9px; border-radius: var(--radius-pill); flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }\n\n/* ───────────────────────── Tabs ───────────────────────── */\n.cz-tablist { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }\n.cz-tab {\n  appearance: none; background: none; border: 0; cursor: pointer;\n  padding: 10px 14px; font-family: var(--font-body); font-size: var(--text-sm); font-weight: var(--weight-medium);\n  color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px;\n  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);\n}\n.cz-tab:hover { color: var(--text-1); }\n.cz-tab--active { color: var(--text-1); border-bottom-color: rgb(var(--accent)); }\n\n/* Pill tabs (division switcher style) */\n.cz-pilltab {\n  appearance: none; cursor: pointer; padding: 8px 16px; border-radius: var(--radius-md);\n  font-size: var(--text-sm); font-weight: var(--weight-medium); border: 1px solid var(--border);\n  background: var(--bg-card); color: var(--text-2);\n  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);\n}\n.cz-pilltab:hover { color: var(--text-1); }\n.cz-pilltab--active { color: var(--text-1); }\n\n/* ───────────────────────── Progress meter ───────────────────────── */\n.cz-progress__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }\n.cz-progress__label { font-family: var(--font-data); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }\n.cz-progress__val { font-family: var(--font-data); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-2); font-variant-numeric: tabular-nums; }\n.cz-progress__track { height: 6px; border-radius: var(--radius-pill); background: var(--bg-subtle); overflow: hidden; }\n.cz-progress__fill { height: 100%; border-radius: var(--radius-pill); background: rgb(var(--accent)); transition: width var(--dur-slow) var(--ease); }\n.cz-progress__fill--danger  { background: rgb(var(--danger)); }\n.cz-progress__fill--success { background: rgb(var(--success)); }\n\n/* ───────────────────────── Avatar ───────────────────────── */\n.cz-avatar {\n  display: inline-flex; align-items: center; justify-content: center; flex: none;\n  border-radius: var(--radius-pill); background: var(--bg-subtle); color: var(--text-2);\n  font-family: var(--font-data); font-weight: var(--weight-semibold); text-transform: uppercase;\n  border: 1px solid var(--border); overflow: hidden;\n}\n.cz-avatar img { width: 100%; height: 100%; object-fit: cover; }\n.cz-avatar--sm { width: 28px; height: 28px; font-size: 11px; }\n.cz-avatar--md { width: 36px; height: 36px; font-size: 13px; }\n.cz-avatar--lg { width: 48px; height: 48px; font-size: 16px; }\n\n/* ───────────────────────── Spinner / Skeleton / Divider ───────────────────────── */\n.cz-spinner { width: 20px; height: 20px; border-radius: var(--radius-pill); border: 2px solid var(--border); border-top-color: rgb(var(--accent-t)); animation: cz-spin .7s linear infinite; }\n.cz-skeleton { position: relative; overflow: hidden; background: var(--bg-subtle); border-radius: 4px; }\n.cz-skeleton::after { content: \"\"; position: absolute; inset: 0; transform: translateX(-100%);\n  background: linear-gradient(90deg, transparent, rgb(var(--accent-t) / .08), transparent); animation: cz-shimmer 1.4s ease-in-out infinite; }\n.cz-divider { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: var(--text-xs); }\n.cz-divider::before, .cz-divider::after { content: \"\"; flex: 1; height: 1px; background: var(--border); }\n.cz-divider--plain { height: 1px; background: var(--border); display: block; }\n\n/* ───────────────────────── Link ───────────────────────── */\n.cz-link { color: rgb(var(--accent-t)); text-decoration: none; font-weight: var(--weight-medium); border-bottom: 1px solid rgb(var(--accent-t) / .35); transition: border-color var(--dur) var(--ease); }\n.cz-link:hover { border-bottom-color: rgb(var(--accent-t)); }\n\n/* ───────────────────────── States (Empty / Error) ───────────────────────── */\n.cz-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-3); padding: var(--space-8) var(--space-6);\n  border: 1px dashed var(--border); border-radius: var(--radius-lg); background: var(--bg-card); }\n.cz-state__icon { color: var(--text-3); }\n.cz-state__title { font-weight: var(--weight-semibold); color: var(--text-1); font-size: var(--text-md); }\n.cz-state__desc { font-size: var(--text-sm); color: var(--text-2); max-width: 36ch; }\n.cz-state--error .cz-state__icon { color: rgb(var(--danger)); }\n\n/* ───────────────────────── Tooltip ───────────────────────── */\n.cz-tooltip-wrap { position: relative; display: inline-flex; }\n.cz-tooltip {\n  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);\n  background: var(--brand-navy-2); color: #fff; font-size: var(--text-xs); font-weight: var(--weight-medium);\n  padding: 6px 10px; border-radius: var(--radius-sm); white-space: nowrap; pointer-events: none;\n  box-shadow: var(--shadow-overlay); z-index: var(--z-overlay); opacity: 0; transition: opacity var(--dur) var(--ease);\n}\n.cz-tooltip::after { content: \"\"; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);\n  border: 4px solid transparent; border-top-color: var(--brand-navy-2); }\n.cz-tooltip-wrap:hover .cz-tooltip, .cz-tooltip--open { opacity: 1; }\n\n/* ───────────────────────── Toast ───────────────────────── */\n.cz-toast {\n  display: flex; gap: var(--space-3); align-items: flex-start; padding: 12px 14px;\n  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated);\n  box-shadow: var(--shadow-overlay); border-left-width: 3px; animation: cz-toast-in var(--dur) var(--ease);\n}\n.cz-toast--success { border-left-color: rgb(var(--success)); }\n.cz-toast--danger  { border-left-color: rgb(var(--danger)); }\n.cz-toast--info    { border-left-color: rgb(var(--info)); }\n.cz-toast--warning { border-left-color: rgb(var(--warning)); }\n.cz-toast__icon { flex: none; margin-top: 1px; }\n.cz-toast--success .cz-toast__icon { color: rgb(var(--success)); }\n.cz-toast--danger  .cz-toast__icon { color: rgb(var(--danger)); }\n.cz-toast--info    .cz-toast__icon { color: rgb(var(--info)); }\n.cz-toast--warning .cz-toast__icon { color: rgb(var(--warning)); }\n.cz-toast__title { font-weight: var(--weight-semibold); font-size: var(--text-sm); color: var(--text-1); }\n.cz-toast__desc { font-size: var(--text-xs); color: var(--text-2); margin-top: 2px; }\n.cz-toast__close { margin-left: auto; background: none; border: 0; color: var(--text-3); cursor: pointer; padding: 2px; }\n.cz-toast__close:hover { color: var(--text-1); }\n\n/* ───────────────────────── Modal ───────────────────────── */\n.cz-modal-backdrop { position: fixed; inset: 0; background: rgba(10,11,18,.55); z-index: var(--z-modal);\n  display: flex; align-items: center; justify-content: center; padding: var(--space-4); animation: cz-overlay-fade var(--dur) var(--ease); }\n.cz-modal {\n  width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-overlay); animation: cz-overlay-pop var(--dur-slow) var(--ease); overflow: hidden;\n}\n.cz-modal--sm { max-width: 380px; }\n.cz-modal--md { max-width: 520px; }\n.cz-modal--lg { max-width: 720px; }\n.cz-modal__head { padding: var(--space-5) var(--space-6) var(--space-3); }\n.cz-modal__title { font-family: var(--font-display); font-size: var(--text-2xl); letter-spacing: .01em; color: var(--text-1); line-height: 1.1; }\n.cz-modal__desc { margin-top: var(--space-2); font-size: var(--text-sm); color: var(--text-2); }\n.cz-modal__body { padding: 0 var(--space-6) var(--space-5); }\n.cz-modal__foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-4) var(--space-6); border-top: 1px solid var(--border); background: var(--bg-card); }\n\n/* ───────────────────────── Menu (dropdown) ───────────────────────── */\n.cz-menu {\n  min-width: 180px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);\n  box-shadow: var(--shadow-overlay); padding: var(--space-1); animation: cz-overlay-pop var(--dur-fast) var(--ease);\n}\n.cz-menu__item {\n  display: flex; align-items: center; gap: var(--space-2); width: 100%; text-align: left;\n  padding: 8px 10px; border-radius: var(--radius-sm); border: 0; background: none; cursor: pointer;\n  font-family: var(--font-body); font-size: var(--text-sm); color: var(--text-1);\n  transition: background var(--dur) var(--ease);\n}\n.cz-menu__item:hover { background: var(--bg-subtle); }\n.cz-menu__item--active { color: rgb(var(--accent-t)); }\n.cz-menu__item--danger { color: rgb(var(--danger)); }\n\n/* ───────────────────────── Eyebrow / Kicker / Section head ───────────────────────── */\n.cz-eyebrow { font-family: var(--font-data); font-size: 11px; font-weight: var(--weight-semibold);\n  text-transform: uppercase; letter-spacing: var(--tracking-eyebrow); color: rgb(var(--accent-t)); }\n.cz-kicker { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-data); font-size: 11px;\n  font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-kicker); color: var(--text-3); }\n.cz-kicker::before { content: \"\"; width: 24px; height: 1px; background: rgb(var(--accent-t)); }\n<\u002Fstyle>\n<style>/* ════════════════════════════════════════════════════════════════ ng the production Tailwind setup.\n   ────────────────────────────────────────────────────────────────────────── */\n\n:root {\n  color-scheme: light;\n\n  /* ── Brand constants (theme-independent reference values) ── */\n  --brand-navy:        #0e0f15;  /* P1 locked dark canvas / foreground */\n  --brand-navy-2:      #1a1f38;  /* sidebar / on-accent text */\n  --brand-gold:        #e8c547;  /* primary accent — \"yellow jersey = winner\" */\n  --brand-gold-bright: #ffd966;  /* dark-mode accent variant / twin-lines */\n  --brand-gold-deep:   #a07800;  /* WCAG-safe gold foreground on light canvas */\n  --brand-chalk:       #f4f2ec;  /* P2 locked light canvas */\n  --brand-white:       #ffffff;\n  --brand-black:       #0a0a0f;  /* near-black w/ a hint of navy */\n\n  /* ── Surfaces — Chalk ladder: canvas → card → elevated ── */\n  --bg-body:     #f4f2ec;   /* Chalk canvas */\n  --bg-card:     #fcfbf7;   /* card */\n  --bg-elevated: #ffffff;   /* modals / popovers / raised */\n  --bg-subtle:   #ece9e1;   /* recessed inset / hover (tracks, nested panels) */\n  --border:      #e5e0d5;\n\n  /* ── Text ── */\n  --text-1: #0e0f15;   /* primary (navy) */\n  --text-2: #66637a;   /* secondary */\n  --text-3: #9896b0;   /* tertiary / muted */\n\n  /* ── Accent (RGB channels for alpha support) ── */\n  --accent:    232 197 71;   /* @kind color */  /* #e8c547 brand gold */\n  --accent-t:  160 120 0;    /* @kind color */  /* #a07800 deep-gold foreground */\n  --on-accent: #1a1f38;      /* navy text on a gold fill */\n\n  /* ── \"You\" marker — neutral navy, never gold (gold = the leader) ── */\n  --me-ring:     26 31 56;     /* @kind color */\n  --me-badge-bg: 26 31 56;     /* @kind color */\n  --me-badge-fg: 244 242 236;  /* @kind color */\n\n  /* ── Sidebar — always dark navy (option A), identical in both themes ── */\n  --bg-sidebar:       #1a1f38;\n  --bg-sidebar-hover: rgba(255, 255, 255, 0.06);\n  --border-sidebar:   rgba(255, 255, 255, 0.07);\n  --text-sidebar-1:   #ffffff;\n  --text-sidebar-2:   rgba(255, 255, 255, 0.55);\n  --text-sidebar-3:   rgba(255, 255, 255, 0.25);\n\n  /* ── Semantic states (D-SEM Set 2 — warning shifted off brand gold) ── */\n  --success:    21 119 47;    /* @kind color */  /* #15772f */\n  --success-bg: #dcfce7;\n  --danger:     168 30 30;     /* @kind color */  /* #a81e1e */\n  --danger-bg:  #fee2e2;\n  --warning:    154 91 0;      /* @kind color */  /* #9a5b00 */\n  --warning-bg: #fef3c7;\n  --info:       26 71 192;     /* @kind color */  /* #1a47c0 */\n  --info-bg:    #dbeafe;\n\n  /* ── Division accents (standings) ── */\n  --div-1: #e8c547;  /* gold */\n  --div-2: #60a5fa;  /* blue */\n  --div-3: #a78bfa;  /* violet */\n\n  /* ── External brand — Discord Blurple (CTA only) ── */\n  --discord:       88 101 242;   /* @kind color */  /* #5865F2 */\n  --discord-hover: 71 82 196;    /* @kind color */  /* #4752c4 */\n\n  /* ── Categorical chart palette (RGB triplets, theme-agnostic) ── */\n  --cz-chart-1:  96 165 250;  /* @kind color */\n  --cz-chart-2: 167 139 250;  /* @kind color */\n  --cz-chart-3:  52 211 153;  /* @kind color */\n  --cz-chart-4: 251 191  36;  /* @kind color */\n  --cz-chart-5: 248 113 113;  /* @kind color */\n  --cz-chart-6:  34 211 238;  /* @kind color */\n  --cz-chart-7: 244 114 182;  /* @kind color */\n  --cz-chart-8: 250 204  21;  /* @kind color */\n  --cz-chart-9: 148 163 184;  /* @kind color */\n}\n\n[data-theme=\"dark\"] {\n  color-scheme: dark;\n\n  --bg-body:     #0e0f15;   /* locked navy canvas (P1) */\n  --bg-card:     #161824;   /* card */\n  --bg-elevated: #1f2233;   /* elevated */\n  --bg-subtle:   #14161e;   /* recessed inset / hover */\n  --border:      #2a2d3a;\n\n  --text-1: #ededf2;\n  --text-2: #9da0b3;\n  --text-3: #888ba0;   /* AA-fixed muted */\n\n  --accent:    232 197 71;    /* @kind color */\n  --accent-t:  255 217 102;   /* @kind color */  /* bright gold on navy */\n  --on-accent: #1a1f38;\n\n  --me-ring:     237 237 242;  /* @kind color */\n  --me-badge-bg: 237 237 242;  /* @kind color */\n  --me-badge-fg: 14 15 21;     /* @kind color */\n\n  /* Sidebar identical in both themes (option A) */\n\n  --success:    95 217 138;   /* @kind color */  /* #5fd98a */\n  --success-bg: rgba(95, 217, 138, 0.12);\n  --danger:     251 132 132;  /* @kind color */  /* #fb8484 */\n  --danger-bg:  rgba(251, 132, 132, 0.12);\n  --warning:    240 168 48;   /* @kind color */  /* #f0a830 */\n  --warning-bg: rgba(240, 168, 48, 0.12);\n  --info:       122 176 251;  /* @kind color */  /* #7ab0fb */\n  --info-bg:    rgba(122, 176, 251, 0.12);\n}\n\n/* ──────────────────────────────────────────────────────────────────────────\n   Cycling Zone · Typography tokens + self-hosted brand fonts\n   Three-role hybrid (locked #481 Phase 4):\n     • Bebas Neue   — display wordmark / headlines (super-condensed)\n     • Inter Tight  — data / UI workhorse (font-mono → data), tabular numerics\n     • DM Sans      — body / prose\n   ────────────────────────────────────────────────────────────────────────── */\n\n/* Bebas Neue — display. */\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6f339da1-f32f-4e70-936a-2dea99459c4a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"08ab34f5-05ea-46f1-9415-5070e6b4267b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n\n/* Inter Tight (variable wght 100–900) — data / UI font. */\n@font-face {\n  font-family: 'Inter Tight';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"a70865dd-b1d0-4e41-afe9-e20ce5d2c412\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n@font-face {\n  font-family: 'Inter Tight';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"d76f7d7e-02e4-4555-8337-50ed7fc022b8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n\n/* DM Sans — body / prose (loaded from Google Fonts in the live app; bring your\n   own <link> in standalone pages, or it falls back to the system stack below). */\n\n:root {\n  /* Families — each carries its real production fallback stack. */\n  --font-display: 'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif;\n  --font-data:    'Inter Tight', 'Inter Tight Fallback', system-ui, sans-serif;\n  --font-body:    'DM Sans', system-ui, -apple-system, sans-serif;\n\n  /* Type scale — app data UI runs tight (12–20px); display headlines scale big.\n     Body/prose uses --font-body; data/labels use --font-data; headlines display. */\n  --text-2xs: 10px;   /* category tags, sidebar eyebrows */\n  --text-xs:  12px;   /* labels, table meta, captions */\n  --text-sm:  14px;   /* body default in the app */\n  --text-md:  15px;   /* large body / marketing lede */\n  --text-lg:  18px;   /* card headings */\n  --text-xl:  20px;   /* page titles (app) */\n  --text-2xl: 24px;   /* section display */\n  --text-3xl: 30px;   /* KPI numerals */\n  --text-4xl: 36px;\n  --text-5xl: 48px;\n  --text-6xl: 60px;\n  --text-7xl: 72px;   /* marketing hero (Bebas) */\n\n  /* Weights — Inter Tight is variable; DM Sans 400/500/600/700. */\n  --weight-regular:  400;  /* @kind font */\n  --weight-medium:   500;  /* @kind font */\n  --weight-semibold: 600;  /* @kind font */\n  --weight-bold:     700;  /* @kind font */\n  --weight-black:    900;  /* @kind font */\n\n  /* Letter-spacing — the brand leans on uppercase eyebrows w/ wide tracking. */\n  --tracking-tight:  -0.02em;  /* @kind font */\n  --tracking-normal: 0;        /* @kind font */\n  --tracking-wide:   0.08em;   /* @kind font */\n  --tracking-eyebrow: 0.16em;  /* @kind font */\n  --tracking-kicker:  0.22em;  /* @kind font */\n\n  /* Line-heights */\n  --leading-display: 0.92;   /* @kind font */\n  --leading-snug:    1.2;    /* @kind font */\n  --leading-normal:  1.5;    /* @kind font */\n  --leading-relaxed: 1.65;   /* @kind font */\n}\n\n/* ──────────────────────────────────────────────────────────────────────────\n   Cycling Zone · Spacing, radii, shadow, motion & z-index tokens\n   Restraint is the brand (BRAND_BRIEF §3): small radii, hairline borders, a\n   single overlay shadow. No glow, no decorative gradients.\n   ────────────────────────────────────────────────────────────────────────── */\n\n:root {\n  /* ── Spacing scale (4px base) ── */\n  --space-0:  0px;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n\n  /* ── Radii — deliberately tight (fundament #671) ── */\n  --radius-none: 0px;\n  --radius-sm:   5px;    /* the workhorse: buttons, inputs, cards, chips */\n  --radius-md:   8px;    /* nav items, larger cards */\n  --radius-lg:   12px;   /* app data tables / panels */\n  --radius-pill: 9999px; /* badges, marketing chips */\n\n  /* ── Borders ── */\n  --border-width: 1px;     /* hairline is the default */\n  --border-width-accent: 2px; /* the gold top-rule on section headers */\n\n  /* ── Motion — short, precise, eased. No bounce. ── */\n  --dur-fast: 120ms;  /* @kind other */\n  --dur:      150ms;  /* @kind other */\n  --dur-slow: 240ms;  /* @kind other */\n  --ease: cubic-bezier(.2, .7, .2, 1);  /* @kind other */\n\n  /* ── Shadow — one overlay shadow only (modals / popovers). ── */\n  --shadow-overlay: 0 12px 28px -10px rgba(14, 15, 21, .18);\n\n  /* ── Z-index ladder ── */\n  --z-base: 0;          /* @kind other */\n  --z-dropdown: 1000;   /* @kind other */\n  --z-sticky: 1100;     /* @kind other */\n  --z-overlay: 1200;    /* @kind other */\n  --z-modal: 1300;      /* @kind other */\n  --z-toast: 1400;      /* @kind other */\n\n  /* ── Layout ── */\n  --sidebar-width: 208px;   /* w-52 */\n  --content-max: 1152px;    /* max-w-6xl readable column */\n  --content-max-wide: 1600px;\n}\n\n[data-theme=\"dark\"] {\n  /* Deeper overlay shadow on the navy canvas */\n  --shadow-overlay: 0 12px 30px -8px rgba(0, 0, 0, .6);\n}\n\n/* ──────────────────────────────────────────────────────────────────────────\n   Cycling Zone · Global base\n   Body defaults, keyboard focus ring, and the brand motion keyframes\n   (skeleton shimmer, overlay reveals, price pulse). All respect\n   prefers-reduced-motion (a hard requirement in the source system).\n   ────────────────────────────────────────────────────────────────────────── */\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--bg-body);\n  color: var(--text-1);\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Metric-matched fallback for the data font (keeps the webfont swap CLS-free). */\n@font-face {\n  font-family: 'Inter Tight Fallback';\n  src: local('Arial');\n  ascent-override: 87.37%;\n  descent-override: 21.76%;\n  line-gap-override: 0.00%;\n  size-adjust: 110.88%;\n}\n\n/* Data / numeric font helper — tabular figures keep number columns aligned. */\n.font-data,\n.font-mono {\n  font-family: var(--font-data);\n  font-variant-numeric: tabular-nums;\n}\n\n/* Keyboard-only focus ring (:focus-visible). Outline (not box-shadow) survives\n   high-contrast mode; accent-t is theme-aware (deep-gold light / bright dark). */\n:where(a, button, input, select, textarea, [tabindex=\"0\"], [role=\"button\"]):focus-visible {\n  outline: 2px solid rgb(var(--accent-t));\n  outline-offset: 1px;\n  border-radius: var(--radius-sm);\n}\n\n/* ── Price pulse-flash (gold) — live auction current-price change ── */\n@keyframes cz-pulse-flash {\n  0%   { background-color: rgb(var(--accent) / 0); }\n  20%  { background-color: rgb(var(--accent) / 0.45); }\n  100% { background-color: rgb(var(--accent) / 0); }\n}\n.cz-pulse-flash { animation: cz-pulse-flash 1.5s ease-out; border-radius: 4px; }\n\n/* ── Skeleton shimmer — discrete accent-t sweep, no glow ── */\n@keyframes cz-shimmer { 100% { transform: translateX(100%); } }\n@keyframes cz-spin { to { transform: rotate(360deg); } }\n\n/* ── Overlay reveals — discrete fade / pop / slide, no glow ── */\n@keyframes cz-overlay-fade { from { opacity: 0; } to { opacity: 1; } }\n@keyframes cz-overlay-pop  { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }\n@keyframes cz-toast-in     { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.001ms !important;\n  }\n}\n\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Cycling Zone · Component styles\n   Ported from the production Tailwind primitives (frontend/src/components/ui).\n   All values reference the design tokens — no hard-coded brand hex here.\n   The JSX components apply these classes; this file ships in the styles.css\n   closure so consumers get the components fully styled.\n   ══════════════════════════════════════════════════════════════════════════ */\n\n/* ───────────────────────── Button ───────────────────────── */\n.cz-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  font-family: var(--font-body);\n  font-weight: var(--weight-semibold);\n  border-radius: var(--radius-sm);\n  border: 1px solid transparent;\n  cursor: pointer;\n  white-space: nowrap;\n  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease),\n    border-color var(--dur) var(--ease), filter var(--dur) var(--ease), transform var(--dur-fast) var(--ease);\n}\n.cz-btn:disabled { opacity: .4; pointer-events: none; }\n.cz-btn--sm { padding: 6px 12px;  font-size: var(--text-xs); }\n.cz-btn--md { padding: 10px 16px; font-size: var(--text-sm); }\n.cz-btn--lg { padding: 12px 20px; font-size: var(--text-md); }\n.cz-btn--full { width: 100%; }\n\n.cz-btn--primary { background: rgb(var(--accent)); color: var(--on-accent); border-color: transparent; }\n.cz-btn--primary:hover:not(:disabled) { filter: brightness(1.05); }\n.cz-btn--primary:active:not(:disabled) { transform: translateY(1px); }\n\n.cz-btn--secondary { background: transparent; color: var(--text-1); border-color: var(--border); }\n.cz-btn--secondary:hover:not(:disabled) { border-color: var(--text-3); }\n\n.cz-btn--ghost { background: transparent; color: var(--text-2); border-color: transparent; }\n.cz-btn--ghost:hover:not(:disabled) { background: var(--bg-subtle); color: var(--text-1); }\n\n.cz-btn--danger { background: transparent; color: rgb(var(--danger)); border-color: rgb(var(--danger) / .5); }\n.cz-btn--danger:hover:not(:disabled) { background: rgb(var(--danger) / .1); }\n\n.cz-btn--discord { background: rgb(var(--discord)); color: #fff; border-color: transparent; }\n.cz-btn--discord:hover:not(:disabled) { background: rgb(var(--discord-hover)); }\n\n.cz-btn__spinner {\n  width: 14px; height: 14px; border-radius: var(--radius-pill);\n  border: 2px solid currentColor; border-top-color: transparent;\n  animation: cz-spin .6s linear infinite;\n}\n\n/* ───────────────────────── Card ───────────────────────── */\n.cz-card {\n  border-radius: var(--radius-sm);\n  border: 1px solid var(--border);\n  background: var(--bg-card);\n}\n.cz-card--interactive { transition: border-color var(--dur) var(--ease); cursor: pointer; }\n.cz-card--interactive:hover { border-color: var(--text-3); }\n\n/* ───────────────────────── Status badge (broadcast) ───────────────────────── */\n.cz-status {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-family: var(--font-data); font-size: 11px; font-weight: var(--weight-semibold);\n  text-transform: uppercase; letter-spacing: var(--tracking-wide); font-variant-numeric: tabular-nums;\n}\n.cz-status--info    { color: rgb(var(--info)); }\n.cz-status--success { color: rgb(var(--success)); }\n.cz-status--danger  { color: rgb(var(--danger)); }\n.cz-status--warning { color: rgb(var(--warning)); }\n.cz-status--emphasis { border-radius: var(--radius-sm); padding: 2px 8px; }\n.cz-status--info.cz-status--emphasis    { background: rgb(var(--info) / .1); }\n.cz-status--success.cz-status--emphasis { background: rgb(var(--success) / .1); }\n.cz-status--danger.cz-status--emphasis  { background: rgb(var(--danger) / .1); }\n.cz-status--warning.cz-status--emphasis { background: rgb(var(--warning) / .1); }\n.cz-status__dot { width: 6px; height: 6px; border-radius: var(--radius-pill); background: currentColor; }\n.cz-status__dot--pulse { animation: cz-pulse-dot 1.4s ease-in-out infinite; }\n@keyframes cz-pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }\n\n/* ───────────────────────── Category tag ───────────────────────── */\n.cz-tag {\n  display: inline-flex; align-items: center;\n  font-family: var(--font-data); font-size: 10px; font-weight: var(--weight-semibold);\n  text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-2);\n  border-radius: var(--radius-sm); border: 1px solid var(--border); background:
