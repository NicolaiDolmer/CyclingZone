<style>
@font-face { font-family: "Bebas Neue"; src: url(fonts/bebas-neue-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: block; }

@font-face { font-family: "Inter Tight"; src: url(fonts/inter-tight-latin-ext-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }

:root {
  --bg-body: #f4f2ec; --bg-card: #fcfbf7; --bg-elevated: #ffffff; --bg-subtle: #ece9e1;
  --border: #e5e0d5; --text-1: #0e0f15; --text-2: #66637a; --text-3: #9896b0;
  --accent: rgb(232 197 71); --accent-t: rgb(160 120 0); --accent-10: rgb(232 197 71 / .10);
  --sidebar: #1a1f38; --sidebar-2: rgba(255,255,255,.55); --sidebar-3: rgba(255,255,255,.25); --sidebar-border: rgba(255,255,255,.07);
  --success: rgb(21 119 47); --danger: rgb(168 30 30); --warning: rgb(154 91 0); --info: rgb(26 71 192);
  --warning-bg: rgba(154,91,0,.08); --success-bg: rgba(21,119,47,.08);
  --pin: #c2185b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-body); color: var(--text-1); font-family: "DM Sans", system-ui, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
.data { font-family: "Inter Tight", "DM Sans", sans-serif; font-variant-numeric: tabular-nums; }
.num { font-family: "Inter Tight", sans-serif; font-variant-numeric: tabular-nums; }
.micro { font-family: "Inter Tight", sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); font-weight: 600; }
.micro11 { font-family: "Inter Tight", sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.s12 { width: 12px; height: 12px; } .ico.s14 { width: 14px; height: 14px; } .ico.s20 { width: 20px; height: 20px; } .ico.s22 { width: 22px; height: 22px; }

/* ── Knapper ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 5px; font-weight: 600; font-size: 13px; height: 34px; padding: 0 14px; white-space: nowrap; }
.btn-primary { background: var(--accent); color: #0e0f15; }
.btn-secondary { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-1); font-weight: 500; }
.btn-quiet { color: var(--accent-t); font-weight: 500; font-size: 12px; padding: 0 4px; height: auto; }
.btn-lg { height: 44px; width: 100%; font-size: 15px; }
.select { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-elevated); font-size: 12px; color: var(--text-1); }
.check { width: 16px; height: 16px; border: 1.5px solid var(--text-3); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; background: var(--bg-elevated); flex: none; }
.check.on { background: var(--text-1); border-color: var(--text-1); color: var(--bg-card); }

/* ── Kort ── */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; }

/* ── Faner ── */
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--border); }
.tab { font-size: 14px; font-weight: 500; color: var(--text-3); padding: 10px 2px 11px; margin-bottom: -1px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--text-1); border-bottom-color: var(--accent); }
.tab .cnt { font-family: "Inter Tight"; font-size: 11px; color: var(--text-3); margin-left: 4px; }

/* ── Desktop-skal ── */

.logo { font-family: "Bebas Neue"; color: var(--accent); font-size: 21px; letter-spacing: .02em; text-align: center; padding: 22px 0 0; }
.logo-rule { width: 128px; height: 1px; background: var(--accent); margin: 3px auto 0; }

.sb-block { border-top: 1px solid var(--sidebar-border); padding: 14px 16px; }
.sb-label { font-family: "Inter Tight"; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--sidebar-3); font-weight: 600; }
.sb-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin: 0 8px; font-size: 13.5px; color: rgba(255,255,255,.8); border-radius: 5px; }
.sb-item::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.3); }

.sb-sec { display: flex; justify-content: space-between; padding: 16px 16px 6px; }
.main { flex: 1; min-width: 0; }
.page { max-width: 1600px; margin: 0 auto; padding: 28px 32px 64px; }

.ph h1 { font-family: "Inter Tight"; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.ph .sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }
.ph .sub b { color: var(--text-1); font-weight: 600; }

/* ── Overblik ── */
.ov { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) 1.25fr; margin: 16px 0 14px; }
.ov-cell { padding: 12px 16px; border-left: 1px solid var(--border); text-align: left; display: block; }
.ov-cell:first-child { border-left: 0; }
.ov-val { font-family: "Inter Tight"; font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 650; line-height: 1; display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.ov-val .ctx { font-family: "DM Sans"; font-size: 12px; font-weight: 400; color: var(--text-2); }
.ov-cell.warn .ov-val > span:first-child { color: var(--warning); }
.ov-cell.active { background: var(--bg-subtle); }
.ov-run { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ov-link { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; color: var(--accent-t); font-weight: 500; margin-top: 6px; }

/* ── Tabel ── */

.sel-count { font-size: 13px; font-weight: 600; }
table { border-collapse: collapse; width: 100%; }

td { padding: 6px 12px; border-top: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
tr:first-child td { border-top: 0; }
th.c, td.c { text-align: center; } th.r, td.r { text-align: right; }
th.rd { width: 92px; text-align: center; padding-left: 4px; padding-right: 4px; }
td.rd { text-align: center; padding-left: 4px; padding-right: 4px; }
.th-group { border-bottom: 0; padding-bottom: 0; padding-top: 7px; text-align: center; color: var(--text-2); }
.name { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; }
.name .ico { color: var(--text-3); }
.subl { font-family: "Inter Tight"; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin-top: 1px; }
.cell { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 62px; padding: 3px 6px; border-radius: 4px; font-family: "Inter Tight"; font-size: 12px; font-weight: 600; }
.cell.race { background: var(--text-1); color: var(--bg-card); }
.cell.recov { color: var(--text-2); font-weight: 500; }
.cell.rest { color: var(--text-3); font-weight: 500; }
.cell.none { color: var(--text-3); font-weight: 500; }
.nodaycell { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px; border: 1px dashed var(--border); border-radius: 5px; font-size: 12px; color: var(--warning); background: var(--warning-bg); }
.nodaycell .btn-quiet { color: var(--accent-t); }
.daychip { display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 150px; height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-elevated); font-size: 12.5px; }
.daychip .t { color: var(--text-3); font-size: 11px; }
.daychip.unset { border-style: dashed; color: var(--accent-t); font-weight: 600; background: var(--bg-card); }
.saved { display: inline-flex; align-items: center; gap: 3px; color: var(--success); font-size: 11px; font-weight: 600; margin-left: 8px; }
.bar { position: relative; height: 6px; background: var(--bg-subtle); border-radius: 3px; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text-1); border-radius: 3px; }
.meter { display: flex; align-items: center; gap: 8px; }
.meter .bar { width: 46px; }
.meter .v { font-family: "Inter Tight"; font-variant-numeric: tabular-nums; font-size: 12.5px; width: 22px; text-align: right; }
.fat-hi .v { color: var(--warning); font-weight: 700; }
.fat-hi .bar > i { background: var(--warning); }
tr.sel td { background: var(--bg-subtle); }
tr.open td { background: var(--bg-subtle); }
.detail td { background: var(--bg-subtle); border-top: 0; padding: 4px 12px 14px 58px; }
.dgrid { display: grid; grid-template-columns: 210px 1fr 1fr auto; gap: 28px; align-items: start; background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; padding: 14px 16px; }
.kv { display: grid; grid-template-columns: auto auto auto; gap: 4px 18px; }
.kv .v { font-family: "Inter Tight"; font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 650; }
.prog { display: grid; grid-template-columns: 78px 26px 1fr 34px; gap: 6px 8px; align-items: center; font-size: 12.5px; }
.prog .bar { width: 100%; } .prog .p { font-family: "Inter Tight"; font-size: 11px; color: var(--text-2); text-align: right; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.wk span { text-align: center; font-family: "Inter Tight"; font-size: 10px; padding: 3px 0; border-radius: 3px; border: 1px solid var(--border); background: var(--bg-elevated); }
.wk b { display: block; font-size: 10px; color: var(--text-3); font-weight: 600; letter-spacing: .06em; }
.wk .today { border-color: var(--text-1); }
.count-line { font-family: "Inter Tight"; font-size: 12px; color: var(--text-3); padding: 10px 2px; }

/* ── Ugeplan (7 x 5) ── */
.wp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
.wp-title { font-size: 15px; font-weight: 600; }
.wp-expl { font-size: 13px; color: var(--text-2); padding: 12px 16px 4px; }
.wp-expl b { color: var(--text-1); font-weight: 600; }
.wp { display: grid; border-top: 1px solid var(--border); }
.wp > div { border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; position: relative; }
.wp .hd { font-family: "Inter Tight"; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; background: var(--bg-subtle); padding: 6px 2px; }
.wp .day { justify-content: space-between; padding: 0 10px; font-weight: 600; font-size: 13px; border-left: 0; }
.wp .day .ico { color: var(--text-3); }
.wp .def { font-size: 12.5px; justify-content: space-between; padding: 0 10px; background: var(--bg-card); }
.wp .c { font-family: "Inter Tight"; font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--bg-elevated); flex-direction: column; gap: 1px; }
.wp .c.recov { color: var(--text-1); font-weight: 700; }
.wp .c.rest { color: var(--text-3); font-weight: 500; background: var(--bg-card); }
.wp .c .rc { display: inline-flex; align-items: center; gap: 2px; font-size: 10px; font-weight: 700; color: var(--bg-card); background: var(--text-1); border-radius: 3px; padding: 0 4px; line-height: 15px; }
.wp .c.ovr::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--text-2); }
.wp .past { opacity: .5; }
.wp .todayrow { box-shadow: none; }
.wp .todaylbl { font-family: "Inter Tight"; font-size: 9.5px; letter-spacing: .08em; font-weight: 700; color: var(--bg-card); background: var(--text-1); border-radius: 3px; padding: 1px 4px; }
.wp-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 16px; font-size: 11.5px; color: var(--text-2); border-bottom: 1px solid var(--border); }
.wp-legend .k { font-family: "Inter Tight"; font-weight: 700; color: var(--text-1); }
.wp-foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.own { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; font-size: 13px; }

.m { width: 390px; min-height: 844px; background: var(--bg-body); position: relative; }

.m-logo { font-family: "Bebas Neue"; color: var(--accent); font-size: 17px; letter-spacing: .02em; border-bottom: 1px solid var(--accent); line-height: 1.05; }
.m-body { padding: 16px 16px 90px; }
.m-ph h1 { font-family: "Inter Tight"; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }

.m table th { padding: 6px 4px; font-size: 10px; }
.m table td { padding: 0 3px; height: 44px; border-top: 1px solid var(--border); }
.m .namecell { padding-left: 10px; width: 136px; max-width: 136px; border-right: 1px solid var(--border); }
.m .mname { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .cell { min-width: 0; width: 100%; padding: 3px 1px; font-size: 11px; }

.m-nav div { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.m .wp-head { padding: 10px 12px; }
.m .wp-expl { padding: 10px 12px 2px; font-size: 12.5px; }
.m .wp .day { padding: 0 8px; font-size: 12.5px; }
.m .wp .c { font-size: 11px; }
.m .wp-legend { padding: 8px 12px; gap: 4px 12px; font-size: 11px; }
.m .wp-foot { padding: 10px 12px; }
.m .own { padding: 10px 12px; }

/* ── Landscape ── */
.l { width: 844px; height: 390px; background: var(--bg-body); position: relative; overflow: hidden; }
.l-top { height: 40px; background: var(--sidebar); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #fff; }

.l .ph { margin-bottom: 4px; }
.l .tabs { gap: 20px; }
.l .tab { padding: 7px 2px 8px; font-size: 13.5px; }
.l-ov { display: flex; gap: 8px; align-items: center; }
.l-chip { display: inline-flex; align-items: baseline; gap: 5px; border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; background: var(--bg-card); font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
.l-chip b { font-family: "Inter Tight"; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--text-1); }
.l-chip.warn b { color: var(--warning); }
.l table td { padding: 0 6px; height: 40px; }
.l table th { padding: 5px 6px; }

/* ── Pins ── */
.pin { position: absolute; z-index: 50; width: 26px; height: 26px; border-radius: 50%; background: var(--pin); color: #fff; font-family: "Inter Tight"; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; pointer-events: none; }
.pinbox { position: absolute; z-index: 49; border: 2px solid var(--pin); border-radius: 6px; pointer-events: none; }
.view { display: none; }
.view.on { display: block; }

function rdCells(r) {

    if (r.kind === "rest") return { k: "rest", l: "Rest" };
    if (r.kind === "recov") return { k: "recov", l: "Recov" };
    if (rd === 3) return { k: "recov", l: "Recov" }; // holdets ugeplan: onsdag LD3 = Recovery
    return { k: "", l: r.sh };
  });
}

const params = new URLSearchParams(location.search);

function placePins() {
  document.querySelectorAll(".pin, .pinbox").forEach((p) => p.remove());
  if (params.get("pins") !== "1") return;
  const only = view === "mobile-week" ? ["6", "2"] : view === "landscape" ? ["7"] : null;
  document.querySelectorAll("[data-pin]").forEach((el) => {
    const n = el.getAttribute("data-pin");
    if (only && !only.includes(n)) return;
    if (view === "mobile-week" && n === "2") return;
    const r = el.getBoundingClientRect();
    const box = document.createElement("div");
    box.className = "pinbox";
    Object.assign(box.style, { left: `${r.left + scrollX - 3}px`, top: `${r.top + scrollY - 3}px`, width: `${r.width + 6}px`, height: `${r.height + 6}px` });
    const p = document.createElement("div");
    p.className = "pin";
    p.textContent = n;
    const px = Math.max(2, Math.min(r.left + scrollX - 13, document.documentElement.scrollWidth - 30));
    const py = Math.max(2, r.top + scrollY - 13);
    Object.assign(p.style, { left: `${px}px`, top: `${py}px` });
    if (view !== "landscape") document.body.appendChild(box);
    document.body.appendChild(p);
  });
}
document.fonts.ready.then(() => { placePins(); document.body.setAttribute("data-ready", "1"); });
</script>
</body>
