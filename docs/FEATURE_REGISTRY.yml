# FEATURE REGISTRY — eneste kilde til "hvad er live" (#4921)
#
# REGLEN: tilstand afledes, aldrig fortælles. En post beskriver hvad der findes
# i kode og i prod-flag — ikke hvad vi håber, planlægger eller husker. Er du i
# tvivl om en tilstand: verificér i kode eller i app_config, eller lad posten
# være. En gætte-post er værre end ingen post.
#
# docs/FEATURE_STATUS.md er GENERERET fra denne fil og redigeres aldrig i hånden:
#   node scripts/generate-feature-status.mjs           # regenerér
#   node scripts/generate-feature-status.mjs --check    # CI-gate
#   node scripts/check-feature-registry-flags.mjs       # gate mod prod app_config
#
# SKEMA (ét fladt objekt pr. post, ingen indlejring):
#   id        kebab-case, unik. Stabil — omdøb ikke uden grund.
#   area      race-engine | race-day | market | squad | training | academy |
#             season | economy | club | board | social | stats | onboarding |
#             comms | billing | ops
#   title_en  engelsk titel (EN-first, jf. sprogreglen)
#   title_da  dansk titel
#   state     idea | spec | building | dormant | beta | live | retired
#             dormant = bygget færdigt, men bevidst slukket i prod (#4928) —
#             adskiller sig fra `building` ("nogen koder på det") ved at koden
#             er komplet og kun flaget mangler. Kræver `note` med hvem/hvad
#             der flipper den. Genereret status-fil viser dormant som egen
#             rækkegruppe efter beta.
#   flag      app_config-nøgle (valgfri). Sæt den KUN hvis rækken faktisk findes
#             i prod app_config — check-feature-registry-flags.mjs fejler på en
#             nøgle der ikke findes. Dormante flag-NØGLER (rækken findes ikke i
#             app_config = off pr. fail-safe) hører i `note`, ikke i `flag` —
#             forveksl ikke med `state: dormant`, som netop KRÆVER en rigtig
#             `flag`-række (den er bygget og målt, blot slukket).
#   ssot      SSOT-dokument for området (valgfri), sti relativt til repo-roden
#   epic      GitHub-issue-nummer for epic'en (valgfri, uden #)
#   verified  YYYY-MM-DD — hvornår tilstanden sidst blev verificeret mod kode/prod
#   note      max 1 linje. Kun det der ikke kan udledes af felterne ovenfor.
#             Obligatorisk ved state: dormant.
#
# FLAG-GATEN (check-feature-registry-flags.mjs):
#   state: live    + flag → flagværdi skal være on/true
#   state: beta    + flag → flagværdi skal være beta
#   state: dormant + flag → flagværdi må IKKE være on/true (identisk med
#                            building) — posten skal have en note om flippet
#   andre states   + flag → flagværdi må IKKE være on/true
#   flag der ikke findes i app_config → fail
#   verified ældre end 60 dage → advarsel (ikke fail)
#
# HARD RULE 30 (e): flag-flip, feature-luk/retire eller ny kernefunktion
# opdaterer denne fil i SAMME PR.

